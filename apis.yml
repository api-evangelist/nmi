- name: NMI Customer-Present Cloud API
  description: The NMI Customer-Present Cloud API enables browser-based point-of-sale payment processing without software installation. Supports
    cloud device registration and control, payment requests on connected devices, device prompts including menu, signature, and yes/no interactions,
    and QR code display for in-person payment scenarios.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.nmi.com/docs/introduction-to-the-customer-present-cloud-api
