apis:
- name: NMI Three Step Redirect API
  description: >-
    The NMI Three Step Redirect API keeps merchants outside the scope of transmitting sensitive payment
    data by routing cardholder information directly to NMI servers. Supports transaction, recurring billing,
    and customer vault operations with reduced PCI compliance scope for merchants.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://secure.networkmerchants.com/gw/merchants/resources/integration/integration_portal.php
  baseURL: https://secure.networkmerchants.com
  tags:
  - Payments
  - PCI Compliance
  - Redirect
  - Tokenization
  properties:
  - type: Documentation
    url: >-
      https://secure.networkmerchants.com/gw/merchants/resources/integration/integration_portal.php
  contact:
  - FN: NMI Developer Support
    url: https://support.nmi.com
    email: ''
  aid: nmi:nmi-three-step-redirect-api
- name: NMI Customer-Present Cloud API
  description: >-
    The NMI Customer-Present Cloud API enables browser-based point-of-sale payment processing without
    software installation. Supports cloud device registration and control, payment requests on connected
    devices, device prompts including menu, signature, and yes/no interactions, and QR code display for
    in-person payment scenarios.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.nmi.com/docs/introduction-to-the-customer-present-cloud-api
  baseURL: https://secure.networkmerchants.com
  tags:
  - In-Person Payments
  - Point-of-Sale
  - Device Management
  - Cloud POS
