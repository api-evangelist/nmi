name: NMI

description: NMI is a global embedded payments enablement platform providing full-stack payment technology with REST APIs for payment processing,
  tokenization, recurring billing, customer vault management, and payment facilitation across ecommerce, in-person, mobile, and unattended acquisition
  channels. With over 20 years of operation, NMI connects 1.2 million active merchants, 6,000 channel partners, and 150+ processor connections,
  processing over $502 billion in annual payments volume.

