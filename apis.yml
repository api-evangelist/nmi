- name: NMI Three Step Redirect API
  description: The NMI Three Step Redirect API keeps merchants outside the scope of transmitting sensitive payment data by routing cardholder
    information directly to NMI servers. Supports transaction, recurring billing, and customer vault operations with reduced PCI compliance scope
    for merchants.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://secure.networkmerchants.com/gw/merchants/resources/integration/integration_portal.php
