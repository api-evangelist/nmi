        maxResults: 100
        ids:
        - '10490'
        parentAffiliateId: '10123'
        search: ''
        offset: 0
  securitySchemes:
    merchantApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Merchant API key for RESTful API authentication. This key is used for merchant-specific API access and can be generated from the merchant portal.
