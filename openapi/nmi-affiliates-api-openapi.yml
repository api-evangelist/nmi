            general:
              email: support@acme.com
              phone: 555-555-5555
              name: Jane Doe
            check:
              email: ''
              phone: ''
              name: ''
            accounting:
              email: ''
              phone: ''
              name: ''
            riskManagement:
              email: ''
              phone: ''
              name: ''
            accountManagement:
              email: ''
              phone: ''
              name: ''
            marketing:
              email: ''
              phone: ''
              name: ''
            technical:
              email: ''
              phone: ''
