openapi: 3.2.0
info:
  version: 1.0.0
  title: Payments Customers API
  description: Our payments platform exposes two generations of API.
  x-logo:
    url: https://www.nmi.com/app/themes/nmi/images/NMI_Logo_Primary.webp
servers:
- url: https://sandbox.nmi.com/api
security: []
tags:
- name: Customers
  description: Customer vault management endpoints
paths:
  /v5/customers:
    post:
      tags:
      - Customers
      operationId: create-customer-v5
      summary: Create Customer
      description: Create a new customer in the customer vault with billing and optional shipping information. The billing field can be either a single object or an array of objects to create multiple billing addresses at once.
      security:
      - merchantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '200':
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
    get:
      tags:
      - Customers
      operationId: list-customers-v5
      summary: List Customers
      description: 'Retrieve a list of customers for the merchant with optional filtering and cursor-based pagination.


        To look up a single customer by its vault ID, use **Get Customer**; to look up a specific billing address, use **Get Billing Address**.'
      security:
      - merchantApiKey: []
      parameters:
      - name: first_name
        in: query
        required: false
        description: Filter by first name
        schema:
          type: string
      - name: last_name
        in: query
        required: false
        description: Filter by last name
        schema:
          type: string
      - name: email
        in: query
        required: false
        description: Filter by email address
        schema:
          type: string
          format: email
      - name: account_number
        in: query
        required: false
        description: Filter by the last 4 digits of the payment account number.
        schema:
          type: string
          pattern: ^\d{4}$
          minLength: 4
          maxLength: 4
      - name: date_from
        in: query
        required: false
        description: Filter customers created on or after this date. Must be a valid calendar date in YYYY-MM-DD format.
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        required: false
        description: Filter customers created on or before this date. Must be a valid calendar date in YYYY-MM-DD format.
        schema:
          type: string
          format: date
      - name: cursor
        in: query
        required: false
        description: Cursor for pagination, returned as `next_cursor` on the previous page. Omit for the first page.
        schema:
          type: string
          maxLength: 512
      - name: per_page
        in: query
        required: false
        description: 'Number of customers to return per page (default: 10, max: 100)'
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerResponse'
                  per_page:
                    type: integer
                  next_cursor:
                    type: string
                    nullable: true
                    description: Cursor for the next page. Pass it as the `cursor` parameter on the next request. Omitted when there are no more results.
        '400':
          description: Bad Request - Validation Error. For example, `date_from` or `date_to` is not a valid YYYY-MM-DD calendar date, or an unsupported query parameter was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '422':
          description: Unprocessable request. The request was well-formed but cannot be fulfilled as sent — for example, the search matched too many records to return. Narrow the results with filters such as a date range and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v5/customers/{customer_id}:
    get:
      tags:
      - Customers
      operationId: get-customer-v5
      summary: Get Customer
      description: Retrieve a specific customer by its ID.
      security:
      - merchantApiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: The customer vault ID to retrieve.
        schema:
          type: string
          maxLength: 36
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          description: Unauthorized
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Customers
      operationId: update-customer-v5
      summary: Update Customer
      description: Update an existing customer. Supports bulk updates of billing and shipping addresses. All provided billing and shipping addresses will be updated.
      security:
      - merchantApiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: The customer vault ID to update.
        schema:
          type: string
          maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Customers
      operationId: delete-customer-v5
      summary: Delete Customer
      description: Delete a customer from the customer vault. This will remove the customer and all associated billing and shipping addresses.
      security:
      - merchantApiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: The customer vault ID to delete.
        schema:
          type: string
          maxLength: 36
      responses:
        '204':
          description: Customer deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v5/customers/{customer_id}/billing:
    post:
      tags:
      - Customers
      operationId: add-billing-address-v5
      summary: Add Billing Address
      description: Add a billing address and payment method to an existing customer.
      security:
      - merchantApiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: The customer vault ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerBilling'
            examples:
              cardBilling:
                summary: Add billing with card
                description: Card payment details.
                value:
                  id: BILL-002
                  first_name: John
                  last_name: Doe
                  company: Test Company
                  address1: 789 Pine St
                  address2: Apt 2B
                  city: Springfield
                  state: IL
                  zip: '62701'
                  country: US
                  phone: 555-111-2222
                  email: john.doe@example.com
                  fax: 555-111-2223
                  currency: USD
                  priority: 2
                  payment_details:
                    card_number: '4111111111111111'
                    card_exp: '1225'
              achBilling:
                summary: Add billing with ACH
                description: ACH payment details.
                value:
                  id: BILL-ACH-001
                  first_name: Jane
                  last_name: Doe
                  address1: 123 Main St
                  city: Anytown
                  state: CA
                  zip: '12345'
                  country: US
                  phone: 555-123-4567
                  email: jane@example.com
                  currency: USD
                  payment_details:
                    check_account: 1234567890
                    check_aba: 123123123
                    check_name: Jane Doe
                    account_type: checking
                    account_holder_type: personal
                    sec_code: PPD
              decryptedApplePay:
                summary: Add billing with decrypted Apple Pay
                description: Decrypted Apple Pay with cardholder_auth.
                value:
                  id: BILL-WALLET-001
                  first_name: Jane
                  last_name: Doe
                  address1: 123 Main St
                  city: Anytown
                  state: CA
                  zip: '12345'
                  country: US
                  phone: 555-123-4567
                  email: jane@example.com
                  currency: USD
                  payment_details:
                    decrypted_applepay_data: true
                    card_number: '4111111111111111'
                    card_exp: '1225'
                  cardholder_auth:
                    cavv: wallet-cryptogram
                    eci: '05'
              paymentToken:
                summary: Add billing with payment token
                description: Payment token from the [Payment Component](../docs/payment-component) or [Collect.js](https://secure.networkmerchants.com/merchants/resources/integration/integration_portal.php#cjs_methodology).
                value:
                  id: BILL-TOKEN-001
                  first_name: Jane
                  last_name: Doe
                  address1: 123 Main St
                  city: Anytown
                  state: CA
                  zip: '12345'
                  country: US
                  phone: 555-123-4567
                  email: jane@example.com
                  payment_details:
                    payment_token: tok_example_123
      responses:
        '200':
          description: Billing address added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v5/customers/{customer_id}/billing/{billing_id}:
    get:
      tags:
      - Customers
      operationId: get-billing-address-v5
      summary: Get Billing Address
      description: Retrieve a specific billing address for a customer.
      security:
      - merchantApiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: The customer vault ID.
        schema:
          type: string
          maxLength: 36
      - name: billing_id
        in: path
        required: true
        description: The billing address ID.
        schema:
          type: string
          maxLength: 32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAddressResponse'
        '401':
          description: Unauthorized
        '404':
          description: Customer or billing address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Customers
      operationId: update-billing-address-v5
      summary: Update Billing Address
      description: Update a customer billing address.
      security:
      - merchantApiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: The customer vault ID.
        schema:
          type: string
          maxLength: 36
      - name: billing_id
        in: path
        required: true
        description: The billing address ID to update.
        schema:
          type: string
          maxLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerVaultBillingRequest'
      responses:
        '200':
          description: Billing address updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Customer or billing address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Customers
      operationId: delete-billing-address-v5
      summary: Delete Billing Address
      description: Delete a billing address from a customer. The customer must have at least one billing address remaining.
      security:
      - merchantApiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: The customer vault ID.
        schema:
          type: string
          maxLength: 36
      - name: billing_id
        in: path
        required: true
        description: The billing address ID to delete.
        schema:
          type: string
          maxLength: 32
      responses:
        '200':
          description: Billing address deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Bad Request - Customer must have at least one billing address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Customer or billing address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v5/customers/{customer_id}/shipping:
    post:
      tags:
      - Customers
      operationId: add-shipping-address-v5
      summary: Add Shipping Address
      description: Add a new shipping address to an existing customer.
      security:
      - merchantApiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: The customer vault ID.
        schema:
          type: string
          maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingAddressRest'
      responses:
        '200':
          description: Shipping address added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v5/customers/{customer_id}/shipping/{shipping_id}:
    get:
      tags:
      - Customers
      operationId: get-shipping-address-v5
      summary: Get Shipping Address
      description: Retrieve a specific shipping address for a customer.
      security:
      - merchantApiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: The customer vault ID.
        schema:
          type: string
          maxLength: 36
      - name: shipping_id
        in: path
        required: true
        description: The shipping address ID.
        schema:
          type: string
          maxLength: 32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - shipping
                  id:
                    type: string
                  first_name:
                    type: string
                  last_name:
                    type: string
                  company:
                    type: string
                  address1:
                    type: string
                  address2:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                  zip:
                    type: string
                  country:
                    type: string
                  phone:
                    type: string
                  email:
                    type: string
                    format: email
                  fax:
                    type: string
                  priority:
                    type: integer
                    nullable: true
                required:
                - object
                - id
        '401':
          description: Unauthorized
        '404':
          description: Customer or shipping address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Customers
      operationId: update-shipping-address-v5
      summary: Update Shipping Address
      description: Update an existing shipping address for a customer.
      security:
      - merchantApiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: The customer vault ID.
        schema:
          type: string
          maxLength: 36
      - name: shipping_id
        in: path
        required: true
        description: The shipping address ID to update.
        schema:
          type: string
          maxLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingAddressRest'
      responses:
        '200':
          description: Shipping address updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Customer or shipping address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Customers
      operationId: delete-shipping-address-v5
      summary: Delete Shipping Address
      description: Delete a shipping address from a customer.
      security:
      - merchantApiKey: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: The customer vault ID.
        schema:
          type: string
          maxLength: 36
      - name: shipping_id
        in: path
        required: true
        description: The shipping address ID to delete.
        schema:
          type: string
          maxLength: 32
      responses:
        '200':
          description: Shipping address deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          description: Unauthorized
        '404':
          description: Customer or shipping address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CustomerVaultPaymentDetails:
      title: Customer Vault Payment Details
      description: Payment method for a customer vault billing record. Supports the same retail card-present variants as payment transactions.
      oneOf:
      - type: object
        title: Credit card
        additionalProperties: false
        required:
        - card_number
        - card_exp
        properties:
          card_number:
            type: string
            description: Credit card number
          card_exp:
            type: string
            description: 'Credit card expiration date. Format: `MMYY`'
      - $ref: '#/components/schemas/RetailUnencryptedMagneticStripe'
      - $ref: '#/components/schemas/RetailMagTekMagensaEncryptedSwipe'
      - $ref: '#/components/schemas/RetailIdTechEncryptedSwipe'
      - $ref: '#/components/schemas/RetailIdTechEncryptedKeyed'
      - $ref: '#/components/schemas/RetailIngenicoChip'
      - $ref: '#/components/schemas/RetailIngenicoSwipe'
      - $ref: '#/components/schemas/RetailIngenicoNfc'
      - $ref: '#/components/schemas/RetailIngenicoKeyed'
      - $ref: '#/components/schemas/RetailMobileSdkEncryptedPayment'
      - type: object
        title: ACH / check
        additionalProperties: false
        required:
        - check_name
        - check_aba
        - check_account
        properties:
          check_name:
            type: string
            maxLength: 50
            description: The name on the customer's ACH account
          check_aba:
            type: number
            description: The customer's bank routing number
          check_account:
            type: number
            description: The customer's bank account number
          account_type:
            type: string
            enum:
            - checking
            - savings
            description: The type of ACH account the customer has
          account_holder_type:
            type: string
            enum:
            - personal
            - business
            description: Whether the ACH account is personal or business
          sec_code:
            type: string
            enum:
            - PPD
            - WEB
            - TEL
            - CCD
            - POP
            - RCK
            description: The Standard Entry Class code of the ACH transaction
      - type: object
        title: Payment token
        additionalProperties: false
        required:
        - payment_token
        properties:
          payment_token:
            type: string
            description: The tokenized version of the customer's card or check information
          payment:
            type: string
            enum:
            - check
            - creditcard
            description: Selects card vs check when a [Payment Component](../docs/payment-component) (or [Collect.js](https://secure.networkmerchants.com/merchants/resources/integration/integration_portal.php#cjs_methodology)) `payment_token` contains both card and ACH data.
      - type: object
        title: Apple Pay
        additionalProperties: false
        required:
        - applepay_payment_data
        properties:
          applepay_payment_data:
            type: string
            maxLength: 10000
            description: Encrypted payment data from the Apple Pay SDK.
      - type: object
        title: Google Pay
        additionalProperties: false
        required:
        - googlepay_payment_data
        properties:
          googlepay_payment_data:
            type: string
            maxLength: 10000
            description: Encrypted payment data from the Google Pay SDK.
      - type: object
        title: Decrypted Apple Pay
        additionalProperties: false
        required:
        - decrypted_applepay_data
        - card_number
        - card_exp
        properties:
          decrypted_applepay_data:
            type: boolean
            enum:
            - true
            description: Set to `true` when submitting merchant-decrypted Apple Pay data.
          card_number:
            type: string
            description: Device primary account number (dPAN) from the decrypted Apple Pay payload.
          card_exp:
            type: string
            description: 'Credit card expiration date from the decrypted Apple Pay payload. Format: `MMYY`'
      - type: object
        title: Decrypted Google Pay
        additionalProperties: false
        required:
        - decrypted_googlepay_data
        - card_number
        - card_exp
        properties:
          decrypted_googlepay_data:
            type: boolean
            enum:
            - true
            description: Set to `true` when submitting merchant-decrypted Google Pay data.
          card_number:
            type: string
            description: Device primary account number (dPAN) from the decrypted Google Pay payload.
          card_exp:
            type: string
            description: 'Credit card expiration date from the decrypted Google Pay payload. Format: `MMYY`'
    RetailMagTekMagensaEncryptedSwipe:
      type: object
      title: Retail MagTek Magensa encrypted swipe
      description: Card-present payment using encrypted magnetic stripe data from a MagTek Magensa reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - magnesafe_track_1
      - magnesafe_track_2
      properties:
        magnesafe_track_1:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_track_2:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_magneprint:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_ksn:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_magneprint_status:
          type: string
          description: Raw MagTek Magensa data.
    RetailIngenicoNfc:
      type: object
      title: Retail Ingenico Telium 2 NFC
      description: Card-present NFC payment from an Ingenico Telium 2 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - entry_mode
      - emv_device
      - encrypted_ksn
      - encrypted_track_2
      properties:
        entry_mode:
          type: string
          enum:
          - nfc_msd
          description: The type of transaction data to be processed.
        emv_device:
          type: string
          enum:
          - ingenico_rba
          description: The EMV-capable card reader.
        encrypted_ksn:
          type: string
          description: Raw encrypted data.
        encrypted_track_2:
          type: string
          description: Raw encrypted data.
    ShippingAddressRest:
      type: object
      title: Shipping Address & Information
      description: Shipping address and information
      properties:
        id:
          type: string
          maxLength: 32
          description: Shipping address ID (max 32 characters). Generated if omitted on create.
        first_name:
          type: string
          maxLength: 50
          description: Shipping first name
        last_name:
          type: string
          maxLength: 50
          description: Shipping last name
        company:
          type: string
          maxLength: 100
          description: Shipping company
        address1:
          type: string
          maxLength: 100
          description: Shipping address
        address2:
          type: string
          maxLength: 100
          description: Shipping address, line 2
        city:
          type: string
          maxLength: 50
          description: Shipping city
        state:
          type: string
          maxLength: 50
          description: Shipping state.
        zip:
          type: string
          maxLength: 20
          description: Shipping zip code
        country:
          type: string
          maxLength: 2
          description: 'ISO 3166-1 alpha-2 country code. Example: `US`'
        email:
          type: string
          format: email
          description: Shipping email address
        carrier:
          type: string
          enum:
          - ups
          - fedex
          - dhl
          - usps
          description: Shipping carrier
    RetailIdTechEncryptedKeyed:
      type: object
      title: Retail ID Tech M130 encrypted keyed
      description: Card-present encrypted keyed entry data from an ID Tech M130 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - encrypted_data
      properties:
        encrypted_data:
          type: string
          description: Raw encrypted data.
    ErrorResponse:
      type: object
      title: Error Response
      description: Error response structure matching SecureApiErrorResponseFactory
      properties:
        type:
          type: string
