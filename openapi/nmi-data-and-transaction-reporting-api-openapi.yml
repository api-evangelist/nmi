openapi: 3.2.0
info:
  version: 1.0.0
  title: Payments Data and Transaction Reporting API
  description: Our payments platform exposes two generations of API.
  x-logo:
    url: https://www.nmi.com/app/themes/nmi/images/NMI_Logo_Primary.webp
servers:
- url: https://sandbox.nmi.com/api
security: []
tags:
- name: Data and Transaction Reporting
  description: Query API (query.php) for retrieving transaction, subscription, and invoice data. Intended for existing Classic integrations.
paths:
  /query.php:
    post:
      tags:
      - Data and Transaction Reporting
      summary: Query API (Classic)
      description: 'Methodology


        **Overview**


        While our online reporting interface allows merchants to quickly and easily retrieve detailed information about past transactions, a need for additional flexibility may be required.'
      operationId: query
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                security_key:
                  required: true
                  type: string
                  description: API Security Key assigned to a merchant account. New keys can be generated from the merchant control panel in Settings > Security Keys
                condition:
                  type: string
                  description: "A combination of values can be passed and should be separated by commas. \n\nFor example, to retrieve all transactions pending settlement or complete, the following could be used: \n\n`condition=pendingsettlement,complete`\n\n<details>\n<summary>Conditions</summary>\n\n| Condition          | Description                                                                                                                                                       |\n|:-------------------|:------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| pending            | 'Auth Only' transactions that are awaiting capture.                                                                                                               |\n| pendingsettlement  | Transaction is awaiting settlement.                                                                                                                               |\n| in_progress        | Three-Step Redirect API transaction has not yet been completed. The transaction <br>condition will change to 'abandoned' if 24 hours pass with no further action. |\n| abandoned          | Three-Step Redirect API transaction has not been completed, and has timed out.                                                                                    |\n| failed             | Transaction has failed.                                                                                                                                           |\n| canceled           | Transaction has been voided.                                                                                                                                      |\n| complete           | Transaction has settled.                                                                                                                                          |\n| unknown            | An unknown error was encountered while processing this transaction.                                                                                               |\n\n</details>"
                  enum:
                  - pending
                  - pendingsettlement
                  - in_progress
                  - abandoned
                  - failed
                  - canceled
                  - complete
                  - unknown
                transaction_type:
                  type: string
                  description: 'Retrieves only transactions with the specified transaction type.


                    <details>

                    <summary>Transaction Types</summary>


                    | Transaction Type  | Description                 |

                    |:------------------|:----------------------------|

                    | cc                | A credit card transaction.  |

                    | ck                | A check transaction.        |

                    | cs                | A cash transaction.         |


                    </details>'
                  enum:
                  - cc
                  - ck
                  - cs
                action_type:
                  type: string
                  description: 'Retrieves only transactions with the specified action types. A combination of the values can be used and <br>should be separated by commas.


                    For example, to retrieve all transactions with credit or refund actions, use the following:


                    `action_type=refund,credit`


                    <details>

                    <summary>Action Types</summary>


                    | Action Type  | Description                                                                                      |

                    |:-------------|:-------------------------------------------------------------------------------------------------|

                    | sale         | Sale transactions.                                                                               |

                    | refund       | Refund transactions.                                                                             |

                    | credit       | Credit transactions.                                                                             |

                    | auth         | ''Auth Only'' transactions.                                                                        |

                    | capture      | Captured transactions.                                                                           |

                    | void         | Voided transactions.                                                                             |

                    | return       | Electronic Check (ACH) transactions that have returned, as well as credit card <br>chargebacks.  |

                    | validate     | Validated transactions.                                                                          |


                    </details>'
                  enum:
                  - sale
                  - refund
                  - credit
                  - auth
                  - capture
                  - void
                  - return
                  - validate
                source:
                  type: string
                  description: 'Retrieves only transactions with a particular ''transaction source''. A combination of the values can be used <br>and should be separated by commas.


                    For example, to retrieve all transactions with api or recurring actions, use the following:


                    `source=api,recurring`


                    <details>

                    <summary>Sources</summary>


                    | Source           | Description                                                                                       |

                    |:-----------------|:--------------------------------------------------------------------------------------------------|

                    | api              | API transactions.                                                                                 |

                    | batch_upload     | Batch Upload transactions.                                                                        |

                    | mobile           | Mobile (iProcess) transactions.                                                                   |

                    | quickclick       | QuickClick transactions.                                                                          |

                    | quickbooks       | QuickBooks SyncPay transactions.                                                                  |

                    | recurring        | Recurring transactions when using Recurring module.                                               |

                    | swipe            | Swipe transactions.                                                                               |

                    | virtual_terminal | Virtual Terminal transactions.                                                                    |

                    | internal         | Internal transactions. Typically indicates settlement.                                            |


                    </details>'
                  enum:
                  - api
                  - batch_upload
                  - mobile
                  - quickclick
                  - quickbooks
                  - recurring
                  - swipe
                  - virtual_terminal
                  - internal
                transaction_id:
                  type: string
                  description: Specify a transaction ID or a comma separated list of transaction IDs to retrieve information on.<br>Alternatively, provide a Subscription ID to retrieve processed (approved and declined) transactions <br>associated with it.
                subscription_id:
                  type: string
                  description: Set a specific subscription record or comma separated list of records. Using this with a transaction search <br>will return all transactions associated with this subscription. This will return this subscription's payment/plan <br>information when used with `report_type=recurring`.
                invoice_id:
                  type: string
                  description: Set a specific Invoice ID. Should only be used when `report_type=invoicing`.
                partial_payment_id:
                  type: string
                  description: Retrieves only transactions with the specified partial payment ID.
                order_id:
                  type: string
                  description: Retrieves only transactions with the specified Order ID.
                first_name:
                  type: string
                  description: Retrieves only transactions with the specified first name.
                last_name:
                  type: string
                  description: Retrieves only transactions with the specified last name.
                address1:
                  type: string
                  description: Retrieves only transactions with the specified specified address.
                city:
                  type: string
                  description: Retrieves only transactions with the specified city.
                state:
                  type: string
                  description: "Retrieves only transactions with the specified state.\n  \nFormat: `CC`"
                zip:
                  type: string
                  description: Retrieves only transactions with the specified zip/postal code.
                phone:
                  type: string
                  description: Retrieves only transactions with the specified phone number.
                fax:
                  type: string
                  description: Retrieves only transactions with the specified fax number.
                order_description:
                  type: string
                  description: Retrieves only transactions with the specified order description.
                drivers_license_number:
                  type: string
                  description: Retrieves only transactions with the specified driver's license number.
                drivers_license_dob:
                  type: string
                  description: Retrieves only transactions with the specified driver's license date of birth.
                drivers_license_state:
                  type: string
                  description: Retrieves only transactions with the specified driver's license state.
                email:
                  type: string
                  description: Retrieves only transactions with the specified billing email address.
                cc_number:
                  type: string
                  enum:
                  - '4111111111111111'
                  - '5431111111111111'
                  - '6011000991300009'
                  - '341111111111111'
                  - '30205252489926'
                  - '3541963594572595'
                  - '6799990100000000019'
                  - '1111'
                  - 0009
                  - '9926'
                  - '2595'
                  - 0019
                  description: 'Retrieves only transactions with the specified credit card number.

                    You can use either the full number or the last 4 digits of the credit card number.

                    **Note:** The last four digits in the test card number for Visa, MasterCard, and American Express are identical. In order to receive type-specific transactions, use the full test card number.


                    <details>

                    <summary>Allowed Card Numbers:</summary>


                    | Card Type                            | Test Card Number    |

                    |:-------------------------------------|:--------------------|

                    | Visa                                 | 4111111111111111    |

                    | MasterCard                           | 5431111111111111    |

                    | Discover                             | 6011000991300009    |

                    | American Express                     | 341111111111111     |

                    | Diner''s Club                         | 30205252489926      |

                    | JCB                                  | 3541963594572595    |

                    | Maestro                              | 6799990100000000019 |

                    | Visa, MasterCard, & American Express | 1111                |

                    | Discover                             | 0009                |

                    | Diner''s Club                         | 9926                |

                    | JCB                                  | 2595                |

                    | Maestro                              | 0019                |


                    </details>'
                merchant_defined_field_1:
                  type: string
                  description: 'Retrieves only transactions with the specified merchant defined field value.<br>Replace the ''1'' with a field number (1-20) (Example: `merchant_defined_field_12=value`)'
                start_date:
                  type: string
                  format: date-time
                  description: 'Only transactions that have been modified on or after this date will be retrieved.<br>Note that any actions performed on a transaction will cause the modified date to be updated.<br><br>Format: `YYYYMMDDhhmmss`'
                end_date:
                  type: string
                  format: date-time
                  description: 'Only transactions that have been modified on or before this date will be retrieved.<br>Note that any actions performed on a transaction will cause the modified date to be updated.<br><br>Format: `YYYYMMDDhhmmss`'
                report_type:
                  type: string
                  enum:
                  - receipt
                  - customer_vault
                  - recurring
                  - recurring_plans
                  - invoicing
                  - gateway_processors
                  - account_updater
                  - test_mode_status
                  - profile
                  description: 'Sets the report type.


                    * If you would like to query the Customer Vault to view what customer information is stored in the Customer Vault, you must set the customer_vault variable.

                    * If you omit the customer_vault_id, the system will return all customers that are stored in the vault.

                    * If you include a customer_vault_id, it will return the customer record associated with that ID.


                    Example: `report_type=customer_vault&customer_vault _id=123456789`


                    <details>

                    <summary>Report Types</summary>


                    | Report Type        | Description                                                                                                                                                                            |

                    |:-------------------|:---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

                    | receipt            | Will return an html receipt for a specified transaction id.                                                                                                                            |

                    | customer_vault     | Set the Query API to return Customer Vault data.                                                                                                                                       |

                    | recurring          | Set the Query API to return subscription data.                                                                                                                                         |

                    | recurring_plans    | Set the Query API to return plan data.                                                                                                                                                 |

                    | invoicing          | Set the Query API to return invoicing data.                                                                                                                                            |

                    | gateway_processors | Will return Processor details a user has permissions for. Specify a "user" by <br>querying with that security key.                                                                     |

                    | account_updater    | Will return Customer Vault data that has been updated using the <br>Account Updater service.                                                                                           |

                    | test_mode_status   | Will return whether the account has test mode active or inactive.                                                                                                                      |

                    | profile            | Return merchant profile (company, email, address, timezone, defined fields, <br>gateway, favicon, status). It will also return card_schemes with <br>''processor_details'' set to ''true'' |


                    </details>'
                mobile_device_license:
                  type: string
                  description: 'Retrieves only transactions processed using the specified mobile device.


                    * The device IDs for this parameter are available in the License Manager.

                    * Use ''any_mobile'' to retrieve all mobile transactions.

                    * A combination of the values can be used and should be separated by commas.

                    * Can not be used with ''mobile_device_nickname''.


                    Example 1: `mobile_device_license=D91AC56A-4242-3131-2323-2AE4AA6DB6EB`

                    <br>Example 2: `mobile_device_license=any_mobile`

                    '
                mobile_device_nickname:
                  type: string
                  description: 'Retrieves only transactions processed using mobile devices with the specified nickname.


                    * The nicknames for this parameter are available in the License Manager.

                    * Can not be used with ''mobile_device_license''.


                    Example (URL encoded): `mobile_device_nickname=Jim''s%20iPhone`

                    '
                customer_vault_id:
                  type: string
                  description: Set a specific Customer Vault record. Should only be used when `report_type=customer_vault`.
                date_search:
                  type: string
                  enum:
                  - created
                  - updated
                  description: 'Allows Customer Vault information to be returned based on the ''created'' or ''updated'' date.


                    * If you would like to query the Customer Vault to view when customer information was created or updated, you must set the report_type variable with the customer_vault value.

                    * If you omit the report_type variable, the system will ignore the date_search variable.


                    Example: `report_type=customer_vault&date_search=created,updated&start_date=20170101000000&end_date=20201231232359`


                    | Value    | Description                                                             |

                    |:---------|:------------------------------------------------------------------------|

                    | created  | Will return Customer Vault data created during a specified date range.  |

                    | updated  | Will return Customer Vault data updated during a specified date range.  |'
                result_limit:
                  type: integer
                  description: Determines the maximum number of results that may return for the current query.
                page_number:
                  type: integer
                  description: Determines which "page" of results are returned. For example, `result_limit=100&page_number=0` will return the first 100 results. Using `page_number=1` will return the next 100 results. Default - `0`.
                result_order:
                  type: string
                  enum:
                  - standard
                  - reverse
                  description: 'Determines order of in which results are returned. Default - `standard`.


                    <details>

                    <summary>Result Orders</summary>


                    | Result Order     | Description                                 |

                    |:-----------------|:--------------------------------------------|

                    | standard         | Returns the results from oldest to newest.  |

                    | reverse          | Returns the results from newest to oldest.  |'
                invoice_status:
                  type: string
                  description: 'Specify a comma separated list of what invoice statuses will return when using an "invoicing" report type.<br><br>Example: `invoice_status=open,closed,paid`'
                  enum:
                  - open
                  - paid
                  - closed
                  - past_due
                processor_details:
                  type: string
                  description: Can be use with `"report_type"="profile"`, this will include merchant `"card_schemes"` in the response
                additionalProperties:
                  type: string
                  description: Up to 20 `merchant_defined_field_#` are allowed.
            examples:
              CompletedCreditCardTransactions:
                $ref: '#/components/examples/CompletedCreditCardTransactions'
              PendingTransactions:
                $ref: '#/components/examples/PendingTransactions'
              CustomerVault:
                $ref: '#/components/examples/CustomerVault'
      responses:
        '200':
          description: ok
          content:
            application/xml:
              schema:
                oneOf:
                - $ref: '#/components/schemas/QueryResponse'
                - $ref: '#/components/schemas/QueryCustomerVaultResponse'
                - $ref: '#/components/schemas/QueryRecurringResponse'
                - $ref: '#/components/schemas/QueryRecurringPlanResponse'
                - $ref: '#/components/schemas/QueryInvoicingResponse'
                - $ref: '#/components/schemas/QueryGatewayProcessorResponse'
                - $ref: '#/components/schemas/QueryProfileWithProcessorDetailsResponse'
