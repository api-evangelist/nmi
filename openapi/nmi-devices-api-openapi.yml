      properties:
        product_code:
          type: string
          maxLength: 50
          description: Product code
        description:
          type: string
          maxLength: 255
          description: Line item description
        commodity_code:
          type: string
          maxLength: 50
          description: Commodity code
        unit_of_measure:
          type: string
          maxLength: 50
          description: Unit of measure
        unit_cost:
          type: number
          minimum: 0
          description: Unit cost
        quantity:
          type: integer
          minimum: 0
          maximum: 999999
          description: Quantity
        total_amount:
          type: number
          minimum: 0
          description: Total amount
        tax_amount:
          type: number
          minimum: 0
          description: Tax amount
        tax_rate:
          type: number
          minimum: 0
          description: Tax rate
        discount_amount:
          type: number
          minimum: 0
          description: Discount amount
        discount_rate:
          type: number
          minimum: 0
          description: Discount rate
        tax_type:
          type: string
          maxLength: 50
          description: Tax type
        alternate_tax_id:
          type: string
          maxLength: 50
          description: Alternate tax ID
    PaymentFacilitator:
      type: object
      title: Payment Facilitator
      description: Payment facilitator information for submerchant transactions
      properties:
        id:
          type: string
          maxLength: 50
          description: Payment facilitator ID
        submerchant_id:
          type: string
          maxLength: 255
          description: Submerchant ID
        submerchant_name:
          type: string
          maxLength: 255
          description: Submerchant name
        submerchant_address:
          type: string
          maxLength: 50
          description: Submerchant address
        submerchant_city:
          type: string
          maxLength: 50
          description: Submerchant city
        submerchant_state:
          type: string
          maxLength: 20
          description: Submerchant state
        submerchant_postal:
          type: string
          maxLength: 20
          description: Submerchant postal code
        submerchant_country:
          type: string
          maxLength: 2
          description: Submerchant country
        submerchant_phone:
          type: string
          description: Submerchant phone
        submerchant_email:
          type: string
          format: email
          description: Submerchant email
    RetailIdTechEncryptedKeyed:
      type: object
      title: Retail ID Tech M130 encrypted keyed
      description: Card-present encrypted keyed entry data from an ID Tech M130 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - encrypted_data
      properties:
        encrypted_data:
          type: string
          description: Raw encrypted data.
    PoiDevicePromptFields:
      title: POI Device Prompt Fields
      type: object
      description: Optional Cloud EMV POI device prompts for asynchronous device payment-request endpoints. New integrations should send these fields on `/v5/devices/{device_id}/payment-requests/{sale|auth|credit|validate}`, not on `/v5/payments/*`.
      properties:
        poi_prompt_tip:
          type: string
          enum:
          - 'true'
          - 'false'
          description: When set to `"true"`, allows the cardholder to enter or confirm a tip amount on the POI device.
        poi_prompt_quicktip_amounts:
          type: string
          description: Comma-delimited quick tip amount options to show on the POI device. Valid only when `poi_prompt_tip` is `"true"`.
        poi_prompt_quicktip_percentages:
          type: string
          description: Comma-delimited quick tip percentage options to show on the POI device. Valid only when `poi_prompt_tip` is `"true"`.
        poi_enable_keyed:
          type: string
          enum:
          - 'true'
          - 'false'
          description: When set to `"true"`, provides the option for the cardholder to key in card details on the POI device.
        poi_require_keyed:
          type: string
          enum:
          - 'true'
          - 'false'
          description: When set to `"true"`, requires keyed entry on the POI device. Cannot be `"true"` at the same time as `poi_enable_keyed`.
        poi_keyed_type:
          type: string
          enum:
          - cnp
          - card_present
          - ecommerce
          - mail_order
          - telephone_order
          description: Keyed transaction type to use when keyed entry is enabled or required on the POI device.
        poi_prompt_cvv:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Controls whether the POI device prompts for CVV during keyed entry.
        poi_prompt_zip:
          type: string
          enum:
          - 'true'
          - 'false'
          description: When set to `"true"`, requires ZIP or postal code entry on the POI device.
        poi_prompt_signature:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Controls whether the POI device prompts for signature capture where supported.
        poi_prompt_amount_confirmation:
          type: string
          enum:
          - 'true'
          - 'false'
          description: When set to `"true"`, requires the cardholder to confirm the amount on the POI device.
        poi_automatic_fall_forward:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Controls fall-forward behavior on supported POI devices.
        poi_enable_void:
          type: string
          enum:
          - 'true'
          - 'false'
          description: When set to `"true"`, allows the device flow to void the transaction if the cardholder removes the card before finalization.
    PaymentRequestStatusResponse:
      type: object
      title: Payment Request Status Response
      description: Payment request response. Returned when creating an asynchronous payment request or polling for its status.
      properties:
        object:
          type: string
          enum:
          - payment-request
          description: Resource type identifier
        id:
          type: string
          description: Payment request ID
        status:
          type: string
          enum:
          - pending
          - inFlight
          - interactionComplete
          - cancelled
          - cancelledAtTerminal
          - cancelledByApi
          - cancelledByTimeout
          - poiDeviceInUse
          - poiDeviceDisconnected
          - terminatedBadCardRead
          description: Status of the payment request. When a payment request is first created, the status is always `pending`. When polling for status, values are more granular to show the progress of the transaction based on the device's status or customer's interaction.
        transaction:
          type: object
          description: Transaction details if the payment request has been processed
          properties:
            id:
              type: integer
              nullable: true
              description: Transaction ID
            type:
              type: string
              description: Transaction type (e.g., 'sale', 'auth', 'credit', 'validate')
            success:
              type: boolean
              description: Whether the transaction was successful
            condition:
              type: string
              description: Transaction condition/status
            approval:
              type: string
              description: Approval code
            authorized_amount:
              type: string
              description: 'Authorized amount. Format: `x.xx`'
            auth_code:
              type: string
              description: Authorization code
            customer_vault_id:
              type: string
              description: Customer vault ID associated with the transaction
            emv_metadata:
              type: object
              description: EMV (chip card) metadata
              properties:
                customer_verification_method:
                  type: string
                  description: Customer verification method used
                application_id:
                  type: string
                  description: EMV application ID
                application_label:
                  type: string
                  description: EMV application label
                application_preferred_name:
                  type: string
                  description: EMV application preferred name
                application_pan_sequence_number:
                  type: string
                  description: EMV application PAN sequence number
                transaction_status_information:
                  type: string
                  description: EMV transaction status information
                masked_merchant_number:
                  type: string
                  description: Masked merchant number
                masked_terminal_number:
                  type: string
                  description: Masked terminal number
            card_tokens:
              type: array
              description: Card tokens associated with the transaction
              items:
                type: object
                properties:
                  token:
                    type: string
                    description: Card token
                  type:
                    type: string
                    description: Token type
        error:
          type: object
          description: Error information if the payment request failed
          properties:
            code:
              type: string
              description: Error code
            ref_id:
              type: string
              description: Error reference ID
            message:
              type: string
              description: Error message
      required:
      - object
      - id
      - status
    ErrorResponse:
      type: object
      title: Error Response
      description: Error response structure matching SecureApiErrorResponseFactory
      properties:
        type:
          type: string
          description: Error type (e.g., 'validationError', 'internalError', 'authenticationError')
        error_code:
          type: string
          description: Error code (e.g., 'E_INTERNAL', 'E_VALIDATION')
        message:
          type: string
          description: Human-readable error message
        ref_id:
          type: string
          nullable: true
          description: Reference ID for the error (transaction ID, etc.)
        details:
          type: array
          nullable: true
          description: Validation error details
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
      required:
      - type
      - error_code
      - message
    RetailIngenicoKeyed:
      type: object
      title: Retail Ingenico Telium 2 keyed
      description: Card-present encrypted keyed entry from an Ingenico Telium 2 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - entry_mode
      - emv_device
      - encrypted_ksn
      - encrypted_track_2
      properties:
        entry_mode:
          type: string
          enum:
          - keyed
          description: The type of transaction data to be processed.
        emv_device:
          type: string
          enum:
          - ingenico_rba
          description: The EMV-capable card reader.
        encrypted_ksn:
          type: string
          description: Raw encrypted data.
        encrypted_track_2:
          type: string
          description: Raw encrypted data.
    PaymentSaleBase:
      title: Payment Sale Base Fields
      type: object
      required:
      - amount
      properties:
        amount:
          type: number
          description: 'Total amount to be charged. Format: `x.xx`'
        surcharge:
          type: number
          minimum: 0
          description: 'Surcharge amount. Format: `x.xx`'
        convenience_fee:
          type: number
          minimum: 0
          description: 'Convenience fee amount. Format: `x.xx`'
        misc_fee:
          type: number
          minimum: 0
          description: 'Miscellaneous fee amount. Format: `x.xx`'
        misc_fee_name:
          type: string
          maxLength: 50
          description: 'Custom miscellaneous fee name. Default: `Miscellaneous Fee`'
        tip:
          type: number
          minimum: 0
          description: 'The final tip amount, included in the payment. Format: `x.xx`'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: 'The ISO 4217 currency code. Example: `USD`'
        processor_id:
          type: string
          maxLength: 50
          description: If using multiple processors, route to the specified processor ID. Omit for default processor or when using a single processor.
        dup_seconds:
          type: integer
          minimum: 0
          maximum: 7862400
          description: Sets the time in seconds for duplicate checking on supported processors. Set to 0 to disable duplicate checking
        transaction_session_id:
          type: string
          minLength: 32
          maxLength: 32
          description: A single use session ID used by Kount to link the payment and Data Collector information together
        customer_receipt:
          type: boolean
          description: If set to true, when the customer is charged, they will be sent a receipt
        pinless_debit_override:
          type: boolean
          description: Set to true if you have Pinless Debit Conversion enabled but want to opt out for this payment
        industry:
          type: string
          enum:
          - retail
          - restaurant
          - ecommerce
          - moto
          - lodging
          description: Industry type for the payment
        signature_image:
          type: string
          description: Base64 encoded signature image
        network_tokenize:
          type: boolean
          description: Enable network tokenization
        partial_payments:
          type: string
          enum:
          - settle_partial
          - payment_in_full
          description: '`settle_partial`: Settles any amount of tender collected at cut off. `payment_in_full`: Required that any split tendered payment is collected in-full before settlement gets initiated'
        partial_payment_id:
          type: string
          maxLength: 50
          description: A numeric identifier which is used when submitting subsequent payments for partial payments
        billing_address:
          $ref: '#/components/schemas/BillingAddressRest'
        shipping_address:
          $ref: '#/components/schemas/ShippingAddressRest'
        order_details:
          $ref: '#/components/schemas/OrderDetailsRest'
        payment_facilitator:
          $ref: '#/components/schemas/PaymentFacilitator'
        payment_descriptor:
          $ref: '#/components/schemas/PaymentDescriptor'
        cardholder_auth:
          $ref: '#/components/schemas/CardholderAuth'
        merchant_defined_fields:
          $ref: '#/components/schemas/MerchantDefinedFields'
        cit_mit:
          $ref: '#/components/schemas/CitMit'
    RetailIdTechEncryptedSwipe:
      type: object
      title: Retail ID Tech M130 encrypted swipe
      description: Card-present encrypted swipe data from an ID Tech M130 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - encrypted_track_1
      - encrypted_track_2
      properties:
        encrypted_track_1:
          type: string
          description: Raw encrypted data.
        encrypted_track_2:
          type: string
          description: Raw encrypted data.
        encrypted_track_3:
          type: string
          description: Raw encrypted data.
        encrypted_ksn:
          type: string
          description: Raw encrypted data.
    PaymentDescriptor:
      type: object
      title: Payment Descriptor
      description: Payment descriptor information for transaction statements
      properties:
        descriptor:
          type: string
          maxLength: 255
          description: Payment descriptor
        phone:
          type: string
          description: Payment descriptor phone
        address:
          type: string
          maxLength: 255
          description: Payment descriptor address
        city:
          type: string
          maxLength: 50
          description: Payment descriptor city
        state:
          type: string
          maxLength: 50
          description: Payment descriptor state
        postal_code:
          type: string
          maxLength: 20
          description: Payment descriptor postal code
        country:
          type: string
          maxLength: 2
          description: Payment descriptor country
        mcc:
          type: string
          maxLength: 4
          description: Merchant category code
        merchant_id:
          type: string
          maxLength: 50
          description: Merchant ID
        url:
          type: string
          format: uri
          pattern: ^https://
          minLength: 1
          description: Merchant URL (must be HTTPS)
    DevicePaymentRequest:
      title: Device Payment Request
      description: Asynchronous device payment request (sale, auth, or credit). Payment details are collected on the device. Include POI prompt fields here rather than on `/v5/payments/*`.
      allOf:
      - $ref: '#/components/schemas/PaymentSaleBase'
      - $ref: '#/components/schemas/PoiDevicePromptFields'
    DeviceListResponse:
      type: object
      title: Device List Response
      description: Response containing a list of devices with pagination
      required:
      - devices
      - total_count
      - limit
      - offset
      - has_more
      properties:
        devices:
          type: array
          description: Array of device objects
          items:
            $ref: '#/components/schemas/DeviceResponse'
        total_count:
          type: integer
          description: Total number of devices registered to the merchant
        limit:
          type: integer
          description: Number of devices returned per page
        offset:
          type: integer
          description: Pagination offset
        has_more:
          type: boolean
          description: Whether there are more devices available
    RetailIngenicoChip:
      type: object
      title: Retail Ingenico Telium 2 chip (EMV)
      description: Card-present EMV chip payment from an Ingenico Telium 2 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - entry_mode
      - emv_auth_request_data
      - emv_device
      - verification_method
      - encrypted_ksn
      - encrypted_track_2
      properties:
        entry_mode:
          type: string
          enum:
          - emv_icc
          description: The type of transaction data to be processed.
        emv_auth_request_data:
          type: string
          description: EMV data for the transaction as received from the EMV chip card SDK.
        emv_device:
          type: string
          enum:
          - ingenico_rba
          description: The EMV-capable card reader.
        verification_method:
          type: string
          enum:
          - signature
          - offline_pin
          - offline_pin_signature
          - none
          description: Method used to verify the EMV transaction.
        encrypted_ksn:
          type: string
          description: Raw encrypted data.
        encrypted_track_2:
          type: string
          description: Raw encrypted data.
    PromptRequestStatusResponse:
      type: object
      title: Prompt Request Status Response
      description: Prompt request status response matching the structure returned by GET /api/v5/devices/{deviceId}/prompt/{type}/{reference}
      properties:
        object:
          type: string
          enum:
          - request
          description: Resource type identifier
        id:
          type: string
          description: Prompt request ID (reference)
        status:
          type: string
          enum:
          - in_progress
          - completed
          - cancelled
          - cancelledAtTerminal
          - cancelledByApi
          - cancelledByTimeout
          - poiDeviceInUse
          - poiDeviceDisconnected
          - terminatedBadCardRead
          description: Status of the prompt request
        result:
          type: string
          description: The result of the prompt (e.g., 'yes', 'no', or selected menu option). Only present when status is 'completed'.
        signature:
          type: string
