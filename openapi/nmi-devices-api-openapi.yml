    PaymentDetails:
      title: Payment Details
      description: 'Payment method details. Exactly one variant: raw card data, ACH (check) data, **payment_token**, wallet payloads, or **retail card-present** data from a card reader. Do not combine fields from different variants.'
      oneOf:
      - type: object
        title: Credit card
        description: Non-tokenized credit card data.
        additionalProperties: false
        required:
        - card_number
        - card_exp
        properties:
          card_number:
            type: string
            description: Credit card number
          card_exp:
            type: string
            description: 'Credit card expiration date. Format: `MMYY`'
          card_cvv:
            type: string
            maxLength: 4
            description: The card security code.
      - $ref: '#/components/schemas/RetailUnencryptedMagneticStripe'
      - $ref: '#/components/schemas/RetailMagTekMagensaEncryptedSwipe'
      - $ref: '#/components/schemas/RetailIdTechEncryptedSwipe'
      - $ref: '#/components/schemas/RetailIdTechEncryptedKeyed'
      - $ref: '#/components/schemas/RetailIngenicoChip'
      - $ref: '#/components/schemas/RetailIngenicoSwipe'
      - $ref: '#/components/schemas/RetailIngenicoNfc'
      - $ref: '#/components/schemas/RetailIngenicoKeyed'
      - $ref: '#/components/schemas/RetailMobileSdkEncryptedPayment'
      - type: object
        title: ACH / check
        description: Bank account (ACH) details for this transaction.
        additionalProperties: false
        required:
        - check_name
        - check_aba
        - check_account
        - account_type
        - account_holder_type
        - sec_code
        properties:
          check_name:
            type: string
            maxLength: 50
            description: The name on the customer's ACH account
          check_aba:
            type: number
            description: The customer's bank routing number
          check_account:
            type: number
            description: The customer's bank account number
          account_type:
            type: string
            enum:
            - checking
            - savings
            description: The type of ACH account the customer has
          account_holder_type:
            type: string
            enum:
            - personal
            - business
            description: The type of ACH account the customer has
          sec_code:
            type: string
            enum:
            - PPD
            - WEB
            - TEL
            - CCD
            - POP
            - RCK
            description: The Standard Entry Class code of the ACH transaction
          check_number:
            type: string
            maxLength: 20
            description: Check number
      - type: object
        title: Payment token
        description: Single-use or vault token from [Payment Component](../docs/payment-component) or [Collect.js](https://secure.networkmerchants.com/merchants/resources/integration/integration_portal.php#cjs_methodology) (not Apple Pay / Google Pay).
