openapi: 3.2.0
info:
  version: 1.0.0
  title: Payments Devices API
  description: Our payments platform exposes two generations of API.
  x-logo:
    url: https://www.nmi.com/app/themes/nmi/images/NMI_Logo_Primary.webp
servers:
- url: https://sandbox.nmi.com/api
security: []
tags:
- name: Devices
  description: Cloud device management and payment request endpoints
paths:
  /v5/devices:
    get:
      tags:
      - Devices
      operationId: list-devices-v5
      summary: List Cloud Devices
      description: Retrieve a list of all cloud devices registered to the merchant with optional pagination and status information.
      security:
      - merchantApiKey: []
      parameters:
      - name: limit
        in: query
        required: false
        description: 'Number of devices to return per page (default: 50, max: 100)'
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        required: false
        description: 'Pagination offset (default: 0)'
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: include_status
        in: query
        required: false
        description: 'If true, include battery and wifi info in the response (default: false)'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: include_connection_info
        in: query
        required: false
        description: 'If true, include connection status info in the response (default: true)'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: connection_status
        in: query
        required: false
        description: 'Filter devices by connection status: ''true'' returns only connected devices, ''false'' returns only disconnected devices. Omit to return all devices.'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
              examples:
                DeviceListResponse:
                  $ref: '#/components/examples/DeviceListResponseExample'
        '401':
          description: Unauthorized
    post:
      tags:
      - Devices
      operationId: register-device-v5
      summary: Register Cloud Device
      description: Register a new cloud device with the merchant using a registration code.
      security:
      - merchantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
            examples:
              RegisterDevice:
                $ref: '#/components/examples/RegisterDeviceExample'
      responses:
        '201':
          description: Device registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
              examples:
                DeviceResponse:
                  $ref: '#/components/examples/DeviceResponseExample'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
  /v5/devices/{device_id}:
    get:
      tags:
      - Devices
      operationId: get-device-v5
      summary: Get Cloud Device
      description: Retrieve a specific cloud device by its ID.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        description: The device ID to retrieve.
        schema:
          type: string
      - name: include_status
        in: query
        required: false
        description: 'If true, include battery and wifi info in the response (default: false)'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
              examples:
                DeviceResponse:
                  $ref: '#/components/examples/DeviceResponseExample'
        '401':
          description: Unauthorized
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    patch:
      tags:
      - Devices
      operationId: update-device-v5
      summary: Update Cloud Device
      description: Update a cloud device's nickname or default status.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        description: The device ID to update.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
            examples:
              UpdateDevice:
                $ref: '#/components/examples/UpdateDeviceExample'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
              examples:
                DeviceResponse:
                  $ref: '#/components/examples/DeviceResponseExample'
        '401':
          description: Unauthorized
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      tags:
      - Devices
      operationId: deregister-device-v5
      summary: Deregister Cloud Device
      description: Deregister a cloud device from the merchant. Once deregistered, the device cannot be used for transactions.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        description: The device ID to deregister.
        schema:
          type: string
      responses:
        '204':
          description: Device deregistered successfully
        '401':
          description: Unauthorized
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v5/devices/{device_id}/display:
    delete:
      tags:
      - Devices
      operationId: cancel-device-display-v5
      summary: Cancel Display on Device
      description: Cancel any active display (e.g., QR code) on a cloud device.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        description: The device ID to cancel the display on.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Response from the cancel display operation
        '401':
          description: Unauthorized
        '404':
          description: Device not found
  /v5/devices/{device_id}/display/qr-code:
    post:
      tags:
      - Devices
      operationId: display-device-qr-code-v5
      summary: Display QR Code on Device
      description: Display a QR code on a cloud device screen.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        description: The device ID to display the QR code on.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - header
              - qr_data
              properties:
                header:
                  type: string
                  maxLength: 27
                  description: Header message to display on the device
                  pattern: ^[a-zA-Z0-9.,?!&\/#'-= ]{0,27}$
                qr_data:
                  type: string
                  maxLength: 1500
                  description: QR code data to display
                user_cancelled_allowed:
                  type: boolean
                  description: Whether the user is allowed to cancel the display
                  default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Response from the device display operation
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: Device not found
  /v5/devices/{device_id}/payment-requests:
    delete:
      tags:
      - Devices
      operationId: cancel-device-payment-request-v5
      summary: Cancel Payment Request on Device
      description: Cancel an in-flight asynchronous payment request on a cloud device before authorization completes. If the transaction cannot be cancelled (for example, it has already completed), process a void once the transaction is complete. After a successful cancellation, polling GET /api/v5/devices/{device_id}/payment-requests/{request_id} may report a cancelled status such as `cancelledByApi`.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the cloud device whose in-flight payment request should be cancelled
      responses:
        '200':
          description: Cancellation request processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestCancellationResponse'
              examples:
                success:
                  summary: Cancellation requested successfully
                  value:
                    object: payment-request-cancellation
                    success: true
                    message: Transaction cancellation requested. If the transaction cannot be cancelled, you must process a void request once the transaction is complete.
                    response_code: '100'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v5/devices/{device_id}/payment-requests/auth:
    post:
      tags:
      - Devices
      operationId: create-device-payment-request-auth-v5
      summary: Create Authorization Payment Request on Device
      description: Initiate an asynchronous authorization payment request on a specific cloud device. The device_id is specified in the URL path. Payment details (card number, expiration, CVV) are collected by the device itself, so they should not be included in the request body. This endpoint always operates in asynchronous mode. For synchronous payment processing with a device, use POST /api/v5/payments/auth with device_id in the request body. This endpoint uses the same underlying functionality as POST /api/v5/payments/auth.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the cloud device
      requestBody:
        required: true
        description: Payment request body. Payment details (payment_details object with card_number, card_exp, cvv) should not be included as the device will collect this information from the customer.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePaymentRequest'
      responses:
        '200':
          description: Payment request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestStatusResponse'
              examples:
                pending:
                  summary: Payment request created and pending
                  value:
                    object: payment-request
                    id: 1a00e97e-91d1-f011-869b-005056b9afb7
                    status: pending
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v5/devices/{device_id}/payment-requests/credit:
    post:
      tags:
      - Devices
      operationId: create-device-payment-request-credit-v5
      summary: Create Credit Payment Request on Device
      description: Initiate an asynchronous credit (refund) payment request on a specific cloud device. The device_id is specified in the URL path. Payment details (card number, expiration, CVV) are collected by the device itself, so they should not be included in the request body. This endpoint always operates in asynchronous mode. For synchronous payment processing with a device, use POST /api/v5/payments/credit with device_id in the request body. This endpoint uses the same underlying functionality as POST /api/v5/payments/credit.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the cloud device
      requestBody:
        required: true
        description: Payment request body. Payment details (payment_details object with card_number, card_exp, cvv) should not be included as the device will collect this information from the customer.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePaymentRequest'
      responses:
        '200':
          description: Payment request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestStatusResponse'
              examples:
                pending:
                  summary: Payment request created and pending
                  value:
                    object: payment-request
                    id: 1a00e97e-91d1-f011-869b-005056b9afb7
                    status: pending
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v5/devices/{device_id}/payment-requests/sale:
    post:
      tags:
      - Devices
      operationId: create-device-payment-request-sale-v5
      summary: Create Sale Payment Request on Device
      description: Initiate an asynchronous sale payment request on a specific cloud device. The device_id is specified in the URL path. Payment details (card number, expiration, CVV) are collected by the device itself, so they should not be included in the request body. This endpoint always operates in asynchronous mode. For synchronous payment processing with a device, use POST /api/v5/payments/sale with device_id in the request body. This endpoint uses the same underlying functionality as POST /api/v5/payments/sale.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the cloud device
      requestBody:
        required: true
        description: Payment request body. Payment details (payment_details object with card_number, card_exp, cvv) should not be included as the device will collect this information from the customer at the device.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePaymentRequest'
      responses:
        '200':
          description: Payment request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestStatusResponse'
              examples:
                pending:
                  summary: Payment request created and pending
                  value:
                    object: payment-request
                    id: 1a00e97e-91d1-f011-869b-005056b9afb7
                    status: pending
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v5/devices/{device_id}/payment-requests/validate:
    post:
      tags:
      - Devices
      operationId: create-device-payment-request-validate-v5
      summary: Create Validation Payment Request on Device
      description: Initiate an asynchronous validation payment request on a specific cloud device. The device_id is specified in the URL path. Payment details (card number, expiration, CVV) are collected by the device itself, so they should not be included in the request body. This endpoint always operates in asynchronous mode. For synchronous payment processing with a device, use POST /api/v5/payments/validate with device_id in the request body. This endpoint uses the same underlying functionality as POST /api/v5/payments/validate.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the cloud device
      requestBody:
        required: true
        description: 'Payment request body. Note: device_id should not be included in the body as it is specified in the URL path. Payment details (payment_details object with card_number, card_exp, cvv) should not be included as the device will collect this information from the customer.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentDeviceValidateRequest'
      responses:
        '200':
          description: Payment request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestStatusResponse'
              examples:
                pending:
                  summary: Payment request created and pending
                  value:
                    object: payment-request
                    id: 1a00e97e-91d1-f011-869b-005056b9afb7
                    status: pending
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v5/devices/{device_id}/payment-requests/{request_id}:
    get:
      tags:
      - Devices
      operationId: get-device-payment-request-status-v5
      summary: Get Payment Request Status
      description: Retrieve the status of an asynchronous payment request initiated on a cloud device. The request_id is obtained from the initial payment request response (e.g., from POST /api/v5/devices/{deviceId}/payment-requests/sale). The device_id must match the device that initiated the payment request. This endpoint uses the same underlying functionality as GET /api/asyncstatus.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the cloud device that initiated the payment request
      - name: request_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the payment request, obtained from the initial payment request response
      responses:
        '200':
          description: Payment request status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestStatusResponse'
              examples:
                inFlight:
                  summary: Customer is still interacting with the device
                  value:
                    object: payment-request
                    id: abc123def456
                    status: inFlight
                interactionCompleteApproved:
                  summary: Device interaction finished with an approved transaction
                  value:
                    object: payment-request
                    id: abc123def456
                    status: interactionComplete
                    transaction:
                      id: 12345
                      type: sale
                      success: true
                      condition: pendingsettlement
                      approval: '123456'
                      authorized_amount: '10.00'
                      auth_code: AUTH123
                interactionCompleteDeclined:
                  summary: Device interaction finished with a declined transaction
                  value:
                    object: payment-request
                    id: abc123def456
                    status: interactionComplete
                    transaction:
                      id: 12345
                      type: sale
                      success: false
                      condition: failed
                      auth_code: ''
                interactionCompleteError:
                  summary: Device interaction finished with an error
                  value:
                    object: payment-request
                    id: abc123def456
                    status: interactionComplete
                    error:
                      code: '300'
                      ref_id: '58523101'
                      message: error message will appear here
                poiDeviceInUse:
                  summary: Another payment request is already in progress on the device
                  value:
                    object: payment-request
                    id: abc123def456
                    status: poiDeviceInUse
                cancelledAtTerminal:
                  summary: Customer cancelled at the device
                  value:
                    object: payment-request
                    id: abc123def456
                    status: cancelledAtTerminal
                cancelledByApi:
                  summary: Payment request cancelled via DELETE /api/v5/devices/{device_id}/payment-requests
                  value:
                    object: payment-request
                    id: abc123def456
                    status: cancelledByApi
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v5/devices/{device_id}/prompt/menu:
    post:
      tags:
      - Devices
      operationId: prompt-device-menu-v5
      summary: Prompt Device for Menu Selection
      description: Prompt a cloud device to request a menu selection from the user.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        description: The device ID to prompt.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - header
              - options
              properties:
                header:
                  type: string
                  maxLength: 24
                  description: Header message to display on the device
                  pattern: ^[a-zA-Z0-9.,?!\/#&'-= ]{0,24}$
                options:
                  type: array
                  minItems: 2
                  maxItems: 20
                  description: Array of menu options (2-20 items)
                  items:
                    type: string
                    maxLength: 24
                    pattern: ^[a-zA-Z0-9.,?!\/#'-= ]{0,24}$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptRequestStatusResponse'
              examples:
                created:
                  summary: Prompt request created
                  value:
                    object: request
                    id: 9519a52b-07e7-49e7-8e40-76ef69c053cc
                    status: in_progress
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: Device not found
  /v5/devices/{device_id}/prompt/menu/{reference}:
    get:
      tags:
      - Devices
      operationId: get-device-prompt-menu-status-v5
      summary: Get Menu Prompt Status
      description: Retrieve the status of a menu selection prompt request initiated on a cloud device. The reference is obtained from the initial prompt request response (e.g., from POST /api/v5/devices/{deviceId}/prompt/menu).
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the cloud device
      - name: reference
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the prompt request, obtained from the initial prompt request response
      responses:
        '200':
          description: Prompt request status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptRequestStatusResponse'
              examples:
                in_progress:
                  summary: Prompt request is in progress
                  value:
                    object: request
                    id: 9519a52b-07e7-49e7-8e40-76ef69c053cc
                    status: in_progress
                completed:
                  summary: Prompt request completed with selection
                  value:
                    object: request
                    id: 9519a52b-07e7-49e7-8e40-76ef69c053cc
                    status: completed
                    result: Option 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v5/devices/{device_id}/prompt/sign:
    post:
      tags:
      - Devices
      operationId: prompt-device-sign-v5
      summary: Prompt Device for Signature
      description: Prompt a cloud device to request a signature from the user.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        description: The device ID to prompt.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - header
              properties:
                header:
                  type: string
                  maxLength: 100
                  description: Header message to display on the device
                  pattern: ^[a-zA-Z0-9.,?!&\/#'-= ]{0,100}$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptRequestStatusResponse'
              examples:
                created:
                  summary: Prompt request created
                  value:
                    object: request
                    id: 9519a52b-07e7-49e7-8e40-76ef69c053cc
                    status: in_progress
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: Device not found
  /v5/devices/{device_id}/prompt/sign/{reference}:
    get:
      tags:
      - Devices
      operationId: get-device-prompt-sign-status-v5
      summary: Get Signature Prompt Status
      description: Retrieve the status of a signature prompt request initiated on a cloud device. The reference is obtained from the initial prompt request response (e.g., from POST /api/v5/devices/{deviceId}/prompt/sign).
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the cloud device
      - name: reference
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the prompt request, obtained from the initial prompt request response
      responses:
        '200':
          description: Prompt request status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptRequestStatusResponse'
              examples:
                in_progress:
                  summary: Prompt request is in progress
                  value:
                    object: request
                    id: 9519a52b-07e7-49e7-8e40-76ef69c053cc
                    status: in_progress
                completed:
                  summary: Prompt request completed with signature
                  value:
                    object: request
                    id: 9519a52b-07e7-49e7-8e40-76ef69c053cc
                    status: completed
                    signature: base64_encoded_signature_data
                    signature_format: png
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v5/devices/{device_id}/prompt/yes-no:
    post:
      tags:
      - Devices
      operationId: prompt-device-yes-no-v5
      summary: Prompt Device for Yes/No Response
      description: Prompt a cloud device to request a yes/no response from the user.
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        description: The device ID to prompt.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - header
              - message
              properties:
                header:
                  type: string
                  maxLength: 100
                  description: Header message to display on the device
                  pattern: ^[a-zA-Z0-9.,?!&\/#'-= ]{0,100}$
                message:
                  type: string
                  maxLength: 100
                  description: Message to display on the device
                  pattern: ^[a-zA-Z0-9.,?!&\/#'-= ]{0,100}$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptRequestStatusResponse'
              examples:
                created:
                  summary: Prompt request created
                  value:
                    object: request
                    id: 9519a52b-07e7-49e7-8e40-76ef69c053cc
                    status: in_progress
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: Device not found
  /v5/devices/{device_id}/prompt/yes-no/{reference}:
    get:
      tags:
      - Devices
      operationId: get-device-prompt-yes-no-status-v5
      summary: Get Yes/No Prompt Status
      description: Retrieve the status of a yes/no prompt request initiated on a cloud device. The reference is obtained from the initial prompt request response (e.g., from POST /api/v5/devices/{deviceId}/prompt/yes-no).
      security:
      - merchantApiKey: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the cloud device
      - name: reference
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the prompt request, obtained from the initial prompt request response
      responses:
        '200':
          description: Prompt request status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptRequestStatusResponse'
              examples:
                in_progress:
                  summary: Prompt request is in progress
                  value:
                    object: request
                    id: 9519a52b-07e7-49e7-8e40-76ef69c053cc
                    status: in_progress
                completed:
                  summary: Prompt request completed
                  value:
                    object: request
                    id: 9519a52b-07e7-49e7-8e40-76ef69c053cc
                    status: completed
                    result: 'yes'
                cancelled:
                  summary: Prompt request was cancelled
                  value:
                    object: request
                    id: 9519a52b-07e7-49e7-8e40-76ef69c053cc
                    status: cancelled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    NotFound:
      description: Not Found - The requested resource could not be found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message describing what resource was not found
              code:
                type: string
                description: Error code for programmatic handling
          example:
            error: Resource not found
            code: NOT_FOUND
    Unauthorized:
      description: Unauthorized - Authentication credentials were missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message describing the authentication failure
              code:
                type: string
                description: Error code for programmatic handling
          example:
            error: Invalid or missing API key
            code: UNAUTHORIZED
    InternalServerError:
      description: Internal Server Error - An unexpected error occurred on the server
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message describing the server error
              code:
                type: string
                description: Error code for programmatic handling
          example:
            error: An unexpected error occurred
            code: INTERNAL_SERVER_ERROR
    BadRequest:
      description: Bad Request - The request was malformed or contained invalid parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message describing what was wrong with the request
              code:
                type: string
                description: Error code for programmatic handling
          example:
            error: Invalid request parameters
            code: BAD_REQUEST
  schemas:
    RetailMagTekMagensaEncryptedSwipe:
      type: object
      title: Retail MagTek Magensa encrypted swipe
      description: Card-present payment using encrypted magnetic stripe data from a MagTek Magensa reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - magnesafe_track_1
      - magnesafe_track_2
      properties:
        magnesafe_track_1:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_track_2:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_magneprint:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_ksn:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_magneprint_status:
          type: string
          description: Raw MagTek Magensa data.
    RegisterDeviceRequest:
      type: object
      title: Register Device Request
      description: Request to register a new cloud device
      required:
      - registration_code
      properties:
        registration_code:
          type: string
          description: The registration code provided with the device
        nickname:
          type: string
          description: Optional nickname for the device
        default:
          type: boolean
          description: Whether to set this device as the default cloud device for the merchant
    RetailIngenicoNfc:
      type: object
      title: Retail Ingenico Telium 2 NFC
      description: Card-present NFC payment from an Ingenico Telium 2 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - entry_mode
      - emv_device
      - encrypted_ksn
      - encrypted_track_2
      properties:
        entry_mode:
          type: string
          enum:
          - nfc_msd
          description: The type of transaction data to be processed.
        emv_device:
          type: string
          enum:
          - ingenico_rba
          description: The EMV-capable card reader.
        encrypted_ksn:
          type: string
          description: Raw encrypted data.
        encrypted_track_2:
          type: string
          description: Raw encrypted data.
    ShippingAddressRest:
      type: object
      title: Shipping Address & Information
      description: Shipping address and information
      properties:
        id:
          type: string
          maxLength: 32
          description: Shipping address ID (max 32 characters). Generated if omitted on create.
        first_name:
          type: string
          maxLength: 50
          description: Shipping first name
        last_name:
          type: string
          maxLength: 50
          description: Shipping last name
        company:
          type: string
          maxLength: 100
          description: Shipping company
        address1:
          type: string
          maxLength: 100
          description: Shipping address
        address2:
          type: string
          maxLength: 100
          description: Shipping address, line 2
        city:
          type: string
          maxLength: 50
          description: Shipping city
        state:
          type: string
          maxLength: 50
          description: Shipping state.
        zip:
          type: string
          maxLength: 20
          description: Shipping zip code
        country:
          type: string
          maxLength: 2
          description: 'ISO 3166-1 alpha-2 country code. Example: `US`'
        email:
          type: string
          format: email
          description: Shipping email address
        carrier:
          type: string
          enum:
          - ups
          - fedex
          - dhl
          - usps
          description: Shipping carrier
    LineItem:
      type: object
