          description: Initial payment ID from the stored credentials payment request. Used on subsequent follow up payments.
        stored_credential_indicator:
          type: string
          enum:
          - stored
          - used
          description: Stored credential indicator
    BillingAddressRest:
      type: object
      title: Billing Address & Information
      description: Billing address for a payment transaction request.
      properties:
        method:
          type: string
          enum:
          - initial_recurring
          - recurring
          - installment
          description: 'Recurring or installment classification for the processor.


            - `initial_recurring`: First transaction in a recurring sequence only.

            - `recurring`: Later charges in that sequence.

            - `installment`: Installment transactions; use `number` and `total` on supported processors.


            Which values apply depends on the processor.'
        number:
          type: integer
          minimum: 0
          maximum: 99
          description: Specify installment billing number, on supported processors. For use when `billing.method` is set to "installment"
        total:
          type: number
          minimum: 0
          description: Specify installment billing total on supported processors. For use when `billing.method` is set to "installment"
