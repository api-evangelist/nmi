    CardholderAuth:
      type: object
      title: Cardholder Authentication
      description: Cardholder authentication data. Use the 3-D Secure variant for EMV authentication results. Use the Decrypted wallet variant for merchant-decrypted Apple Pay or Google Pay, which relays the cryptogram and ECI to the 3-D Secure fields.
      oneOf:
      - type: object
        title: 3-D Secure
        description: EMV 3-D Secure authentication result fields.
        additionalProperties: false
        required:
        - status
        - cavv
        properties:
          status:
            type: string
            enum:
            - verified
            - attempted
            description: Set 3D Secure condition. Value used to determine E-commerce indicator (ECI).
          cavv:
            type: string
            maxLength: 50
            description: 'Cardholder authentication verification value from the 3-D Secure authentication response. Format: base64 encoded.'
          xid:
            type: string
            maxLength: 50
            description: 'Cardholder authentication transaction id. Format: base64 encoded.'
          three_ds_version:
            type: string
            maxLength: 10
            description: 3DSecure version (for example `2.1.0` or `2.2.0`).
          directory_server_id:
            type: string
            maxLength: 50
            description: 'Directory Server Transaction ID from 3DSecure 2.0 authentication. Format: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx'
      - type: object
        title: Decrypted wallet (Apple Pay / Google Pay)
        description: Wallet authentication for decrypted Apple Pay or Google Pay payments.
        additionalProperties: false
        required:
        - cavv
        properties:
          cavv:
            type: string
            maxLength: 50
            description: Wallet payment cryptogram (submitted in the repurposed 3-D Secure `cavv` field).
          eci:
            type: string
            maxLength: 10
            description: Electronic Commerce Indicator from the wallet payment data (submitted in the repurposed 3-D Secure `eci` field).
