          type: string
          description: The AVS/CVV precheck method for the added processor.
          nullable: true
        skipAvsCvv:
          type: boolean
          description: Whether skipping AVS/CVV is enabled for the added processor or not.
        processorFields:
          type: object
          description: The processor-dependent fields for the added processor.
        paymentTypes:
          type: array
          description: The allowed payment types for the added processor.
          items:
            type: string
            enum:
            - visa
            - mastercard
            - amex
            - discover
            - diners
            - jcb
            - maestro
        descriptor:
          type: object
          description: The descriptor fields for the added processor.
          properties:
            descriptor:
              type: string
              description: The descriptor for the added processor.
            phone:
              type: string
              description: The descriptor phone number for the added processor.
            city:
              type: string
              description: The descriptor city for the added processor.
            state:
              type: string
              description: The descriptor state for the added processor.
            url:
