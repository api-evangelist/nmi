                  emvPartialApprovals:
                    type: string
                    description: Allow Merchant to accept Partial Approvals for EMV transactions.
                  supportsGooglePay:
                    type: string
                    description: Merchant supports Google Pay.
                  supportsApplePay:
                    type: string
                    description: Merchant supports Apple Pay.
                  isApplePayEnabled:
                    type: string
                    description: Is Apple Pay enabled.
                  useDeviceRecognition:
