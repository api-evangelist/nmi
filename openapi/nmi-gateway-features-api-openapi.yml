              description: Whether the company is a required field or not.
            address:
              type: boolean
              description: Whether the address is a required field or not.
            city:
              type: boolean
              description: Whether the city is a required field or not.
            state:
              type: boolean
              description: Whether the state is a required field or not.
            zip:
              type: boolean
              description: Whether the ZIP code is a required field or not.
            country:
              type: boolean
              description: Whether the country is a required field or not.
            phone:
              type: boolean
              description: Whether the phone is a required field or not.
            email:
              type: boolean
              description: Whether the email is a required field or not.
            driversLicense:
              type: boolean
              description: Whether the driver's license is a required field or not.
            driversLicenseState:
              type: boolean
              description: Whether the driver's license state is a required field or not.
            driversLicenseDob:
              type: boolean
              description: Whether the driver's license date of birth is a required field or not.
            ssn:
              type: boolean
              description: Whether the SSN is a required field or not.
