openapi: 3.2.0
info:
  version: 1.0.0
  title: Payments Gateway Features API
  description: Our payments platform exposes two generations of API.
  x-logo:
    url: https://www.nmi.com/app/themes/nmi/images/NMI_Logo_Primary.webp
servers:
- url: https://sandbox.nmi.com/api
security: []
tags:
- name: Gateway Features
  description: Gateway Features
paths:
  /v4/affiliates/reports:
    post:
      tags:
      - Gateway Features
      operationId: getSubAffiliateList
      security: []
      summary: Get Sub-Affiliate List
      description: 'Usage

        This is a query to get all sub-affiliate accounts under your partner account.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetSubAffiliatesListRequest'
            examples:
              Create Standard Merchant:
                $ref: '#/components/examples/GetSubAffiliatesListExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubAffiliatesListResponse'
              examples:
                Get Processor Config:
                  $ref: '#/components/examples/GetSubAffiliatesListExampleResponse'
  /v4/billing/reports:
    post:
      tags:
      - Gateway Features
      operationId: seeMerchantBilling
      security: []
      summary: See Merchants' Billing
      description: 'Usage

        This will let you see what billing has occurred on merchants under your partner account. Billing reports are for Bill to Affiliate partners only. For Bill to Merchant partners, you will likely want commission and bill to me reports.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeeMerchantBillingRequest'
            examples:
              Get Merchants' Billing:
                $ref: '#/components/examples/SeeMerchantBillingExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeeMerchantBillingResponse'
              examples:
                Create Standard Merchant:
                  $ref: '#/components/examples/SeeMerchantBillingExampleResponse'
  /v4/commission_reports/reports:
    post:
      tags:
      - Gateway Features
      operationId: seeYourCommission
      security: []
      summary: See Your Commission
      description: 'Usage

        This will let you see what billing has occurred on merchants under your partner account'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeeYourCommissionRequest'
            examples:
              See Your Commission:
                $ref: '#/components/examples/SeeYourCommissionExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeeYourCommissionResponse'
              examples:
                See Your Commission:
                  $ref: '#/components/examples/SeeYourCommissionExampleResponse'
  /v4/fee_schedules/search:
    post:
      tags:
      - Gateway Features
      operationId: pullAllFeeSchedules
      security: []
      summary: Pull All Fee Schedules
      description: 'Usage

        This request will pull all fee schedules available on your account.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullAllFeeSchedulesRequest'
            examples:
              Pull All Fee Schedules:
                $ref: '#/components/examples/PullAllFeeSchedulesExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullAllFeeSchedulesResponse'
              examples:
                Pull All Fee Schedules:
                  $ref: '#/components/examples/PullAllFeeSchedulesExampleResponse'
  /v4/fee_schedules/{id}/fees:
    get:
      tags:
      - Gateway Features
      operationId: getFeesInSchedule
      security: []
      summary: Get Fees Inside a Fee Schedule
      description: 'Usage

        Use this request to get a full list of all fees currently set on an existing fee schedule.'
      parameters:
      - $ref: '#/components/parameters/GetFeesInScheduleRequest'
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFeesInScheduleResponse'
              examples:
                Get Fees Inside a Fee Schedule:
                  $ref: '#/components/examples/GetFeesInScheduleExampleResponse'
  /v4/merchants:
    post:
      tags:
      - Gateway Features
      operationId: createMerchant
      security: []
      summary: Create Merchant
      description: 'Usage

        This step simply creates the merchant account, getting their basic information into the gateway. After this step, you can add processors and value-added services before sending the welcome email to the merchant.


        Note - you can board merchants under an existing sub-affiliate by providing a `parentAffiliateId` in the create request. This will add the merchant under the specified affiliate instead of the account making the request.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantRequest'
            examples:
              Create Standard Merchant:
                $ref: '#/components/examples/CreateStandardMerchantRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMerchantResponse'
              examples:
                Create Standard Merchant:
                  $ref: '#/components/examples/CreateStandardMerchantResponse'
  /v4/merchants/reports:
    post:
      tags:
      - Gateway Features
      operationId: getMerchantList
      security: []
      summary: Get Merchant List
      description: 'Usage

        This is a query to get all merchant accounts under your partner account.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMerchantListRequest'
            examples:
              Create Standard Merchant:
                $ref: '#/components/examples/GetMerchantListExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMerchantListResponse'
              examples:
                Create Standard Merchant:
                  $ref: '#/components/examples/GetMerchantListExampleResponse'
  /v4/merchants/{gateway_id}:
    patch:
      summary: Assign Fee Schedule to Merchant / Complete and Send Welcome Email / Agree to…
      operationId: patch_v4-merchants-gateway-id
      tags:
      - Gateway Features
      security: []
      description: 'Assign a Fee Schedule to the Merchant


        This can be done when creating the merchant in the first place (1. Create a Merchant) but you can also add it whenever you’d like using the request below.


        ### Assign Fee Schedule Request

        Please note this is a `PATCH` request. Attempting a `POST` will result in an error.


        As noted above, the `costPlan` value can be passed in the initial merchant boarding step if you know what it will be at that point.


        Complete & Send the Welcome Email


        This request will complete the merchant creation and send the welcome email to the merchant. `activatePendingServices` is optional, and is the equivalent of checking the “activate pending services immediately” box in the partner portal.


        ### Complete and Send Welcome Email Request

        This is a `PATCH` request, not a `POST`.


        `activatePendingServices` is optional and defaults to false.


        Note - `agreementTextId` is based on the agreement that is needed to be agreed to. You can pull the correct agreement language with a `/merchants/{id}/agreement_text` request. This will return the id and language that you are agreeing to.


        Agree to TOS and Fees for Merchant Request


        ### Agree to TOS and Fees for Merchant Request

        This is a `PATCH` request, not a `POST`.


        This request will activate any and all pending service on a merchant account. This is the equivalent of checking the “Activate pending services immediately” box in the partner portal.


        `agreementTextId` is based on the agreement that is needed to be agreed to. You can pull the correct agreement language with a `/merchants/{id}/agreement_text` request. This will return the id and language that you are agreeing to.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/GatewayId'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/AssignFeeScheduleToMerchantRequest'
              - $ref: '#/components/schemas/CompleteAndSendWelcomeEmailRequest'
              - $ref: '#/components/schemas/AgreeTosAndFeesForMerchantRequest'
            examples:
              Add Standard Processor:
                $ref: '#/components/examples/AssignFeeScheduleToMerchant'
              Complete and Send Welcome Email:
                $ref: '#/components/examples/CompleteAndSendWelcomeEmail'
              Agree to TOS and Fees for a Merchant:
                $ref: '#/components/examples/AgreeTosAndFeesForMerchantExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignFeeScheduleToMerchantResponse'
              examples:
                Add Standard Processor:
                  $ref: '#/components/examples/AssignFeeScheduleToMerchantExampleResponse'
                Complete and Send Welcome Email:
                  $ref: '#/components/examples/CompleteAndSendWelcomeEmailExampleResponse'
                Agree to TOS and Fees for a Merchant:
                  $ref: '#/components/examples/AgreeTosAndFeesForMerchantExampleResponse'
    get:
      tags:
      - Gateway Features
      operationId: getSpecificMerchantInformation
      security: []
      summary: Get a Specific Merchant's Information
      description: 'Usage


        This request will return all the details of a specific merchant account. If you need to get multiple merchants'' info at once, use the Get Merchant List request.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/GatewayId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSpecificMerchantInformationResponse'
              examples:
                Get a Specific Merchant's Information:
                  $ref: '#/components/examples/GetSpecificMerchantInformationExampleResponse'
  /v4/merchants/{gateway_id}/security_keys:
    post:
      tags:
      - Gateway Features
      operationId: createMerchantKey
      security: []
      summary: Create Merchant API Keys
      description: 'Usage

        This request will create a new API key for a user on a merchant account. The request includes all key types, including those for the Payment API, Query API, Collect.js, and Collect Checkout.


        Sending User ID

        The `userId` is optional, and will default to the primary user on the account if it is not provided.


        A full list of user IDs on merchant accounts can be queried via Get Merchant or Partner User Info.'
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/GatewayId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantKeysRequest'
            examples:
              Create API Key:
                $ref: '#/components/examples/CreateAPIKey'
              Create Collect Checkout Key:
                $ref: '#/components/examples/CreateCheckoutKey'
              Create Collect.js Key:
                $ref: '#/components/examples/CreateCollectJsKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMerchantKeysResponse'
              examples:
                Create API Key:
                  $ref: '#/components/examples/CreateAPIKeyResponse'
                Create Collect Checkout Key:
                  $ref: '#/components/examples/CreateCheckoutKeyResponse'
                Create Collect.js Key:
                  $ref: '#/components/examples/CreateCollectJsKeyResponse'
  /v4/processors/{id}:
    get:
      tags:
      - Gateway Features
      operationId: getSettlementTime
      security: []
      summary: Get Settlement Time
      description: 'Usage

        Use this request to get the settlementTime that is currently set on an existing account. You will see the result at the bottom of the response, in Universal Time Coordinated (UTC).


        Note - settlement time null represents the default settlement time.'
      parameters:
      - $ref: '#/components/parameters/GetSettlementTimeRequest'
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSettlementTimeResponse'
              examples:
                Get Processor Config:
                  $ref: '#/components/examples/GetSettlementTimeExampleResponse'
    patch:
      tags:
      - Gateway Features
      operationId: updatingSettlementTime
      security: []
      summary: Updating Settlement Time
      description: 'Usage

        This can be done when creating the merchant’s processor in the first place (Add Processors) but you can also update it whenever you’d like using the request below. Please note this is a PATCH request. Attempting a POST will result in an error. The date must be a valid ISO 8601 time string (Example: 13:14:15). Since this is an update to an existing merchant’s processor, we return the processor object, and you can confirm your change was successful by looking at the settlementTime value in this response.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatingSettlementTimeRequest'
            examples:
              Updating Settlement Time:
                $ref: '#/components/examples/UpdatingSettlementTimeExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatingSettlementTimeResponse'
              examples:
                Updating Settlement Time:
                  $ref: '#/components/examples/UpdatingSettlementTimeExampleResponse'
  /v4/transactions/reports:
    post:
      tags:
      - Gateway Features
      operationId: getTransactionData
      security: []
      summary: Get Transaction Data
      description: 'Usage

        This is a query to find live transactions by merchants under your partner account. The query will respond in Universal Time Coordinated (UTC).


        If you provide a specific transaction id, then it will return that transaction.


        If you provide a sub-affiliates'' merchant id in the merchant id list, it will return that merchant''s transactions.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetTransactionDataRequest'
            examples:
              Create Standard Merchant:
                $ref: '#/components/examples/GetTransactionDataExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionDataResponse'
              examples:
                Get Processor Config:
                  $ref: '#/components/examples/GetTransactionDataExampleResponse'
  /v4/usernames/search:
    post:
      tags:
      - Gateway Features
      operationId: checkUsernameAvailability
      security: []
      summary: Username Availability
      description: 'Usage

        This is optional, but you can check to make sure a username is available before submitting your merchant creation request.


        This can be useful if you want to do form validation on your website to prevent the user from entering a username that has already been taken.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckUsernameAvailabilityRequest'
            examples:
              Create Standard Merchant:
                $ref: '#/components/examples/CheckUsernameAvailabilityExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckUsernameAvailabilityResponse'
              examples:
                Get Processor Config:
                  $ref: '#/components/examples/CheckUsernameAvailabilityExampleResponse'
  /v4/users/search:
    post:
      tags:
      - Gateway Features
      operationId: getMerchantOrPartnerUserInfo
      security: []
      summary: Get Merchant or Partner User Info
      description: 'Usage

        This will return information on all users associated with a specific merchant or sub-affiliate account.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMerchantOrPartnerUserInfoRequest'
            examples:
              Create Standard Merchant:
                $ref: '#/components/examples/GetMerchantOrPartnerUserInfoExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMerchantOrPartnerUserInfoResponse'
              examples:
                Get Processor Config:
                  $ref: '#/components/examples/GetMerchantOrPartnerUserInfoExampleResponse'
components:
  schemas:
    SeeYourCommissionRequest:
      title: See Merchants' Billing
      allOf:
      - type: object
        required:
        - month
        - year
        - offset
        - maxResults
        properties:
          month:
            type: string
            description: Required. Month requested for the response.
          year:
            type: string
            description: Required. Year requested for the response.
          offset:
            type: string
            description: 'Required. "offset": 0 // Like all reports and search endpoints, you can specify the offset, which is the start point for the responses'
          maxResults:
            type: string
            description: Required. Value must be between 1-1000.
    AssignFeeScheduleToMerchantRequest:
      title: Assign Fee Schedule to Merchant
      allOf:
      - type: object
        required:
        - costPlan
        properties:
          costPlan:
            type: string
            description: Id of the fee schedule.
    SeeYourCommissionResponse:
      type: object
      title: Response
      properties:
        objectType:
          type: string
          enum:
          - serviceConfig
          description: The type of object that was returned as a result of the request.
        reportId:
          type: number
          description: The ID of the report.
        offset:
          type: number
          description: The first N skipped results.
        maxResults:
          type: number
          description: The max number results.
        totalResults:
          type: number
          description: The total number of results.
        hasMore:
          type: boolean
          description: If are there more results for the search.
        links:
          type: array
          description: Links for querying results.
          items:
            type: object
            properties:
              first:
                type: string
                description: First page of query results.
              last:
                type: string
                description: Last page of query results.
              next:
                type: string
                description: Next page of current query results.
              previous:
                type: string
                description: Previous page of current query results.
        results:
          type: array
          description: Results for the search.
          items:
            type: objectType
            properties:
              objectType:
                type: string
                description: Type of the returned response object
              rowId:
                type: string
                description: The ID for the row.
              parentAffiliate:
                type: string
                description: The ID of the affiliate directly above the merchant.
              merchant:
                type: object
                properties:
                  company:
                    type: string
                    description: Merchant's company name
                  id:
                    type: string
                    description: The ID of the merchant
                  externalIdentifier:
                    type: string
                    description: A description to further describe or identify the merchant
              commission:
                type: object
                properties:
                  name:
                    type: string
                    description: The name of the commission
                  mcc:
                    type: string
                    description: The Merchant Category Code
              processor:
                type: object
                properties:
                  id:
                    type: string
                    description: The id of the processor
                  name:
                    type: string
                    description: The name of the processor
              service:
                type: object
                properties:
                  id:
                    type: string
                    description: The id of the service
                  name:
                    type: string
                    description: The name of the service
              quantity:
                type: string
                description: The quantity of the commission
              resale:
                type: object
                properties:
                  objectType:
                    type: string
                    description: The type of object that was returned as a result of the request
                  amount:
                    type: string
                    description: The amount of the resale
                  currency:
                    type: string
                    description: The currency of the resale
              totalResale:
                type: object
                properties:
                  objectType:
                    type: string
                    description: The type of object that was returned as a result of the request
                  amount:
                    type: string
                    description: The amount of the total resale
                  currency:
                    type: string
                    description: The currency of the total resale
              cost:
                type: object
                properties:
                  objectType:
                    type: string
                    description: The type of object that was returned as a result of the request
                  amount:
                    type: string
                    description: The amount of the cost
                  currency:
                    type: string
                    description: The currency of the cost
              totalCost:
                type: object
                properties:
                  objectType:
                    type: string
                    description: The type of object that was returned as a result of the request
                  amount:
                    type: string
                    description: The amount of the total cost
                  currency:
                    type: string
                    description: The currency of the total cost
              commissionEarned:
                type: object
                properties:
                  objectType:
                    type: string
                    description: The type of object that was returned as a result of the request
                  amount:
                    type: string
                    description: The amount of the commission earned
                  currency:
                    type: string
                    description: The currency of the commission earned
              recollections:
                type: object
                properties:
                  objectType:
                    type: string
                    description: The type of object that was returned as a result of the request
                  amount:
                    type: string
                    description: The amount of the recollections
                  currency:
                    type: string
                    description: The currency of the recollections
              returns:
                type: object
                properties:
                  objectType:
                    type: string
                    description: The type of object that was returned as a result of the request
                  amount:
                    type: string
                    description: The amount of the returns
                  currency:
                    type: string
                    description: The currency of the returns
              totalCommission:
                type: object
                properties:
                  objectType:
                    type: string
                    description: The type of object that was returned as a result of the request
                  amount:
                    type: string
                    description: The amount of the total commission
                  currency:
                    type: string
                    description: The currency of the total commission
              subAffiliate:
                type: string
                description: The quantity of the commission
    CreateMerchantKeysRequest:
      title: Create Merchant API Keys
      allOf:
      - type: object
        required:
        - description
        - permissions
        properties:
          userId:
            type: string
            description: The merchant user for whom to generate the API key. Optional and will default to primary user on the account if it is not provided.
          description:
            type: string
            description: Description associated with the new key.
          permissions:
            type: array
            items:
              type: string
              enum:
              - transaction
              - cart
              - tokenization
              - collectCheckout
            description: ''
    SeeMerchantBillingRequest:
      title: See Merchants' Billing
      allOf:
      - type: object
        required:
        - maxResults
        - startDate
        - endDate
        - offset
        properties:
          maxResults:
            type: string
            description: Required. Value must be between 1-1000.
          startDate:
            type: string
            description: Required. Start point for the responses.
          endDate:
            type: string
            description: Required. End point for the responses.
          offset:
            type: string
            description: 'Required. "offset": 0 // Like all reports and search endpoints, you can specify the offset, which is the start point for the responses'
    UpdatingSettlementTimeResponse:
      type: object
      title: Response
      properties:
        objectType:
          type: string
          description: The type of object that was returned as a result of the request.
        id:
          type: number
          description: The ID of the request.
        processorType:
          type: string
          description: The type of payment processor.
        processorId:
          type: string
          description: The ID of the processor.
        processorName:
          type: string
          description: The name of the processor.
        serviceId:
          type: string
          description: The ID of the processor platform.
        merchantId:
          type: number
          description: The ID of the merchant.
        mcc:
          type: string
          description: The Merchant Category Code.
        accountClassification:
          type: string
          description: The processor account classification.
        maxTicketAmount:
          type: string
          description: The maximum amount for a single transaction run through the added processor.
        maxMonthlyVolume:
          type: string
          description: The maximum total amount that can be run through the processor in a single month.
        applyToAllCardType:
          type: boolean
          description: Whether the maxMonthlyVolume and maxTicketAmount apply to all payment methods through the added processor or not.
        enableDuplicateChecking:
          type: boolean
          description: Whether duplicate checking is enabled or not.
        allowMerchantOverride:
          type: boolean
          description: Whether the merchant is allowed to ignore the duplicate check on a per-transaction basis or not.
        duplicateTime:
          type: string
          description: The amount of time in seconds to look back to check if a transaction is a duplicate.
        status:
          type: string
          description: The status of the added processor or service, depending on the processor/billing authorization status.
          enum:
          - active
          - pending
        condition:
          type: string
          description: The condition of the added processor or service.
          enum:
          - offered
          - notOffered
          - mandatory
        extraDetails:
          type: object
          description: Any extra details about the added processor.
        freeTrialEndDate:
          type: string
          description: End date of free trial.
        freeTrialDaysLeft:
          type: string
          description: Days left of free trial.
        hasBeenActive:
          type: boolean
          description: Whether the processor has been active before or not.
        created:
          type: string
          description: The date and time of when the processor or service was added.
        updated:
          type: string
          description: The date and time of when the processor or service was last updated.
        supportsReroutedRefunds:
          type: boolean
          description: Whether the added processor supports rerouted refunds or not.
