openapi: 3.2.0
info:
  version: 1.0.0
  title: Payments Merchants API
  description: Our payments platform exposes two generations of API.
  x-logo:
    url: https://www.nmi.com/app/themes/nmi/images/NMI_Logo_Primary.webp
servers:
- url: https://sandbox.nmi.com/api
security: []
tags:
- name: Merchants
paths:
  /v4/merchants:
    post:
      tags:
      - Merchants
      operationId: createMerchant
      security: []
      summary: Create Merchant
      description: 'Usage

        This step simply creates the merchant account, getting their basic information into the gateway. After this step, you can add processors and value-added services before sending the welcome email to the merchant.


        Note - you can board merchants under an existing sub-affiliate by providing a `parentAffiliateId` in the create request. This will add the merchant under the specified affiliate instead of the account making the request.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantRequest'
            examples:
              Create Standard Merchant:
                $ref: '#/components/examples/CreateStandardMerchantRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMerchantResponse'
              examples:
                Create Standard Merchant:
                  $ref: '#/components/examples/CreateStandardMerchantResponse'
  /v4/merchants/reports:
    post:
      tags:
      - Merchants
      operationId: getMerchantList
      security: []
      summary: Get Merchant List
      description: 'Usage

        This is a query to get all merchant accounts under your partner account.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMerchantListRequest'
            examples:
              Create Standard Merchant:
                $ref: '#/components/examples/GetMerchantListExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMerchantListResponse'
              examples:
                Create Standard Merchant:
                  $ref: '#/components/examples/GetMerchantListExampleResponse'
  /v4/merchants/{gateway_id}:
    patch:
      summary: Assign Fee Schedule to Merchant / Complete and Send Welcome Email / Agree to…
      operationId: patch_v4-merchants-gateway-id
      tags:
      - Merchants
      security: []
      description: 'Assign a Fee Schedule to the Merchant


        This can be done when creating the merchant in the first place (1. Create a Merchant) but you can also add it whenever you’d like using the request below.


        ### Assign Fee Schedule Request

        Please note this is a `PATCH` request. Attempting a `POST` will result in an error.


        As noted above, the `costPlan` value can be passed in the initial merchant boarding step if you know what it will be at that point.


        Complete & Send the Welcome Email


        This request will complete the merchant creation and send the welcome email to the merchant. `activatePendingServices` is optional, and is the equivalent of checking the “activate pending services immediately” box in the partner portal.


        ### Complete and Send Welcome Email Request

        This is a `PATCH` request, not a `POST`.


        `activatePendingServices` is optional and defaults to false.


        Note - `agreementTextId` is based on the agreement that is needed to be agreed to. You can pull the correct agreement language with a `/merchants/{id}/agreement_text` request. This will return the id and language that you are agreeing to.


        Agree to TOS and Fees for Merchant Request


        ### Agree to TOS and Fees for Merchant Request

        This is a `PATCH` request, not a `POST`.


        This request will activate any and all pending service on a merchant account. This is the equivalent of checking the “Activate pending services immediately” box in the partner portal.


        `agreementTextId` is based on the agreement that is needed to be agreed to. You can pull the correct agreement language with a `/merchants/{id}/agreement_text` request. This will return the id and language that you are agreeing to.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/GatewayId'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/AssignFeeScheduleToMerchantRequest'
              - $ref: '#/components/schemas/CompleteAndSendWelcomeEmailRequest'
              - $ref: '#/components/schemas/AgreeTosAndFeesForMerchantRequest'
            examples:
              Add Standard Processor:
                $ref: '#/components/examples/AssignFeeScheduleToMerchant'
              Complete and Send Welcome Email:
                $ref: '#/components/examples/CompleteAndSendWelcomeEmail'
              Agree to TOS and Fees for a Merchant:
                $ref: '#/components/examples/AgreeTosAndFeesForMerchantExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignFeeScheduleToMerchantResponse'
              examples:
                Add Standard Processor:
                  $ref: '#/components/examples/AssignFeeScheduleToMerchantExampleResponse'
                Complete and Send Welcome Email:
                  $ref: '#/components/examples/CompleteAndSendWelcomeEmailExampleResponse'
                Agree to TOS and Fees for a Merchant:
                  $ref: '#/components/examples/AgreeTosAndFeesForMerchantExampleResponse'
    get:
      tags:
      - Merchants
      operationId: getSpecificMerchantInformation
      security: []
      summary: Get a Specific Merchant's Information
      description: 'Usage


        This request will return all the details of a specific merchant account. If you need to get multiple merchants'' info at once, use the Get Merchant List request.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/GatewayId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSpecificMerchantInformationResponse'
              examples:
                Get a Specific Merchant's Information:
                  $ref: '#/components/examples/GetSpecificMerchantInformationExampleResponse'
  /v4/merchants/{gateway_id}/security_keys:
    post:
      tags:
      - Merchants
      operationId: createMerchantKey
      security: []
      summary: Create Merchant API Keys
      description: 'Usage

        This request will create a new API key for a user on a merchant account. The request includes all key types, including those for the Payment API, Query API, Collect.js, and Collect Checkout.


        Sending User ID

        The `userId` is optional, and will default to the primary user on the account if it is not provided.


        A full list of user IDs on merchant accounts can be queried via Get Merchant or Partner User Info.'
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/GatewayId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantKeysRequest'
            examples:
              Create API Key:
                $ref: '#/components/examples/CreateAPIKey'
              Create Collect Checkout Key:
                $ref: '#/components/examples/CreateCheckoutKey'
              Create Collect.js Key:
                $ref: '#/components/examples/CreateCollectJsKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMerchantKeysResponse'
              examples:
                Create API Key:
                  $ref: '#/components/examples/CreateAPIKeyResponse'
                Create Collect Checkout Key:
                  $ref: '#/components/examples/CreateCheckoutKeyResponse'
                Create Collect.js Key:
                  $ref: '#/components/examples/CreateCollectJsKeyResponse'
components:
  schemas:
    AssignFeeScheduleToMerchantRequest:
      title: Assign Fee Schedule to Merchant
      allOf:
      - type: object
        required:
        - costPlan
        properties:
          costPlan:
            type: string
            description: Id of the fee schedule.
    CreateMerchantKeysRequest:
      title: Create Merchant API Keys
      allOf:
      - type: object
        required:
        - description
        - permissions
        properties:
          userId:
            type: string
            description: The merchant user for whom to generate the API key. Optional and will default to primary user on the account if it is not provided.
          description:
            type: string
            description: Description associated with the new key.
          permissions:
            type: array
            items:
              type: string
              enum:
              - transaction
              - cart
              - tokenization
              - collectCheckout
            description: ''
    GetSpecificMerchantInformationResponse:
      type: object
      title: Response
      properties:
        objectType:
          type: string
          enum:
          - serviceConfig
          description: The type of object that was returned as a result of the request.
        id:
          type: string
          description: The ID for the transaction.
        created:
          type: string
          format: date-time
          description: The timestamp indicating when the transaction was created.
        updated:
          type: string
          format: date-time
          description: The timestamp indicating when the transaction was last updated.
        firstName:
          type: string
          description: The first name of the merchant's company contact.
        lastName:
          type: string
          description: The last name of the merchant's company contact.
        company:
          type: string
          description: The merchant's company name.
        email:
          type: string
          description: The email of the merchant's company contact.
        phone:
          type: string
          description: The phone number of the merchant's company contact.
        fax:
          type: string
          description: The fax number of the merchant's company contact.
        address1:
          type: string
          description: The first line of the merchant's address.
        address2:
          type: string
          description: The second line of the merchant's address.
        city:
          type: string
          description: The city associated with the merchant's address.
        state:
          type: string
          description: The state associated with the merchant's address.
        zip:
          type: string
          description: The postal code associated with the merchant's address.
        country:
          type: string
          description: The country associated with the merchant's address.
        timezone:
          type: string
          description: The merchant's timezone.
        costPlan:
          type: string
          description: The cost plan assigned to the merchant.
        status:
          type: string
          description: The status of the merchant.
        externalIdentifier:
          type: string
          description: A description to further describe or identify the merchant.
        lastTransactionDate:
          type: string
          description: The date of the last transaction on the merchant.
        parentAffiliateId:
          type: string
          description: The ID of the affiliate directly above the merchant.
        accountInfo:
          type: object
          description: Banking information for merchant billing.
          properties:
            checkAba:
              type: string
              description: The routing/ABA number used to bill the merchant.
            checkAccount:
              type: string
              description: The account number used to bill the merchant.
            accountType:
              type: string
              description: The type of bank account being used.
            accountHolderType:
              type: string
              description: The type of holder for the bank account being used.
        features:
          type: object
          description: A collection of various merchant feature flags.
          properties:
            forceTos:
              type: boolean
              description: Whether or not the merchant is forced to accept the Terms of Service.
            forceBillingAuth:
              type: boolean
              description: Whether or not the merchant is forced to accept the Billing Auth.
            allowBlindCredits:
              type: boolean
              description: Whether or not the merchant is allowed to issue blind credits for Credit Cards.
            allowBlindCheckCredits:
              type: boolean
              description: Whether or not the merchant is allowed to issue blind credits for Checks.
            advancedTransactionRouting:
              type: boolean
              description: Whether or not the merchant has advanced transaction routing enabled.
            sendBillingEmail:
              type: boolean
              description: Whether or not the merchant receives an email for their billing.
            braspag:
              type: object
              description: Feature flags specifically related to the braspag processor.
              properties:
                advancedTransactionRouting:
                  type: boolean
                  description: Whether or not the braspag processor has advanced transaction routing enabled.
            verifi:
              type: object
              description: Feature flags specifically related to the verifi service.
              properties:
                enabled:
                  type: boolean
                  description: Whether or not the verifi service is enabled for the merchant.
            viewBillingStatement:
              type: boolean
              description: Whether or not the merchant can view their billing statement.
            litle:
              type: object
              description: Feature flags specifically related to the litle processor.
              properties:
                reportGroup:
                  type: string
                  description: The merchant's litle report group. Returns false if not configured.
                prePaidIndicator:
                  type: string
                  description: The merchant's litle prepaid indicator. Returns false if not configured.
                affluentIndicator:
                  type: string
                  description: The merchant's litle affluent indicator. Returns false if not configured.
                recycleAdvice:
                  type: string
                  description: The merchant's litle recycle advice. Returns false if not configured.
                campaign:
                  type: string
                  description: The merchant's litle campaign. Returns false if not configured.
                affiliate:
                  type: string
                  description: The merchant's litle affiliate. Returns false if not configured.
                merchantGroupId:
                  type: string
                  description: The merchant's litle group ID. Returns false if not configured.
            allowEmptyCcExp:
              type: boolean
              description: Whether or not the merchant is allowed to pass empty Credit Card Expiration Dates.
            pastDue:
              type: boolean
              description: Whether or not the merchant's bill is past due.
            apiReceipt:
              type: boolean
              description: Whether or not the merchant's API transactions send receipts.
            batchReceipt:
              type: boolean
              description: Whether or not the merchant can batch receipts.
            delinquent:
              type: boolean
              description: Whether or not the merchant is in a delinquent state.
            commercialCardIndicator:
              type: string
              description: The merchant's commercial card indicator. Returns false if not configured.
            customDescription:
              type: string
              description: The merchant's custom description. Returns false if not configured.
            apiAllowOnlyUsername:
              type: boolean
              description: Whether or not the merchant can authenticate with the APIs using only a username.
            orderIdDuplicateCheck:
              type: boolean
              description: Whether or not the merchant has duplicate checking for the Order ID field.
            cardLevelResult:
              type: string
              description: The merchant's card level result. Returns false if not configured.
            pmsalem:
              type: object
              description: Feature flags specifically related to the pmsalem processor.
              properties:
                ignoreAmexCvv:
                  type: boolean
                  description: Whether or not the merchant's pmsalem processor ignores the Amex CVV field.
                allowNovusVerify:
                  type: boolean
                  description: Whether or not the merchant's pmsalem processor can verify Novus cards schemes.
                idInMdf11:
                  type: boolean
                  description: Whether or not the merchant's pmsalem processor can pass the ID in MDF11.
            credorax:
              type: object
              description: Feature flags specifically related to the credorax processor.
              properties:
                bankNet:
                  type: string
                  description: The merchant's bank net value for credorax. Returns false if not configured.
                z5Risk:
                  type: string
                  description: The merchant's z5 risk value for credorax. Returns false if not configured.
            vantiv:
              type: object
              description: Feature flags specifically related to the vantiv processor.
              properties:
                remainingBalance:
                  type: string
                  description: The merchant's remaining balance for vantiv. Returns false if not configured.
            prosa:
              type: object
              description: Feature flags specifically related to the prosa processor.
              properties:
                deferredPayment:
                  type: boolean
                  description: Whether or not the merchant has deferred payments enabled for the prosa processor.
            cronopay:
              type: object
              description: Feature flags specifically related to the cronopay processor.
              properties:
                customerId:
                  type: string
                  description: The merchant's cronopay customer ID. Returns false if not configured.
            captureHigher:
              type: boolean
              description: Whether or not the merchant is allowed to capture higher than the preceding auth.
            moneris:
              type: object
              description: Feature flags related specifically to the moneris processor.
              properties:
                orderId:
                  type: string
                  description: The merchant's order ID for moneris transactions. Returns false if not configured.
            extendedFileBatchResponse:
              type: boolean
              description: Whether or not the merchant receives and extended file batch response.
            credov3:
              type: object
              description: Feature flags related specifically to the credov3 processor.
              properties:
                ignoreAmexCvv:
                  type: boolean
                  description: Whether or not the merchant's credov3 processor ignores the Amex CVV field.
            enforceRequiredFieldsForSwiped:
              type: boolean
              description: Whether or not the merchant must continue to pass required fields when using Swipe.
            preventDuplicateCvRecords:
              type: boolean
              description: Whether or not the merchant is prevented from making duplicate Customer Vault records.
            preventConfiguringSurcharge:
              type: boolean
              description: Whether or not the merchant is prevented from configuring settings for surcharge.
            tsys:
              type: object
              description: Feature flags related specifically to the tsys processor.
              properties:
                paymentFacilitatorFields:
                  type: string
                  description: The merchant's tsys payment facilitator fields. Returns false if not configured.
                allowCustomReport:
                  type: boolean
                  description: Whether or not the merchant is allowed to do a custom report with tsys.
                alternativePostData:
                  type: boolean
                  description: Whether or not the merchant is allowed to add alternative post data with tsys.
            requireProcessorFieldOnVt:
              type: string
              description: Require a processor be specified on all transactions in the Virtual Terminal.
            isCardTesting:
              type: string
              description: Is merchant's card testing.
            allowTipOnVtKeyedTransactions:
              type: string
              description: Allow merchant to enter tips in the virtual terminal on keyed transactions.
            transitForceAcceptance:
              type: string
              description: Merchant is approved for Force Acceptance.
            level3:
              type: object
              description: Merchant's level III template data.
              properties:
                autoLoadTemplate:
                  type: boolean
                  description: Automatically add my Level III template data to the merchant's credit card transactions.
            emvPartialApprovals:
              type: string
              description: Allow Merchant to accept Partial Approvals for EMV transactions.
            supportsGooglePay:
              type: string
              description: Merchant supports Google Pay.
            supportsApplePay:
              type: string
              description: Merchant supports Apple Pay.
            isApplePayEnabled:
              type: string
              description: Is Apple Pay enabled.
            useDeviceRecognition:
              type: string
              description: Enable device recognition for all merchant users when logging into the control panel (users with two-factor enabled are exempt).
        needsPendingServicesActivated:
          type: string
          description: Merchant needs pending services activated.
        payFacBillingPeriod:
          type: string
          description: Payment Facilitator Billing Period.
        rejectedCertificates:
          type: string
          description: Number of rejected certificates.
    GetMerchantListRequest:
      title: Get Merchant List
      allOf:
      - type: object
        required:
        - maxResults
        properties:
          maxResults:
            type: string
            description: Required. Value must be between 1-1000.
          ids:
            type: array
            description: An array of merchant ids.
            items:
              type: string
          parentAffiliateId:
            type: string
            description: '"parentAffiliateId": "1" // An affiliate id. Only merchants under this affiliate will be returned, rather than the full tree.'
          type:
            type: string
            description: '"type": "gateway" // Only available options are gateway, test, splitFunding, mobile.'
          search:
            type: string
            description: '"search": "Asdf" Performs a search on this text as a case-insensitive search on any of the following: email, company name, first and last name, phone number, external id, or username'
          offset:
            type: string
            description: '"offset": 0 // Like all reports and search endpoints, you can specify the offset, which is the start point for the responses'
    GetMerchantListResponse:
      type: object
      title: Response
      properties:
        objectType:
          type: string
          enum:
          - serviceConfig
          description: The type of object that was returned as a result of the request.
        reportId:
          type: number
          description: The ID of the report.
        offset:
          type: number
          description: The first N skipped results.
        maxResults:
          type: number
          description: The max number results.
        totalResults:
          type: number
          description: The total number of results.
        hasMore:
          type: boolean
          description: If are there more results for the search.
        links:
          type: array
          description: Links for querying results.
          items:
            type: object
            properties:
              first:
                type: string
                description: First page of query results.
              last:
                type: string
                description: Last page of query results.
              next:
                type: string
                description: Next page of current query results.
              previous:
                type: string
                description: Previous page of current query results.
        results:
          type: array
          description: Results for the search.
          items:
            type: object
            properties:
              objectType:
                type: string
                description: Type of the returned response object
              id:
                type: string
                description: The ID for the transaction.
              created:
                type: string
                format: date-time
                description: The timestamp indicating when the transaction was created.
              updated:
                type: string
                format: date-time
                description: The timestamp indicating when the transaction was last updated.
              firstName:
                type: string
                description: The first name of the merchant's company contact
              lastName:
                type: string
                description: The last name of the merchant's company contact
              company:
                type: string
                description: The merchant's company name.
              email:
                type: string
                description: The email of the merchant's company contact
              phone:
                type: string
                description: The phone number of the merchant's company contact
              fax:
                type: string
                description: The fax number of the merchant's company contact
              address1:
                type: string
                description: The first line of the merchant's address
              address2:
                type: string
                description: The second line of the merchant's address
              city:
                type: string
                description: The city associated with the merchant's address
              state:
                type: string
                description: The state associated with the merchant's address
              zip:
                type: string
                description: The postal code associated with the merchant's address
              country:
                type: string
                description: The country associated with the merchant's address
              timezone:
                type: string
                description: The merchant's timezone
              costPlan:
                type: string
                description: The cost plan assigned to the merchant.
              status:
                type: string
                description: The status of the merchant.
              externalIdentifier:
                type: string
                description: A description to further describe or identify the merchant.
              lastTransactionDate:
                type: string
                description: The date of the last transaction on the merchant.
              parentAffiliateId:
                type: string
                description: The ID of the affiliate directly above the merchant.
              accountInfo:
                type: object
                description: Banking information for merchant billing.
                properties:
                  checkAba:
                    type: string
                    description: The routing/ABA number used to bill the merchant.
                  checkAccount:
                    type: string
                    description: The account number used to bill the merchant.
                  accountType:
                    type: string
                    description: The type of bank account being used.
                  accountHolderType:
                    type: string
                    description: The type of holder for the bank account being used.
              features:
                type: object
                description: A collection of various merchant feature flags.
                properties:
                  forceTos:
                    type: boolean
                    description: Whether or not the merchant is forced to accept the Terms of Service.
                  forceBillingAuth:
                    type: boolean
                    description: Whether or not the merchant is forced to accept the Billing Auth.
                  allowBlindCredits:
                    type: boolean
                    description: Whether or not the merchant is allowed to issue blind credits for Credit Cards.
                  allowBlindCheckCredits:
                    type: boolean
                    description: Whether or not the merchant is allowed to issue blind credits for Checks.
                  advancedTransactionRouting:
                    type: boolean
                    description: Whether or not the merchant has advanced transaction routing enabled.
                  sendBillingEmail:
                    type: boolean
                    description: Whether or not the merchant receives an email for their billing.
                  braspag:
                    type: object
                    description: Feature flags specifically related to the braspag processor.
                    properties:
                      advancedTransactionRouting:
                        type: boolean
                        description: Whether or not the braspag processor has advanced transaction routing enabled.
                  verifi:
                    type: object
                    description: Feature flags specifically related to the verifi service.
                    properties:
                      enabled:
                        type: boolean
                        description: Whether or not the verifi service is enabled for the merchant.
                  viewBillingStatement:
                    type: boolean
                    description: Whether or not the merchant can view their billing statement.
                  litle:
                    type: object
                    description: Feature flags specifically related to the litle processor.
                    properties:
                      reportGroup:
                        type: string
                        description: The merchant's litle report group. Returns false if not configured.
                      prePaidIndicator:
                        type: string
                        description: The merchant's litle prepaid indicator. Returns false if not configured.
                      affluentIndicator:
                        type: string
                        description: The merchant's litle affluent indicator. Returns false if not configured.
                      recycleAdvice:
                        type: string
                        description: The merchant's litle recycle advice. Returns false if not configured.
                      campaign:
                        type: string
                        description: The merchant's litle campaign. Returns false if not configured.
                      affiliate:
                        type: string
                        description: The merchant's litle affiliate. Returns false if not configured.
                      merchantGroupId:
                        type: string
                        description: The merchant's litle group ID. Returns false if not configured.
                  allowEmptyCcExp:
                    type: boolean
                    description: Whether or not the merchant is allowed to pass empty Credit Card Expiration Dates.
                  pastDue:
                    type: boolean
                    description: Whether or not the merchant's bill is past due.
                  apiReceipt:
                    type: boolean
                    description: Whether or not the merchant's API transactions send receipts.
                  batchReceipt:
                    type: boolean
                    description: Whether or not the merchant can batch receipts.
                  delinquent:
                    type: boolean
                    description: Whether or not the merchant is in a delinquent state.
                  commercialCardIndicator:
                    type: string
                    description: The merchant's commercial card indicator. Returns false if not configured.
                  customDescription:
                    type: string
                    description: The merchant's custom description. Returns false if not configured.
                  apiAllowOnlyUsername:
                    type: boolean
                    description: Whether or not the merchant can authenticate with the APIs using only a username.
                  orderIdDuplicateCheck:
                    type: boolean
                    description: Whether or not the merchant has duplicate checking for the Order ID field.
                  cardLevelResult:
                    type: string
                    description: The merchant's card level result. Returns false if not configured.
                  pmsalem:
                    type: object
                    description: Feature flags specifically related to the pmsalem processor.
                    properties:
                      ignoreAmexCvv:
                        type: boolean
                        description: Whether or not the merchant's pmsalem processor ignores the Amex CVV field.
                      allowNovusVerify:
                        type: boolean
                        description: Whether or not the merchant's pmsalem processor can verify Novus cards schemes.
                      idInMdf11:
                        type: boolean
                        description: Whether or not the merchant's pmsalem processor can pass the ID in MDF11.
                  credorax:
                    type: object
                    description: Feature flags specifically related to the credorax processor.
                    properties:
                      bankNet:
