openapi: 3.2.0
info:
  title: Payments Sign-Up Packages API
  description: Payments Sign-Up API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://api.nmipayments.com/license
servers:
- url: https://sandbox.signup.nmi.com/api/v1
  description: Sandbox
- url: https://secure.nmi.com/api/v5/signup
  description: Production
tags:
- name: Packages
  description: Get all the information required for application submissions
paths:
  /packages:
    get:
      tags:
      - Packages
      security:
      - oauth:
        - packages:read
      summary: List all Packages
      description: 'This operation returns a list of available application packages.


        **Required scope:** `packages:read`'
      operationId: getPackages
      parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: Number of packages per page
        required: false
        schema:
          type: integer
          enum:
          - 10
          - 20
          - 50
          - 100
          default: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/packages-list'
                - $ref: '#/components/schemas/pagination'
              examples:
                success:
                  summary: Success
                  description: The response contains the standard package.
                  value:
                    packages:
                    - id: pkg_merrick_tsys
                      name: Merrick TSYS Application Package
                      description: Merrick TSYS Application Package
                    current_page: 1
                    per_page: 10
                    last_page: 1
                    total: 1
        '422':
          $ref: '#/components/responses/validation-error-page-size'
  /packages/{package}:
    get:
      tags:
      - Packages
      security:
      - oauth:
        - packages:read
      summary: Get Package
      description: 'The **Packages** endpoint provides package rules, a structured set of field details necessary for creating an

        application. It defines the required and optional fields, their formats, and any conditional rules that

        must be followed.


        **Required scope:** `packages:read`'
      operationId: getPackageById
      parameters:
      - name: package
        in: path
        description: Package ID
        required: true
        schema:
          $ref: '#/components/schemas/package-id'
      responses:
        '200':
          description: Successful response with the package information
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - description
                - package_rules
                - fields
                - collections
                properties:
                  id:
                    $ref: '#/components/schemas/package-id'
                  name:
                    $ref: '#/components/schemas/package-name'
                  description:
                    $ref: '#/components/schemas/package-description'
                  package_rules:
                    $ref: '#/components/schemas/package-rules'
                  fields:
                    $ref: '#/components/schemas/package-fields'
                  collections:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/package-collection'
              examples:
                standard-package:
                  $ref: '#/components/examples/standard-package'
        '404':
          $ref: '#/components/responses/error-not-found'
components:
  schemas:
    percent-field:
      type: object
      title: Percent
      summary: Percent field.
      description: This field allows the user to set a percent amount
      required:
      - id
      - name
      - type
      - required
      - default
      - min
      - max
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: The type of the field.
          enum:
          - percent
        default:
          type:
          - string
          - 'null'
          description: The default value for the field.
          maxLength: 9
        min:
          type: integer
          description: The minimum length of the field.
        max:
          type: integer
          description: The maximum length of the field.
    package:
      type: object
      title: Package
      description: Package information
      required:
      - id
      - name
      - description
      properties:
        id:
          $ref: '#/components/schemas/package-id'
        name:
          $ref: '#/components/schemas/package-name'
        description:
          $ref: '#/components/schemas/package-description'
    email-field:
      type: object
      title: String
      summary: Email field.
      description: This field allows the user to set an email.
      required:
      - id
      - name
      - type
      - required
      - default
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: The type of the field.
          enum:
          - email
        default:
          type:
          - string
          - 'null'
          description: The default value for the field.
          maxLength: 1000
        min:
          type: integer
          description: The minimum length of the field.
        max:
          type: integer
          description: The maximum length of the field.
        regex:
          type:
          - string
          - 'null'
          description: The regular expression that the field must match.
    field-id:
      type: string
      description: The unique identifier of the field.
      pattern: ^fld_[a-z0-9_]{3,46}$
      minLength: 7
      maxLength: 50
    routing-number-field:
      type: object
      title: String
      summary: Bank Routing Number field.
      description: This field allows the user to enter USA bank routing number.
      required:
      - id
      - name
      - type
      - required
      - default
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: The type of the field.
          enum:
          - routing_number
        default:
          type:
          - string
          - 'null'
          description: The default value for the field.
          maxLength: 9
          minLength: 9
        min:
          type: integer
          description: The minimum length of the field.
          maxLength: 9
          minLength: 9
        max:
          type: integer
          description: The maximum length of the field.
          maxLength: 9
          minLength: 9
    website-field:
      type: object
      title: String
      summary: Website field.
      description: This field allows the user to set a website URL.
      required:
      - id
      - name
      - type
      - required
      - default
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: The type of the field.
          enum:
          - website
        default:
          type:
          - string
          - 'null'
          description: The default value for the field.
          maxLength: 1000
        min:
          type: integer
          description: The minimum length of the field.
        max:
          type: integer
          description: The maximum length of the field.
        regex:
          type:
          - string
          - 'null'
          description: The regular expression that the field must match.
    decimal-field:
      type: object
      title: Decimal
      summary: Decimal field.
      description: This field allows the user to enter a decimal value.
      required:
      - id
      - name
      - type
      - required
      - default
      - min
      - max
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: The type of the field.
          enum:
          - decimal
        default:
          type:
          - number
          - 'null'
          format: double
          description: The default value for the field if no value is provided.
        min:
          type:
          - number
          - 'null'
          format: double
          description: The minimum value allowed for the field.
        max:
          type:
          - number
          - 'null'
          format: double
          description: The maximum value allowed for the field.
    string-field:
      type: object
      title: String
      summary: String field.
      description: This field allows the user to set a string.
      required:
      - id
      - name
      - type
      - required
      - default
      - min
      - max
      - regex
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: The type of the field.
          enum:
          - string
        default:
          type:
          - string
          - 'null'
          description: The default value for the field.
          maxLength: 1000
        min:
          type: integer
          description: The minimum length of the field.
        max:
          type: integer
          description: The maximum length of the field.
        regex:
          type:
          - string
          - 'null'
          description: The regular expression that the field must match.
    boolean-field:
      type: object
      title: Boolean
      summary: Boolean field.
      description: This field allows the user to provide a boolean value.
      required:
      - id
      - name
      - type
      - required
      - default
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: Type of the field.
          enum:
          - boolean
        default:
          type:
          - boolean
          - 'null'
          description: Default value for the field.
    field-required:
      type: boolean
      description: Whether the field is required.
    integer-field:
      type: object
      title: Integer
      summary: Integer field.
      description: This field allows the user to enter an integer value.
      required:
      - id
      - name
      - type
      - required
      - default
      - min
      - max
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: The type of the field.
          enum:
          - integer
        default:
          type:
          - integer
          - 'null'
          description: The default value for the field if no value is provided.
        min:
          type: integer
          description: The minimum value that can be entered.
        max:
          type: integer
          description: The maximum value that can be entered.
    collection-id:
      type: string
      description: The unique identifier of the collection.
      pattern: ^col_[a-z0-9_]{3,46}$
      minLength: 7
      maxLength: 50
    collection-name:
      type: string
      description: The name of the package collection.
      maxLength: 1000
    postal-code-field:
      type: object
      title: String
      summary: Postal Code field.
      description: This field allows the user to set a postal code field.
      required:
      - id
      - name
      - type
      - required
      - default
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: The type of the field.
          enum:
          - postal_code
        default:
          type:
          - string
          - 'null'
          description: The default value for the field.
          maxLength: 5
    package-rules:
      type: array
      description: The Package Rules
      uniqueItems: true
      minItems: 0
      maxItems: 50
      items:
        type: string
        description: The Package Rule
        maxLength: 1000
    choice-field:
      type: object
      title: Choice
      summary: Single choice field.
      description: This field allows the user to select a single value from a list of options.
      required:
      - id
      - name
      - type
      - required
      - default
      - choices
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: Type of the field.
          enum:
          - choice
        default:
          type:
          - string
          - 'null'
          description: Default value for the field.
          maxLength: 1000
        choices:
          type: array
          description: List of choices.
          maxItems: 1000
          items:
            type: string
            maxLength: 1000
    package-name:
      type: string
      description: The name of the package
      minLength: 1
      maxLength: 1000
      example: Merrick TSYS Application Package
    package-collection:
      type: object
      title: Collection of Fields
      summary: Fields grouped into a Collection
      required:
      - id
      - name
      - description
      - min
      - max
      - fields
      properties:
        id:
          $ref: '#/components/schemas/collection-id'
        name:
          $ref: '#/components/schemas/collection-name'
        description:
          $ref: '#/components/schemas/collection-description'
        min:
          type: integer
          description: The minimum number of records that can be added to the collection.
          minimum: 0
          maximum: 100
        max:
          type: integer
          description: The maximum number of records that can be added to the collection.
          minimum: 0
          maximum: 100
        fields:
          $ref: '#/components/schemas/package-fields'
    phone-field:
      type: object
      title: String
      summary: Phone field.
      description: This field allows the user to set an phone.
      required:
      - id
      - name
      - type
      - required
      - default
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: The type of the field.
          enum:
          - phone
        default:
          type:
          - string
          - 'null'
          description: The default value for the field.
          maxLength: 15
    collection-description:
      type: string
      description: The description of the package collection.
      maxLength: 10000
    multiselect-field:
      type: object
      title: Multi Select
      summary: Multi select field.
      description: This field allows the user to select several values from a list of options.
      required:
      - id
      - name
      - type
      - required
      - default
      - choices
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: Type of the field.
          enum:
          - multiselect
        default:
          type:
          - string
          - 'null'
          description: Default value for the field.
          maxLength: 1000
        min:
          type: integer
          description: Minimum number of choices.
          minimum: 0
          maximum: 1000
        max:
          type: integer
          description: Maximum number of choices.
          minimum: 0
          maximum: 1000
        choices:
          type: array
          description: List of choices.
          maxItems: 1000
          items:
            type: string
            maxLength: 1000
    package-description:
      type: string
      description: The description of the package
      minLength: 1
      maxLength: 1000
      example: This is a standard package
    tax-id-field:
      type: object
      title: String
      summary: Tax ID field.
      description: This field allows the user to set a Tax ID.
      required:
      - id
      - name
      - type
      - required
      - default
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: The type of the field.
          enum:
          - ssn
          - federal_tax_id
        default:
          type:
          - string
          - 'null'
          description: The default value for the field.
          maxLength: 9
          minLength: 9
        min:
          type: integer
          description: The minimum length of the field.
          maxLength: 9
          minLength: 9
        max:
          type: integer
          description: The maximum length of the field.
          maxLength: 9
          minLength: 9
    package-fields:
      type: array
      description: Array of package fields
      maxItems: 1000
      items:
        oneOf:
        - $ref: '#/components/schemas/integer-field'
        - $ref: '#/components/schemas/string-field'
        - $ref: '#/components/schemas/choice-field'
        - $ref: '#/components/schemas/multiselect-field'
        - $ref: '#/components/schemas/boolean-field'
        - $ref: '#/components/schemas/decimal-field'
        - $ref: '#/components/schemas/date-field'
        - $ref: '#/components/schemas/percent-field'
        - $ref: '#/components/schemas/website-field'
        - $ref: '#/components/schemas/account-number-field'
        - $ref: '#/components/schemas/email-field'
        - $ref: '#/components/schemas/phone-field'
        - $ref: '#/components/schemas/routing-number-field'
        - $ref: '#/components/schemas/tax-id-field'
        - $ref: '#/components/schemas/postal-code-field'
        discriminator:
          propertyName: type
          mapping:
            integer: '#/components/schemas/integer-field'
            string: '#/components/schemas/string-field'
            choice: '#/components/schemas/choice-field'
            multiselect: '#/components/schemas/multiselect-field'
            boolean: '#/components/schemas/boolean-field'
            decimal: '#/components/schemas/decimal-field'
            date: '#/components/schemas/date-field'
            percent: '#/components/schemas/percent-field'
            website: '#/components/schemas/website-field'
            account_number: '#/components/schemas/account-number-field'
            email: '#/components/schemas/email-field'
            phone: '#/components/schemas/phone-field'
            routing_number: '#/components/schemas/routing-number-field'
            ssn: '#/components/schemas/tax-id-field'
            federal_tax_id: '#/components/schemas/tax-id-field'
            postal_code: '#/components/schemas/postal-code-field'
    account-number-field:
      type: object
      title: String
      summary: Bank Account Number field.
      description: This field allows the user to set bank account number.
      required:
      - id
      - name
      - type
      - required
      - default
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: The type of the field.
          enum:
          - account_number
        default:
          type:
          - string
          - 'null'
          description: The default value for the field.
          maxLength: 17
        min:
          type: integer
          description: The minimum length of the field.
        max:
          type: integer
          description: The maximum length of the field.
    packages-list:
      type: object
      description: List of application packages
      required:
      - packages
      properties:
        packages:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/package'
    package-id:
      type: string
      description: The unique identifier of the package.
      pattern: ^pkg_[a-z0-9_]{3,16}$
      minLength: 7
      maxLength: 20
      example: pkg_merrick_tsys
    date-field:
      type: object
      title: Date
      summary: Date field.
      description: 'This field allows the user to set a date. Expected format: YYYY-MM-DD'
      required:
      - id
      - name
      - type
      - required
      - default
      properties:
        id:
          $ref: '#/components/schemas/field-id'
        name:
          $ref: '#/components/schemas/field-name'
        required:
          $ref: '#/components/schemas/field-required'
        type:
          type: string
          description: The type of the field.
          enum:
          - date
        default:
          type:
          - string
          - 'null'
          description: The default value for the field.
          minLength: 10
          maxLength: 10
        min:
          type:
          - string
          - 'null'
          format: date
          minLength: 10
          maxLength: 10
          description: The minimum date that can be submitted.
        max:
          type:
          - string
          - 'null'
          format: date
          minLength: 10
          maxLength: 10
          description: The maximum date that can be submitted.
    field-name:
      type: string
      description: Name of the field.
      maxLength: 1000
    pagination:
      type: object
      summary: Pagination information
      required:
      - current_page
      - last_page
      - per_page
      - total
      properties:
        current_page:
          type: integer
          description: The current page number
        last_page:
          type: integer
          description: The last page number
        per_page:
          type: integer
          enum:
          - 10
          - 20
          - 50
          - 100
          description: 'The number of items per page (allowed values: 10, 20, 50, 100)'
        total:
          type: integer
          description: The total number of items
  responses:
    error-not-found:
      description: Error response for resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                description: Error code
                maxLength: 100
              message:
                type: string
                description: Error message
                maxLength: 10000
          examples:
            not-found:
              summary: Resource Not Found
              description: The resource cannot be found
              value:
                code: NOT_FOUND
                message: Resource not found
    validation-error-page-size:
      description: Bad request (validation error) response for invalid page size
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                description: Error code
                maxLength: 1000
              message:
                type: string
                description: Error message
                maxLength: 1000
              errors:
                type: array
                maxItems: 1000
                items:
                  type: string
                  description: The error message
                  maxLength: 1000
          examples:
            standard:
              summary: Invalid Page Size
              description: This response is returned when the page size is invalid
              value:
                code: VALIDATION_ERROR
                message: The selected per page is invalid.
                errors:
                - The selected per page is invalid.
  examples:
    standard-package:
      summary: Success
      description: The Merrick TSYS package configuration.
      value:
        id: pkg_merrick_tsys
        name: Merrick TSYS Application Package
        description: Merrick TSYS Application Package
        package_rules:
        - Field 'fld_qual_rate' is required when 'Flat Rate' pricing type is selected
        - Field 'fld_qual_rate_per_auth' is required when 'Flat Rate' pricing type is selected
        - Field 'fld_cost_plus' is required when 'Cost Plus' pricing type is selected
        - Field 'fld_cost_plus_per_auth' is required when 'Cost Plus' pricing type is selected
        - Field 'fld_business_website' is required when 'fld_percent_of_ecommerce' > 0
        - The total percentage of the 'fld_percent_of_retail', 'fld_percent_key_entered', 'fld_percent_of_ecommerce' and 'fld_percent_of_moto' fields must be 100%
        - B2C Sales is required when 'fld_percent_of_moto' > 25 %
        - B2B Sales is required when 'fld_percent_of_moto' > 25 %
        - Bank or Processing Statements are required when 'fld_average_ticket' ≥ 1000 or 'fld_high_ticket' ≥ 2500
        fields:
        - id: fld_amex_annual_volume
          name: Amex Annual Volume
          type: integer
          required: false
          default: null
          min: 0
          max: 999999999
        - id: fld_average_ticket
          name: Average Ticket
          type: integer
          required: true
          default: null
          min: 1
          max: 9999999999
        - id: fld_individual_with_control_address
          name: Address
          type: string
          required: true
          default: null
          min: 3
          max: 32
          regex: null
        - id: fld_individual_with_control_city
          name: City
          type: string
          required: true
          default: null
          min: 3
          max: 13
          regex: null
        - id: fld_individual_with_control_country
          name: Country
          type: choice
          required: false
          default: US
          choices:
          - US
        - id: fld_individual_with_control_dob
          name: Date of Birth
          type: date
          required: true
          default: null
          min: null
          max: null
        - id: fld_individual_with_control_first_name
          name: First Name
          type: string
          required: true
          default: null
          min: 2
          max: 25
          regex: null
        - id: fld_individual_with_control_last_name
          name: Last Name
          type: string
          required: true
          default: null
          min: 2
          max: 25
          regex: null
        - id: fld_individual_with_control_ownership_percentage
