openapi: 3.2.0
info:
  version: 1.0.0
  title: Payments API
  description: Our payments platform exposes two generations of API.
  x-logo:
    url: https://www.nmi.com/app/themes/nmi/images/NMI_Logo_Primary.webp
servers:
- url: https://sandbox.nmi.com/api
security: []
tags:
- name: Payments
  description: RESTful payment processing endpoints using JSON format
paths:
  /v5/payments/auth:
    post:
      tags:
      - Payments
      operationId: create-auth-v5
      summary: Authorization
      description: Process an authorization for a payment. Use in conjunction with the capture endpoint to prepare the payment for settlement.
      security:
      - merchantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAuthRequest'
            examples:
              withPaymentDetails:
                $ref: '#/components/examples/SaleWithPaymentDetailsExample'
              usingCustomerVault:
                $ref: '#/components/examples/SaleUsingCustomerVaultExample'
              usingCustomerVaultBillingId:
                $ref: '#/components/examples/AuthUsingCustomerVaultBillingIdExample'
              retailIdTechEncryptedSwipe:
                $ref: '#/components/examples/RetailIdTechEncryptedSwipeSaleExample'
              retailUnencryptedSwipe:
                $ref: '#/components/examples/RetailUnencryptedMagneticStripeSaleExample'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
  /v5/payments/credit:
    post:
      tags:
      - Payments
      operationId: create-credit-v5
      summary: Credit
      description: Process a credit without a prior payment. This endpoint credits funds to the customer's payment method.
      security:
      - merchantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreditRequest'
            examples:
              withPaymentDetails:
                $ref: '#/components/examples/SaleWithPaymentDetailsExample'
              usingCustomerVault:
                $ref: '#/components/examples/SaleUsingCustomerVaultExample'
              usingCustomerVaultBillingId:
                $ref: '#/components/examples/SaleUsingCustomerVaultBillingIdExample'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
  /v5/payments/sale:
    post:
      tags:
      - Payments
      operationId: create-sale-v5
      summary: Sale
      description: Process a sale. This request authorizes and captures the payment in a single step.
      security:
      - merchantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentSaleRequest'
            examples:
              withPaymentDetails:
                $ref: '#/components/examples/SaleWithPaymentDetailsExample'
              withPaymentDetailsAddToVault:
                $ref: '#/components/examples/SaleWithPaymentDetailsAddToVaultExample'
              usingCustomerVault:
                $ref: '#/components/examples/SaleUsingCustomerVaultExample'
              usingCustomerVaultBillingId:
                $ref: '#/components/examples/SaleUsingCustomerVaultBillingIdExample'
              retailIdTechEncryptedSwipe:
                $ref: '#/components/examples/RetailIdTechEncryptedSwipeSaleExample'
              retailUnencryptedSwipe:
                $ref: '#/components/examples/RetailUnencryptedMagneticStripeSaleExample'
              retailMagensaEncryptedSwipe:
                $ref: '#/components/examples/RetailMagensaEncryptedSwipeSaleExample'
              retailIngenicoEmvChip:
                $ref: '#/components/examples/RetailIngenicoEmvChipSaleExample'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
  /v5/payments/validate:
    post:
      tags:
      - Payments
      operationId: validate-payment-v5
      summary: Validate
      description: Validate a payment method without processing a payment.
      security:
      - merchantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentValidateRequest'
            examples:
              usingCustomerVault:
                $ref: '#/components/examples/ValidateUsingCustomerVaultExample'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
  /v5/payments/{payment_id}:
    get:
      tags:
      - Payments
      operationId: get-payment-v5
      summary: Get
      description: Retrieve details for a specific payment by payment ID.
      security:
      - merchantApiKey: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
        description: The payment ID to retrieve
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v5/payments/{payment_id}/capture:
    post:
      tags:
      - Payments
      operationId: capture-payment-v5
      summary: Capture
      description: Capture a previously authorized payment.
      security:
      - merchantApiKey: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
        description: The payment ID returned from the authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCaptureRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
  /v5/payments/{payment_id}/refund:
    post:
      tags:
      - Payments
      operationId: refund-payment-v5
      summary: Refund
      description: Refund a payment. Only a previously settled transaction can be refunded back to the customer's payment method.
      security:
      - merchantApiKey: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
        description: The payment ID to refund
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRefundRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
  /v5/payments/{payment_id}/void:
    post:
      tags:
      - Payments
      operationId: void-payment-v5
      summary: Void
      description: Void a payment. Only payments that have not yet been settled can be voided.
      security:
      - merchantApiKey: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
        description: The payment ID to void
      requestBody:
        required: true
        description: When not sending a void_reason, send an empty JSON object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentVoidRequest'
            examples:
              emptyObject:
                summary: Default void (no void reason)
                description: 'Required payload shape when `void_reason` does not apply: an empty JSON object.'
                value: {}
              withVoidReason:
                summary: Void with reason (e.g. EMV)
                description: When a void reason is required, include only `void_reason`.
                value:
                  void_reason: user_cancel
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
components:
  examples:
    RetailIngenicoEmvChipSaleExample:
      summary: Retail sale with Ingenico EMV chip
      description: Card-present EMV chip sale with encrypted track data.
      value:
        amount: 1
        currency: USD
        industry: retail
        payment_details:
          entry_mode: emv_icc
          emv_device: ingenico_rba
          verification_method: offline_pin
          encrypted_track_2: 9A3B00F949A22819A0AC838830CE623C606E5F80D14A2715D97ED2FC62F6A9A327C2408D6D413940
          encrypted_ksn: FFFF98765400002001D9
          emv_auth_request_data: 4F:a000000025010801;50:414d45524943414e2045585052455353;57:374245000001007d2001201000000000000000;82:3c00;84:a000000025010801;95:0080008000;9A:160301;9B:e800;9C:00;5F2A:0840;5F34:00;9F02:000000003000;9F03:000000000000;9F06:a000000025010801;9F09:008c;9F10:06020103a42002;9F1A:0840;9F1B:00000000;9F1E:3831303739333034;9F21:170841;9F26:ddb162d61cdaf956;9F27:80;9F33:e0f8c8;9F34:440302;9F35:22;9F36:0001;9F37:84791e8e;9F39:05;9F40:6000f0a001;9F41:00000517;9F53:52;FF1F:3b3337343234353030303030313030373d3230303132303130303030303030303030303030303f;FF21:46464646393837363534303030303230303144393a323a303034303a3941334230304639343941323238313941304143383338383330434536323343363036453546383044313441323731354439374544324643363246364139413332374332343038443644343133393430;
    RetailUnencryptedMagneticStripeSaleExample:
      summary: Retail sale with unencrypted magnetic stripe
      description: Card-present sale using raw track data.
      value:
        amount: 1
        currency: USD
        industry: retail
        payment_details:
          track_1: '%B4111111111111111^TESTCARD/TEST^221200000000000000000000000?'
          track_2: ;4111111111111111=22120000000000000000?
    SaleUsingCustomerVaultExample:
      summary: Sale using customer vault
      value:
        amount: 10
        currency: USD
        customer_vault:
          id: CUST_123456
    AuthUsingCustomerVaultBillingIdExample:
      summary: Authorization using customer vault with billing_id
      value:
        amount: 15
        currency: USD
        customer_vault:
          id: CUST_123456
          billing_id: BILLING_PRIMARY
    ValidateUsingCustomerVaultExample:
      summary: Validate using customer vault
      value:
        customer_vault:
          id: CUST_123456
          billing_id: BILLING_PRIMARY
    SaleWithPaymentDetailsAddToVaultExample:
      summary: Sale with payment details and add to vault
      description: Charge with inline payment details and store the payment method in the customer vault.
      value:
        amount: 10
        currency: USD
        payment_details:
          card_number: '4111111111111111'
          card_exp: '1230'
          card_cvv: '123'
        customer_vault:
          add_to_vault: true
          id: CUST_123456
    RetailMagensaEncryptedSwipeSaleExample:
      summary: Retail sale with MagTek Magensa encrypted swipe
      description: Card-present sale using MagTek Magensa encrypted track data.
      value:
        amount: 1
        currency: USD
        industry: retail
        payment_details:
          magnesafe_track_1: EB62C5E3904971A24447A0E7D5F8660025D8CDEC966A149F22BB39FC198C3AC63CC3C117090548B300CD2EAAAD5AD9C16BD0EB71C31B02B228C11118EA950F8C
          magnesafe_track_2: 6B960E3C44EE5F598822E5620802F4F55291C941C9D5DBC1B4CC2BC0E9F5A7D6F0DD4FD13B22D11A
          magnesafe_magneprint: 10D60457FB57387EEB561139B04A022D9D4171B158FB176D38389FCD18B5A7D1E2D111C12117BBC0988475B42AEB8953A33112C0C6D1F3E7C
          magnesafe_magneprint_status: '61403000'
          magnesafe_ksn: 9011330B37C55911104D
    SaleUsingCustomerVaultBillingIdExample:
      summary: Sale using customer vault with billing_id
      value:
        amount: 25.5
        currency: USD
        customer_vault:
          id: CUST_123456
          billing_id: BILLING_PRIMARY
          shipping_id: SHIP_HOME
    RetailIdTechEncryptedSwipeSaleExample:
      summary: Retail sale with ID Tech M130 encrypted swipe
      description: Card-present sale using encrypted swipe data from an ID Tech M130 reader.
      value:
        amount: 1
        currency: USD
        industry: retail
        payment_details:
          encrypted_track_1: 02B600C0170018009292;4111********1111=2012?*94CAD63AE3265BE87195E1E8AED5B61740B0D5F687869F1CDE175F44679517680000000000000000000000000000000000000000363138543539333533306299490077000A80001B158303
          encrypted_track_2: 9A3B00F949A22819A0AC838830CE623C606E5F80D14A2715D97ED2FC62F6A9A327C2408D6D413940
          encrypted_ksn: FFFF98765400002001D9
    SaleWithPaymentDetailsExample:
      summary: Sale with payment details
      value:
        amount: 10
        currency: USD
        payment_details:
          card_number: '4111111111111111'
          card_exp: '1230'
          card_cvv: '123'
        billing_address:
          first_name: John
          last_name: Doe
          address1: 123 Main St
          city: Anytown
          state: CA
          zip: '12345'
          country: US
          email: john.doe@example.com
  schemas:
    RetailMagTekMagensaEncryptedSwipe:
      type: object
      title: Retail MagTek Magensa encrypted swipe
      description: Card-present payment using encrypted magnetic stripe data from a MagTek Magensa reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - magnesafe_track_1
      - magnesafe_track_2
      properties:
        magnesafe_track_1:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_track_2:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_magneprint:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_ksn:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_magneprint_status:
          type: string
          description: Raw MagTek Magensa data.
    RetailIngenicoNfc:
      type: object
      title: Retail Ingenico Telium 2 NFC
      description: Card-present NFC payment from an Ingenico Telium 2 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - entry_mode
      - emv_device
      - encrypted_ksn
      - encrypted_track_2
      properties:
        entry_mode:
          type: string
          enum:
          - nfc_msd
          description: The type of transaction data to be processed.
        emv_device:
          type: string
          enum:
          - ingenico_rba
          description: The EMV-capable card reader.
        encrypted_ksn:
          type: string
          description: Raw encrypted data.
        encrypted_track_2:
          type: string
          description: Raw encrypted data.
    ShippingAddressRest:
      type: object
      title: Shipping Address & Information
      description: Shipping address and information
      properties:
        id:
          type: string
          maxLength: 32
          description: Shipping address ID (max 32 characters). Generated if omitted on create.
        first_name:
          type: string
          maxLength: 50
          description: Shipping first name
        last_name:
          type: string
          maxLength: 50
          description: Shipping last name
        company:
          type: string
          maxLength: 100
          description: Shipping company
        address1:
          type: string
          maxLength: 100
          description: Shipping address
        address2:
          type: string
          maxLength: 100
          description: Shipping address, line 2
        city:
          type: string
          maxLength: 50
          description: Shipping city
        state:
          type: string
          maxLength: 50
          description: Shipping state.
        zip:
          type: string
          maxLength: 20
          description: Shipping zip code
        country:
          type: string
          maxLength: 2
          description: 'ISO 3166-1 alpha-2 country code. Example: `US`'
        email:
          type: string
          format: email
          description: Shipping email address
        carrier:
          type: string
          enum:
          - ups
          - fedex
          - dhl
          - usps
          description: Shipping carrier
    LineItem:
      type: object
      title: Line Item
      description: Line item details for order details
      properties:
        product_code:
          type: string
          maxLength: 50
          description: Product code
        description:
          type: string
          maxLength: 255
          description: Line item description
        commodity_code:
          type: string
          maxLength: 50
          description: Commodity code
        unit_of_measure:
          type: string
          maxLength: 50
          description: Unit of measure
        unit_cost:
          type: number
          minimum: 0
          description: Unit cost
        quantity:
          type: integer
          minimum: 0
          maximum: 999999
          description: Quantity
        total_amount:
          type: number
          minimum: 0
          description: Total amount
        tax_amount:
          type: number
          minimum: 0
          description: Tax amount
        tax_rate:
          type: number
          minimum: 0
          description: Tax rate
        discount_amount:
          type: number
          minimum: 0
          description: Discount amount
        discount_rate:
          type: number
          minimum: 0
          description: Discount rate
        tax_type:
          type: string
          maxLength: 50
          description: Tax type
        alternate_tax_id:
          type: string
          maxLength: 50
          description: Alternate tax ID
    PaymentFacilitator:
      type: object
      title: Payment Facilitator
      description: Payment facilitator information for submerchant transactions
      properties:
        id:
          type: string
          maxLength: 50
          description: Payment facilitator ID
        submerchant_id:
          type: string
          maxLength: 255
          description: Submerchant ID
        submerchant_name:
          type: string
          maxLength: 255
          description: Submerchant name
        submerchant_address:
          type: string
          maxLength: 50
          description: Submerchant address
        submerchant_city:
          type: string
          maxLength: 50
          description: Submerchant city
        submerchant_state:
          type: string
          maxLength: 20
          description: Submerchant state
        submerchant_postal:
          type: string
          maxLength: 20
          description: Submerchant postal code
        submerchant_country:
          type: string
          maxLength: 2
          description: Submerchant country
        submerchant_phone:
          type: string
          description: Submerchant phone
        submerchant_email:
          type: string
          format: email
          description: Submerchant email
    RetailIdTechEncryptedKeyed:
      type: object
      title: Retail ID Tech M130 encrypted keyed
      description: Card-present encrypted keyed entry data from an ID Tech M130 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - encrypted_data
      properties:
        encrypted_data:
          type: string
          description: Raw encrypted data.
    ErrorResponse:
      type: object
      title: Error Response
      description: Error response structure matching SecureApiErrorResponseFactory
      properties:
        type:
          type: string
          description: Error type (e.g., 'validationError', 'internalError', 'authenticationError')
        error_code:
          type: string
          description: Error code (e.g., 'E_INTERNAL', 'E_VALIDATION')
        message:
          type: string
          description: Human-readable error message
        ref_id:
          type: string
          nullable: true
          description: Reference ID for the error (transaction ID, etc.)
        details:
          type: array
          nullable: true
          description: Validation error details
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
      required:
      - type
      - error_code
      - message
    RetailIngenicoKeyed:
      type: object
      title: Retail Ingenico Telium 2 keyed
      description: Card-present encrypted keyed entry from an Ingenico Telium 2 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - entry_mode
      - emv_device
      - encrypted_ksn
      - encrypted_track_2
      properties:
        entry_mode:
          type: string
          enum:
          - keyed
          description: The type of transaction data to be processed.
        emv_device:
          type: string
          enum:
          - ingenico_rba
          description: The EMV-capable card reader.
        encrypted_ksn:
          type: string
          description: Raw encrypted data.
        encrypted_track_2:
          type: string
          description: Raw encrypted data.
    PaymentSaleBase:
      title: Payment Sale Base Fields
      type: object
      required:
      - amount
      properties:
        amount:
          type: number
          description: 'Total amount to be charged. Format: `x.xx`'
        surcharge:
          type: number
          minimum: 0
          description: 'Surcharge amount. Format: `x.xx`'
        convenience_fee:
          type: number
          minimum: 0
          description: 'Convenience fee amount. Format: `x.xx`'
        misc_fee:
          type: number
          minimum: 0
          description: 'Miscellaneous fee amount. Format: `x.xx`'
        misc_fee_name:
          type: string
          maxLength: 50
          description: 'Custom miscellaneous fee name. Default: `Miscellaneous Fee`'
        tip:
          type: number
          minimum: 0
          description: 'The final tip amount, included in the payment. Format: `x.xx`'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: 'The ISO 4217 currency code. Example: `USD`'
        processor_id:
          type: string
          maxLength: 50
          description: If using multiple processors, route to the specified processor ID. Omit for default processor or when using a single processor.
        dup_seconds:
          type: integer
          minimum: 0
          maximum: 7862400
          description: Sets the time in seconds for duplicate checking on supported processors. Set to 0 to disable duplicate checking
        transaction_session_id:
          type: string
          minLength: 32
          maxLength: 32
          description: A single use session ID used by Kount to link the payment and Data Collector information together
        customer_receipt:
          type: boolean
          description: If set to true, when the customer is charged, they will be sent a receipt
        pinless_debit_override:
          type: boolean
          description: Set to true if you have Pinless Debit Conversion enabled but want to opt out for this payment
        industry:
          type: string
          enum:
          - retail
          - restaurant
          - ecommerce
          - moto
          - lodging
          description: Industry type for the payment
        signature_image:
          type: string
          description: Base64 encoded signature image
        network_tokenize:
          type: boolean
          description: Enable network tokenization
        partial_payments:
          type: string
          enum:
          - settle_partial
          - payment_in_full
          description: '`settle_partial`: Settles any amount of tender collected at cut off. `payment_in_full`: Required that any split tendered payment is collected in-full before settlement gets initiated'
        partial_payment_id:
          type: string
          maxLength: 50
          description: A numeric identifier which is used when submitting subsequent payments for partial payments
        billing_address:
          $ref: '#/components/schemas/BillingAddressRest'
        shipping_address:
          $ref: '#/components/schemas/ShippingAddressRest'
        order_details:
          $ref: '#/components/schemas/OrderDetailsRest'
        payment_facilitator:
          $ref: '#/components/schemas/PaymentFacilitator'
        payment_descriptor:
          $ref: '#/components/schemas/PaymentDescriptor'
        cardholder_auth:
          $ref: '#/components/schemas/CardholderAuth'
        merchant_defined_fields:
          $ref: '#/components/schemas/MerchantDefinedFields'
        cit_mit:
          $ref: '#/components/schemas/CitMit'
    RetailIdTechEncryptedSwipe:
      type: object
      title: Retail ID Tech M130 encrypted swipe
      description: Card-present encrypted swipe data from an ID Tech M130 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - encrypted_track_1
      - encrypted_track_2
      properties:
        encrypted_track_1:
          type: string
          description: Raw encrypted data.
        encrypted_track_2:
          type: string
          description: Raw encrypted data.
        encrypted_track_3:
          type: string
