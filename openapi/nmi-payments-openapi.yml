            type: string
            description: The encrypted token created when integration directly to the Apple Pay SDK.
          googlepay_payment_data:
            type: string
            description: The encrypted token created when integration directly to the Google Pay SDK.
          currency:
            type: string
            description: Set transaction currency.
          payment:
            type: string
            enum:
            - creditcard
            - check
            description: Set payment type to ACH or credit card.
          shipping_id:
            type: string
            description: Shipping entry id. If none is provided, one will be created or the billing id with priority '1' will be updated.
          source_transaction_id:
            type: string
            description: Specifies a payment gateway transaction id in order to associate payment information with a Customer Vault record.
          acu_enabled:
            type: string
            enum:
            - 'true'
            - 'false'
            description: 'If set to true, credit card will be evaluated and sent based upon Automatic Card Updater settings. If set to false, credit card will not be submitted for updates when Automatic Card Updater runs. Default: ''true'''
