        '200':
          description: Transaction processed successfully
          content:
            application/x-www-form-urlencoded:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                CreditCardSale:
                  $ref: '#/components/examples/CreditCardSaleResponse'
                CreditCardDeclined:
                  $ref: '#/components/examples/CreditCardDeclinedResponse'
                CreditCardAuth:
                  $ref: '#/components/examples/CreditCardAuthResponse'
                CreditCardValidate:
                  $ref: '#/components/examples/CreditCardValidateResponse'
                CreditCardCredit:
                  $ref: '#/components/examples/CreditCardCreditResponse'
                CreditCardOffline:
                  $ref: '#/components/examples/CreditCardOfflineResponse'
                CreditCardRefund:
