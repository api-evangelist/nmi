              CreditCardRefund:
                $ref: '#/components/examples/CreditCardRefund'
              CreditCardVoid:
                $ref: '#/components/examples/CreditCardVoid'
              CreditCardCapture:
                $ref: '#/components/examples/CreditCardCapture'
              CreditCardPartialPaymentExample:
                $ref: '#/components/examples/CreditCardPartialPaymentExample'
              CreditCardPartialPaymentInFullExample:
                $ref: '#/components/examples/CreditCardPartialPaymentInFullExample'
              ACHSale:
                $ref: '#/components/examples/ACHSale'
              ACHRefund:
                $ref: '#/components/examples/ACHRefund'
              ACHVoid:
                $ref: '#/components/examples/ACHVoid'
              CashSale:
