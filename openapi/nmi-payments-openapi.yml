              - $ref: '#/components/schemas/VoidRequest'
              - $ref: '#/components/schemas/RefundRequest'
              - $ref: '#/components/schemas/ACHSaleRequest'
              - $ref: '#/components/schemas/ACHCreditRequest'
              - $ref: '#/components/schemas/CashSaleRequest'
              - $ref: '#/components/schemas/TransactionUpdateRequest'
              - $ref: '#/components/schemas/ACHTransactionUpdateRequest'
            examples:
              CreditCardSale:
                $ref: '#/components/examples/CreditCardSale'
              CreditCardDecline:
                $ref: '#/components/examples/CreditCardDecline'
              CreditCardAuth:
