        - security_key
        properties:
          security_key:
            $ref: '#/components/schemas/SecurityKey'
          customer_vault:
            type: string
            enum:
            - add_customer
            description: Create a secure Customer Vault record.
          customer_vault_id:
            type: string
            description: Specifies a Customer Vault id. If not set, the payment gateway will randomly generate a Customer Vault id.
          billing_id:
            type: string
            description: Billing id to be assigned or updated. If none is provided, one will be created or the billing id with priority '1' will be updated.
          payment_token:
            type: string
            description: The tokenized version of the customer's card or check information, generated by the [Payment Component](../docs/payment-component) (npm packages / [Gateway.js](https://secure.networkmerchants.com/merchants/resources/integration/integration_portal.php#gjs_methodology)) and usable only once. Existing integrations may also supply a token from [Collect.js](https://secure.networkmerchants.com/merchants/resources/integration/integration_portal.php#cjs_methodology).
