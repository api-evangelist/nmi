openapi: 3.2.0
info:
  version: 1.0.0
  title: Payments Processors and Services API
  description: Our payments platform exposes two generations of API.
  x-logo:
    url: https://www.nmi.com/app/themes/nmi/images/NMI_Logo_Primary.webp
servers:
- url: https://sandbox.nmi.com/api
security: []
tags:
- name: Processors and Services
  description: Here you can find information about endpoints that provide general services that are useful across a variety workflows.
paths:
  /v4/card_type:
    post:
      tags:
      - Processors and Services
      operationId: cardType
      security: []
      summary: Card Type Lookup
      description: 'Usage

        This endpoint will return whether the card is a `debit`, `credit`, or `charge` card. A card may return `unknown` if we can''t recognize the card type provided. Or it may return `unavailable` if the service is offline.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTypeLookupRequest'
            examples:
              Debit Card:
                $ref: '#/components/examples/CardTypeLookupDebit'
              Credit Card:
                $ref: '#/components/examples/CardTypeLookupCredit'
              Unknown Card:
                $ref: '#/components/examples/CardTypeLookupUnknown'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTypeLookupResponse'
              examples:
                Debit Card:
                  $ref: '#/components/examples/CardTypeLookupDebitResult'
                Credit Card:
                  $ref: '#/components/examples/CardTypeLookupCreditResult'
                Unknown Card:
                  $ref: '#/components/examples/CardTypeLookupUnknownResult'
                Service Unavailable:
                  $ref: '#/components/examples/CardTypeLookupUnavailableResult'
  /v4/processors:
    post:
      tags:
      - Processors and Services
      operationId: addProcessorService
      security: []
      summary: Add Processor / Value-Added Service
      description: 'Adding the Processor

        This request submits the processor details for a specific merchant.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/AddProcessorRequest'
              - $ref: '#/components/schemas/MakeServiceActiveRequest'
              - $ref: '#/components/schemas/MakeServiceOfferedRequest'
            examples:
              Add Standard Processor:
                $ref: '#/components/examples/AddStandardProcessor'
              Make Vault Service Active:
                $ref: '#/components/examples/MakeVaultServiceActive'
              Make Invoicing Service Offered:
                $ref: '#/components/examples/MakeInvoiceServiceOffered'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddProcessorServiceResponse'
              examples:
                Add Standard Processor:
                  $ref: '#/components/examples/AddProcessorExampleResponse'
                Vault Service Made Active:
                  $ref: '#/components/examples/MakeServiceActiveExampleResponse'
                Invoicing Service Offered:
                  $ref: '#/components/examples/MakeServiceOfferedExampleResponse'
  /v4/processors/reports:
    post:
      tags:
      - Processors and Services
      operationId: getMerchantProcessorsAndValueAddedServicesDetails
      security: []
      summary: Get Merchant Processors and Value Added Services Details
      description: 'Usage

        This request will return all services that are active, offered, or in a free trial state for a merchant, or a list of merchants. This will return every detail you can see in the partner portal, so the responses can be quite lengthy if the merchant has several processors and numerous services available to them.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMerchantProcessorsAndValueAddedServicesDetailsRequest'
            examples:
              Create Standard Merchant:
                $ref: '#/components/examples/GetMerchantProcessorsAndValueAddedServicesDetailsExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMerchantProcessorsAndValueAddedServicesDetailsResponse'
              examples:
                Get Processor Config:
                  $ref: '#/components/examples/GetMerchantProcessorsAndValueAddedServicesDetailsExampleResponse'
  /v4/services/search:
    post:
      tags:
      - Processors and Services
      operationId: checkServices
      security: []
      summary: Get Available Services
      description: 'Usage

        This request will pull down a list of all services that you can offer to merchants. You don’t need to run this every time you board a merchant, but it is useful to occasionally make sure a service is available before trying to add it to a merchant account.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAvailableServicesRequest'
            examples:
              Create Standard Merchant:
                $ref: '#/components/examples/CheckAvailableServices'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                $ref: '#/components/schemas/CheckAvailableServicesResponse'
              examples:
                Check Available Services:
                  $ref: '#/components/examples/CheckAvailableServicesExampleResponse'
  /v4/services/{id}/config:
    get:
      tags:
      - Processors and Services
      operationId: getProcessorConfig
      security: []
      summary: Get Processor Config
      description: 'Usage

        This request gets the config details for the processor you want to board. This is required if you do not know what fields to pass into the Add Processor request.


        You want to include the `id` value from the "Check What Services Are Available" search.'
      parameters:
      - $ref: '#/components/parameters/GetProcessorConfigRequest'
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProcessorConfigResponse'
              examples:
                Get Processor Config:
                  $ref: '#/components/examples/GetProcessorConfigExampleResponse'
