openapi: 3.2.0
info:
  version: 1.0.0
  title: Payments Subscriptions API
  description: Our payments platform exposes two generations of API.
  x-logo:
    url: https://www.nmi.com/app/themes/nmi/images/NMI_Logo_Primary.webp
servers:
- url: https://sandbox.nmi.com/api
security: []
tags:
- name: Subscriptions
  description: Subscription management endpoints
paths:
  /v5/subscriptions:
    post:
      tags:
      - Subscriptions
      operationId: create-subscription-v5
      summary: Create Subscription
      description: Create a new subscription. A subscription can be associated with an existing plan or created as a custom subscription.
      security:
      - merchantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateRequest'
            examples:
              usingCustomerVault:
                $ref: '#/components/examples/SubscriptionUsingCustomerVaultExample'
              usingCustomerVaultBillingId:
                $ref: '#/components/examples/SubscriptionUsingCustomerVaultBillingIdExample'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
    get:
      tags:
      - Subscriptions
      operationId: list-subscriptions-v5
      summary: List Subscriptions
      description: Retrieve a list of all subscriptions.
      security:
      - merchantApiKey: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Cursor for pagination (subscription ID to start after). Omit for first page.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: 'Number of subscriptions to return per page (default: 20, max: 100)'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionResponse'
                  next_cursor:
                    type: integer
                    nullable: true
                    description: Cursor for the next page. Use this value in the cursor parameter for the next request. Null if there are no more results.
                  per_page:
                    type: integer
                    description: Number of subscriptions per page
        '401':
          description: Unauthorized
  /v5/subscriptions/{subscription_id}:
    get:
      tags:
      - Subscriptions
      operationId: get-subscription-v5
      summary: Get Subscription
      description: Retrieve details for a specific subscription.
      security:
      - merchantApiKey: []
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: integer
        description: The subscription ID to retrieve
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '401':
          description: Unauthorized
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Subscriptions
      operationId: update-subscription-v5
      summary: Update Subscription
      description: Update an existing subscription's billing information.
      security:
      - merchantApiKey: []
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: integer
        description: The subscription ID to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Bad Request - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Subscriptions
      operationId: delete-subscription-v5
      summary: Delete Subscription
      description: Delete a subscription. Customer will no longer be charged.
      security:
      - merchantApiKey: []
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: integer
        description: The subscription ID to delete
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    RetailMagTekMagensaEncryptedSwipe:
      type: object
      title: Retail MagTek Magensa encrypted swipe
      description: Card-present payment using encrypted magnetic stripe data from a MagTek Magensa reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - magnesafe_track_1
      - magnesafe_track_2
      properties:
        magnesafe_track_1:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_track_2:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_magneprint:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_ksn:
          type: string
          description: Raw MagTek Magensa data.
        magnesafe_magneprint_status:
          type: string
          description: Raw MagTek Magensa data.
    RetailIngenicoNfc:
      type: object
      title: Retail Ingenico Telium 2 NFC
      description: Card-present NFC payment from an Ingenico Telium 2 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - entry_mode
      - emv_device
      - encrypted_ksn
      - encrypted_track_2
      properties:
        entry_mode:
          type: string
          enum:
          - nfc_msd
          description: The type of transaction data to be processed.
        emv_device:
          type: string
          enum:
          - ingenico_rba
          description: The EMV-capable card reader.
        encrypted_ksn:
          type: string
          description: Raw encrypted data.
        encrypted_track_2:
          type: string
          description: Raw encrypted data.
    ShippingAddressRest:
      type: object
      title: Shipping Address & Information
      description: Shipping address and information
      properties:
        id:
          type: string
          maxLength: 32
          description: Shipping address ID (max 32 characters). Generated if omitted on create.
        first_name:
          type: string
          maxLength: 50
          description: Shipping first name
        last_name:
          type: string
          maxLength: 50
          description: Shipping last name
        company:
          type: string
          maxLength: 100
          description: Shipping company
        address1:
          type: string
          maxLength: 100
          description: Shipping address
        address2:
          type: string
          maxLength: 100
          description: Shipping address, line 2
        city:
          type: string
          maxLength: 50
          description: Shipping city
        state:
          type: string
          maxLength: 50
          description: Shipping state.
        zip:
          type: string
          maxLength: 20
          description: Shipping zip code
        country:
          type: string
          maxLength: 2
          description: 'ISO 3166-1 alpha-2 country code. Example: `US`'
        email:
          type: string
          format: email
          description: Shipping email address
        carrier:
          type: string
          enum:
          - ups
          - fedex
          - dhl
          - usps
          description: Shipping carrier
    LineItem:
      type: object
      title: Line Item
      description: Line item details for order details
      properties:
        product_code:
          type: string
          maxLength: 50
          description: Product code
        description:
          type: string
          maxLength: 255
          description: Line item description
        commodity_code:
          type: string
          maxLength: 50
          description: Commodity code
        unit_of_measure:
          type: string
          maxLength: 50
          description: Unit of measure
        unit_cost:
          type: number
          minimum: 0
          description: Unit cost
        quantity:
          type: integer
          minimum: 0
          maximum: 999999
          description: Quantity
        total_amount:
          type: number
          minimum: 0
          description: Total amount
        tax_amount:
          type: number
          minimum: 0
          description: Tax amount
        tax_rate:
          type: number
          minimum: 0
          description: Tax rate
        discount_amount:
          type: number
          minimum: 0
          description: Discount amount
        discount_rate:
          type: number
          minimum: 0
          description: Discount rate
        tax_type:
          type: string
          maxLength: 50
          description: Tax type
        alternate_tax_id:
          type: string
          maxLength: 50
          description: Alternate tax ID
    RetailIdTechEncryptedKeyed:
      type: object
      title: Retail ID Tech M130 encrypted keyed
      description: Card-present encrypted keyed entry data from an ID Tech M130 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - encrypted_data
      properties:
        encrypted_data:
          type: string
          description: Raw encrypted data.
    PlanCreateRequest:
      type: object
      required:
      - plan_amount
      - plan_payments
      properties:
        plan_amount:
          type: number
          minimum: 0
          description: 'The plan amount to be charged each billing cycle. Format: `x.xx`'
        plan_payments:
          type: integer
          minimum: 0
          maximum: 999
          description: The number of payments before the recurring plan is complete. Use '0' for until canceled
        id:
          type: string
          maxLength: 50
          description: The unique identifier for the plan. Required when creating a plan directly; optional when defining a custom plan inline via a subscription.
        plan_name:
          type: string
          maxLength: 50
          description: The display name of the plan
      oneOf:
      - title: Monthly Plan
        required:
        - month_frequency
        - day_of_month
        properties:
          month_frequency:
            type: integer
            minimum: 1
            maximum: 24
            description: How often, in months, to charge the customer.
          day_of_month:
            type: integer
            minimum: 1
            maximum: 31
            description: The day of the month that the customer will be charged. For months without 29, 30, or 31 days, the charge will be on the last day.
      - title: Daily Plan
        required:
        - day_frequency
        properties:
          day_frequency:
            type: integer
            minimum: 1
            description: How often, in days, to charge the customer.
    ErrorResponse:
      type: object
      title: Error Response
      description: Error response structure matching SecureApiErrorResponseFactory
      properties:
        type:
          type: string
          description: Error type (e.g., 'validationError', 'internalError', 'authenticationError')
        error_code:
          type: string
          description: Error code (e.g., 'E_INTERNAL', 'E_VALIDATION')
        message:
          type: string
          description: Human-readable error message
        ref_id:
          type: string
          nullable: true
          description: Reference ID for the error (transaction ID, etc.)
        details:
          type: array
          nullable: true
          description: Validation error details
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
      required:
      - type
      - error_code
      - message
    RetailIngenicoKeyed:
      type: object
      title: Retail Ingenico Telium 2 keyed
      description: Card-present encrypted keyed entry from an Ingenico Telium 2 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - entry_mode
      - emv_device
      - encrypted_ksn
      - encrypted_track_2
      properties:
        entry_mode:
          type: string
          enum:
          - keyed
          description: The type of transaction data to be processed.
        emv_device:
          type: string
          enum:
          - ingenico_rba
          description: The EMV-capable card reader.
        encrypted_ksn:
          type: string
          description: Raw encrypted data.
        encrypted_track_2:
          type: string
          description: Raw encrypted data.
    RetailIdTechEncryptedSwipe:
      type: object
      title: Retail ID Tech M130 encrypted swipe
      description: Card-present encrypted swipe data from an ID Tech M130 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - encrypted_track_1
      - encrypted_track_2
      properties:
        encrypted_track_1:
          type: string
          description: Raw encrypted data.
        encrypted_track_2:
          type: string
          description: Raw encrypted data.
        encrypted_track_3:
          type: string
          description: Raw encrypted data.
        encrypted_ksn:
          type: string
          description: Raw encrypted data.
    RetailIngenicoChip:
      type: object
      title: Retail Ingenico Telium 2 chip (EMV)
      description: Card-present EMV chip payment from an Ingenico Telium 2 reader. Set `industry` to `retail` on the payment request.
      additionalProperties: false
      required:
      - entry_mode
      - emv_auth_request_data
      - emv_device
      - verification_method
      - encrypted_ksn
      - encrypted_track_2
      properties:
        entry_mode:
          type: string
          enum:
          - emv_icc
          description: The type of transaction data to be processed.
        emv_auth_request_data:
          type: string
          description: EMV data for the transaction as received from the EMV chip card SDK.
        emv_device:
          type: string
          enum:
          - ingenico_rba
          description: The EMV-capable card reader.
        verification_method:
          type: string
          enum:
          - signature
          - offline_pin
          - offline_pin_signature
          - none
          description: Method used to verify the EMV transaction.
        encrypted_ksn:
          type: string
          description: Raw encrypted data.
        encrypted_track_2:
          type: string
          description: Raw encrypted data.
    CustomerVault:
      title: Customer Vault
      description: Either add a payment method to the vault, or use an existing vault record.
      oneOf:
      - $ref: '#/components/schemas/CustomerVaultAdd'
      - $ref: '#/components/schemas/CustomerVaultCharge'
    RetailMobileSdkEncryptedPayment:
      type: object
      title: Mobile SDK encrypted payment
      description: RSA-encrypted card data from the NMI Mobile SDK (iOS/Android). Use in place of raw card number, expiration, and CVV. Set `industry` to `retail` on the payment request when processing as a card-present transaction.
      additionalProperties: false
      required:
      - encrypted_payment
      properties:
        encrypted_payment:
          type: string
          description: Encrypted payment blob returned by the Mobile SDK.
    MerchantDefinedFields:
      type: object
      title: Merchant Defined Fields
      description: Custom fields configured in the merchant control panel under Settings → Merchant Defined Fields (`field_1` through `field_20`).
      properties:
        field_1:
          type: string
          maxLength: 255
          description: Merchant defined field 1
        field_2:
          type: string
          maxLength: 255
          description: Merchant defined field 2
        field_3:
          type: string
          maxLength: 255
          description: Merchant defined field 3
        field_4:
          type: string
          maxLength: 255
          description: Merchant defined field 4
        field_5:
          type: string
          maxLength: 255
          description: Merchant defined field 5
        field_6:
          type: string
          maxLength: 255
          description: Merchant defined field 6
        field_7:
          type: string
          maxLength: 255
          description: Merchant defined field 7
        field_8:
          type: string
          maxLength: 255
          description: Merchant defined field 8
        field_9:
          type: string
          maxLength: 255
          description: Merchant defined field 9
        field_10:
          type: string
          maxLength: 255
          description: Merchant defined field 10
        field_11:
          type: string
          maxLength: 255
          description: Merchant defined field 11
        field_12:
          type: string
          maxLength: 255
          description: Merchant defined field 12
        field_13:
          type: string
          maxLength: 255
          description: Merchant defined field 13
        field_14:
          type: string
          maxLength: 255
          description: Merchant defined field 14
        field_15:
          type: string
          maxLength: 255
          description: Merchant defined field 15
        field_16:
          type: string
          maxLength: 255
          description: Merchant defined field 16
        field_17:
          type: string
          maxLength: 255
          description: Merchant defined field 17
        field_18:
          type: string
          maxLength: 255
          description: Merchant defined field 18
        field_19:
          type: string
          maxLength: 255
          description: Merchant defined field 19
        field_20:
          type: string
          maxLength: 255
          description: Merchant defined field 20
    CustomerVaultCharge:
      type: object
      title: Use existing customer vault
      description: Charge or validate an existing customer vault record. Do not send `payment_details`.
      additionalProperties: false
      required:
      - id
      properties:
        id:
          type: string
          maxLength: 36
          description: Existing customer vault ID (max 36 characters).
        billing_id:
          type: string
          maxLength: 32
          description: Billing profile ID to use. Defaults to the vault priority billing profile if omitted (max 32 characters).
        shipping_id:
          type: string
          maxLength: 32
          description: Shipping profile ID to use. Defaults to the vault priority shipping profile if omitted (max 32 characters).
    SubscriptionUpdateRequest:
      title: Subscription Update Request
      type: object
      properties:
        plan_amount:
          type: number
          minimum: 0
          description: 'The plan amount to be charged each billing cycle. Format: `x.xx`'
        plan_payments:
          type: integer
          minimum: 0
          maximum: 999
          description: The number of payments before the recurring plan is complete. Use '0' for until canceled
        day_frequency:
          type: integer
          minimum: 1
          description: How often, in days, to charge the customer. Cannot be set with 'month_frequency' or 'day_of_month'
        month_frequency:
          type: integer
          minimum: 1
          description: How often, in months, to charge the customer. Cannot be set with 'day_frequency'. Must be set with 'day_of_month'
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          description: The day that the customer will be charged. Cannot be set with 'day_frequency'. Must be set with 'month_frequency'
        paused_subscription:
          type: boolean
          description: If set to true, the subscription will be paused
        start_date:
          type: string
          minLength: 8
          maxLength: 14
          pattern: ^(\d{8}|\d{14})$
          description: 'The date the subscription''s next/first charge occurs. Format: `YYYYMMDD` (optionally `YYYYMMDDHHMMSS`).'
        payment_details:
          $ref: '#/components/schemas/PaymentDetails'
        billing_address:
          $ref: '#/components/schemas/BillingAddressRest'
        shipping_address:
          $ref: '#/components/schemas/ShippingAddressRest'
        order_details:
          $ref: '#/components/schemas/OrderDetailsRest'
        merchant_defined_fields:
          $ref: '#/components/schemas/MerchantDefinedFields'
        customer_vault:
          $ref: '#/components/schemas/CustomerVault'
        cardholder_auth:
          $ref: '#/components/schemas/CardholderAuth'
    SubscriptionCreateRequest:
      title: Subscription Create Request
      description: Create a subscription with a plan and exactly one payment source variant.
      allOf:
      - type: object
        properties:
          paused_subscription:
            type: boolean
            description: If set to true, the subscription will be paused
          billing_address:
            $ref: '#/components/schemas/BillingAddressRest'
          shipping_address:
            $ref: '#/components/schemas/ShippingAddressRest'
          order_details:
            $ref: '#/components/schemas/OrderDetailsRest'
          merchant_defined_fields:
            $ref: '#/components/schemas/MerchantDefinedFields'
          cardholder_auth:
            $ref: '#/components/schemas/CardholderAuth'
          start_date:
            type: string
            minLength: 8
            maxLength: 14
            pattern: ^(\d{8}|\d{14})$
            description: 'The date the subscription''s first charge occurs. Format: `YYYYMMDD` (optionally `YYYYMMDDHHMMSS`). Defaults to the next billing date derived from the plan schedule when omitted.'
      - oneOf:
        - type: object
          title: Subscription using an Existing Plan
          required:
          - plan_id
          description: Subscription associated with an existing plan
          properties:
            plan_id:
              type: string
              description: Plan ID to use for the subscription
        - type: object
          title: Subscription with Custom Plan
          description: Custom subscription with an inline plan defined in `plan_details`
          required:
          - plan_details
          properties:
            plan_details:
              $ref: '#/components/schemas/PlanCreateRequest'
      - oneOf:
        - type: object
          title: Inline payment details
          description: Bill with card, ACH, token, or wallet data. Optionally add the payment method to the customer vault.
          required:
          - payment_details
          properties:
            payment_details:
              $ref: '#/components/schemas/PaymentDetails'
            customer_vault:
              $ref: '#/components/schemas/CustomerVaultAdd'
        - type: object
          title: Existing customer vault
          description: Bill an existing customer vault record. Do not include `payment_details`.
          required:
          - customer_vault
          properties:
            customer_vault:
              $ref: '#/components/schemas/CustomerVaultCharge'
    PaymentDetails:
      title: Payment Details
      description: 'Payment method details. Exactly one variant: raw card data, ACH (check) data, **payment_token**, wallet payloads, or **retail card-present** data from a card reader. Do not combine fields from different variants.'
      oneOf:
      - type: object
        title: Credit card
        description: Non-tokenized credit card data.
        additionalProperties: false
        required:
        - card_number
        - card_exp
        properties:
          card_number:
            type: string
            description: Credit card number
          card_exp:
            type: string
            description: 'Credit card expiration date. Format: `MMYY`'
          card_cvv:
            type: string
            maxLength: 4
            description: The card security code.
      - $ref: '#/components/schemas/RetailUnencryptedMagneticStripe'
      - $ref: '#/components/schemas/RetailMagTekMagensaEncryptedSwipe'
      - $ref: '#/components/schemas/RetailIdTechEncryptedSwipe'
      - $ref: '#/components/schemas/RetailIdTechEncryptedKeyed'
      - $ref: '#/components/schemas/RetailIngenicoChip'
      - $ref: '#/components/schemas/RetailIngenicoSwipe'
      - $ref: '#/components/schemas/RetailIngenicoNfc'
      - $ref: '#/components/schemas/RetailIngenicoKeyed'
      - $ref: '#/components/schemas/RetailMobileSdkEncryptedPayment'
      - type: object
        title: ACH / check
        description: Bank account (ACH) details for this transaction.
        additionalProperties: false
        required:
        - check_name
        - check_aba
        - check_account
        - account_type
        - account_holder_type
        - sec_code
        properties:
          check_name:
            type: string
            maxLength: 50
            description: The name on the customer's ACH account
          check_aba:
            type: number
            description: The customer's bank routing number
          check_account:
            type: number
            description: The customer's bank account number
          account_type:
            type: string
            enum:
            - checking
            - savings
            description: The type of ACH account the customer has
          account_holder_type:
            type: string
            enum:
            - personal
            - business
            description: The type of ACH account the customer has
          sec_code:
            type: string
            enum:
            - PPD
            - WEB
            - TEL
            - CCD
            - POP
            - RCK
            description: The Standard Entry Class code of the ACH transaction
          check_number:
            type: string
            maxLength: 20
            description: Check number
      - type: object
        title: Payment token
        description: Single-use or vault token from [Payment Component](../docs/payment-component) or [Collect.js](https://secure.networkmerchants.com/merchants/resources/integration/integration_portal.php#cjs_methodology) (not Apple Pay / Google Pay).
        additionalProperties: false
        required:
        - payment_token
        properties:
          payment_token:
            type: string
            description: The tokenized version of the customer's card or check information
      - type: object
        title: Apple Pay
        description: Encrypted payment data from the Apple Pay SDK.
        additionalProperties: false
        required:
        - applepay_payment_data
        properties:
          applepay_payment_data:
            type: string
            description: The encrypted token created when integration directly to the Apple Pay SDK
      - type: object
        title: Google Pay
        description: Encrypted payment data from the Google Pay SDK.
        additionalProperties: false
        required:
        - googlepay_payment_data
        properties:
          googlepay_payment_data:
            type: string
            description: The encrypted token created when integration directly to the Google Pay SDK
      - type: object
        title: Decrypted Apple Pay
        description: Merchant-decrypted Apple Pay payment data.
        additionalProperties: false
        required:
        - decrypted_applepay_data
        - card_number
        - card_exp
        properties:
          decrypted_applepay_data:
            type: boolean
            enum:
            - true
            description: Set to `true` when submitting merchant-decrypted Apple Pay data.
          card_number:
            type: string
            description: Credit card number
          card_exp:
            type: string
            description: 'Credit card expiration date. Format: `MMYY`'
      - type: object
        title: Decrypted Google Pay
        description: Merchant-decrypted Google Pay payment data.
        additionalProperties: false
        required:
        - decrypted_googlepay_data
        - card_number
        - card_exp
        properties:
          decrypted_googlepay_data:
            type: boolean
            enum:
            - true
