            Format: `x.xx`'
          x-group-key: Level III - Order
        tax:
          type: number
          description: '**Level II/III - Order Field:** The sales tax, included in the transaction amount, associated with the purchase. Setting tax equal to ''-1'' indicates an order that is exempt from sales tax. Default - `0.00`.


            Format: `x.xx`'
          x-group-key: Level III - Order
        ponumber:
          type: string
          description: '**Level II/III - Order Field:** Purchase order number'
          x-group-key: Level III - Order
        orderid:
          type: string
          description: '**Level III - Order Field:** Identifier assigned by the merchant. This defaults to gateway transaction id.'
          x-group-key: Level III - Order
        shipping_country:
          type: string
          description: "**Level III - Order Field:** Shipping country (e.g. US).\n \nFormat: `CC` - ISO 3166-1 alpha-2"
          x-group-key: Level III - Order
        shipping_postal:
          type: string
          description: '**Level III - Order Field:** Postal/ZIP code of the address where purchased goods will be delivered. This field can be identical to the ''ship_from_postal'' if the customer is present and takes immediate possession of the goods.'
          x-group-key: Level III - Order
        ship_from_postal:
          type: string
          description: '**Level III - Order Field:** Postal/ZIP code of the address from where purchased goods are being shipped, defaults to merchant profile postal code.'
          x-group-key: Level III - Order
        summary_commodity_code:
          type: string
          description: '**Level III - Order Field:** 4 character international description code of the overall goods or services being supplied. The acquirer or processor will provide a list of current codes.'
          x-group-key: Level III - Order
        duty_amount:
          type: number
          description: '**Level III - Order Field:** Amount included in the transaction amount associated with the import of purchased goods. Default - `0.00`.


            Format: `x.xx`'
          x-group-key: Level III - Order
        discount_amount:
          type: number
          description: '**Level III - Order Field:** Amount included in the transaction amount of any discount applied to complete order by the merchant. Default - `0.00`.


            Format: `x.xx`'
          x-group-key: Level III - Order
        national_tax_amount:
          type: number
          description: '**Level III - Order Field:** The national tax amount included in the transaction amount. Default - `0.00`.


            Format: `x.xx`'
          x-group-key: Level III - Order
        alternate_tax_amount:
          type: number
          description: '**Level III - Order Field:** Second tax amount included in the transaction amount in countries where more than one type of tax can be applied to the purchases. Default - `0.00`.


            Format: `x.xx`'
          x-group-key: Level III - Order
        alternate_tax_id:
          type: string
          description: '**Level III - Order Field:** Tax identification number of the merchant that reported the alternate tax amount.'
          x-group-key: Level III - Order
        vat_tax_amount:
          type: number
          description: '**Level III - Order Field:** Contains the amount of any value added taxes which can be associated with the purchased item. Default - `0.00`.


            Format: `x.xx`'
          x-group-key: Level III - Order
        vat_tax_rate:
          type: number
          description: '**Level III - Order Field:** Contains the tax rate used to calculate the sales tax amount appearing. Can contain up to 2 decimal places, e.g. 1% = 1.00. Default - `0.00`.


            Format: `x.xx`'
          x-group-key: Level III - Order
        vat_invoice_reference_number:
          type: string
          description: '**Level III - Order Field:** Invoice number that is associated with the VAT invoice.'
          x-group-key: Level III - Order
        customer_vat_registration:
          type: string
          description: '**Level III - Order Field:** Value added tax registration number supplied by the cardholder.'
          x-group-key: Level III - Order
        merchant_vat_registration:
          type: string
          description: '**Level III - Order Field:** Government assigned tax identification number of the merchant for whom the goods or services were purchased from.'
          x-group-key: Level III - Order
        order_date:
          type: string
          format: date
          description: '**Level III - Order Field:** Purchase order date, defaults to the date of the transaction.


            Format: `YYMMDD`'
          x-group-key: Level III - Order
