  title: Nmi Transactions API
  version: 1.0.0
  x-logo:
    url: https://www.nmi.com/app/themes/nmi/images/NMI_Logo_Primary.webp
  description: 'Operations tagged Transactions across 2 of this provider''s published API definitions: nmi-payments-openapi.yml, nmi-payments-api-openapi.yml. Each path carries the servers of the definition it was published in.'
