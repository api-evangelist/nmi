openapi: 3.2.0
info:
  version: 1.0.0
  title: Payments Users API
  description: Our payments platform exposes two generations of API.
  x-logo:
    url: https://www.nmi.com/app/themes/nmi/images/NMI_Logo_Primary.webp
servers:
- url: https://sandbox.nmi.com/api
security: []
tags:
- name: Users
paths:
  /v4/usernames/search:
    post:
      tags:
      - Users
      operationId: checkUsernameAvailability
      security: []
      summary: Username Availability
      description: 'Usage

        This is optional, but you can check to make sure a username is available before submitting your merchant creation request.


        This can be useful if you want to do form validation on your website to prevent the user from entering a username that has already been taken.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckUsernameAvailabilityRequest'
            examples:
              Create Standard Merchant:
                $ref: '#/components/examples/CheckUsernameAvailabilityExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckUsernameAvailabilityResponse'
              examples:
                Get Processor Config:
                  $ref: '#/components/examples/CheckUsernameAvailabilityExampleResponse'
  /v4/users/search:
    post:
      tags:
      - Users
      operationId: getMerchantOrPartnerUserInfo
      security: []
      summary: Get Merchant or Partner User Info
      description: 'Usage

        This will return information on all users associated with a specific merchant or sub-affiliate account.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMerchantOrPartnerUserInfoRequest'
            examples:
              Create Standard Merchant:
                $ref: '#/components/examples/GetMerchantOrPartnerUserInfoExampleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMerchantOrPartnerUserInfoResponse'
              examples:
                Get Processor Config:
                  $ref: '#/components/examples/GetMerchantOrPartnerUserInfoExampleResponse'
components:
  schemas:
    GetMerchantOrPartnerUserInfoRequest:
      title: Get Merchant or Partner User Info.
      allOf:
      - type: object
        required:
        - maxResults
        properties:
          maxResults:
            type: string
            description: Number of max results, any integer number from 1 to 1000.
          merchantId:
            type: string
            description: Merchant ID.
          affiliateId:
            type: string
            description: Affiliate ID. To get user information for a sub-affiliate account, pass in `affiliateId` instead of `merchantId`.
    GetMerchantOrPartnerUserInfoResponse:
      type: array
      title: Response
      items:
        type: object
        properties:
          id:
            type: string
            description: ID of merchant or partner.
          created:
            type: string
            format: date-time
            description: Timestamp when the merchant/partner was created.
          updated:
            type: string
            format: date-time
            description: Timestamp when the merchant/partner was last updated.
          firstName:
            type: string
            description: First name of the merchant/partner.
          lastName:
            type: string
            description: Last name of the merchant/partner.
          title:
            type: string
            description: Title of the merchant/partner.
          email:
            type: string
            description: Email address of the merchant/partner.
          username:
            type: string
            description: Username of the merchant/partner.
          isTwoFactorEnabled:
            type: boolean
            description: Indicates if two-factor authentication is enabled for the merchant/partner.
          permissions:
            type: object
            description: Permissions assigned to the merchant/partner.
            title: Permissions
            properties:
              merchants:
                type: boolean
                description: Permission to manage merchants.
              resellers:
                type: boolean
                description: Permission to manage resellers.
              transactions:
                type: boolean
                description: Permission to manage transactions.
              billing:
                type: boolean
                description: Permission to manage billing.
              commission:
                type: boolean
                description: Permission to manage commissions.
              options:
                type: boolean
                description: Permission to manage options.
              fees:
                type: boolean
                description: Permission to manage fees.
              sublogin:
                type: boolean
                description: Permission to manage sublogins.
              twoFactorLogin:
                type: boolean
                description: Permission to manage two-factor login settings.
              googleAuthenticatorLogin:
                type: boolean
                description: Permission to manage Google Authenticator login settings.
              viewReleaseNotes:
                type: boolean
                description: Permission to view release notes.
              webhookConfig:
                type: boolean
                description: Permission to configure webhooks.
              orderDevices:
                type: boolean
                description: Permission to order devices.
              orderDeviceHistory:
                type: boolean
                description: Permission to view order device history.
              useCustomerVault:
                type: boolean
                description: Permission to use the customer vault.
          notifications:
            type: object
            description: Notifications for the merchant/partner.
            title: Notifications
            properties:
              releaseNotesEmails:
                type: boolean
                description: Indicates if the user receives release notes emails.
              acuEmails:
                type: boolean
                description: Indicates if the user receives Automatic Card Updater emails.
          viewVersion:
            type: integer
            description: Version of the view.
          mainUser:
            type: boolean
            description: Indicates if the merchant/partner is the main user.
          hasUsedCredentialsForApiLogin:
            type: boolean
            description: Indicates if the merchant/partner has used credentials for API login.
          parent:
            type: object
            description: Parent entity information.
            title: Parent
            properties:
              type:
                type: string
                description: Type of the parent entity.
              id:
                type: string
                description: ID of the parent entity.
          gatewayTitle:
            type: string
            description: Title of the gateway.
    CheckUsernameAvailabilityRequest:
      title: Check Username Availability
      allOf:
      - type: object
        required:
        - username
        - type
        properties:
          username:
            type: string
            description: String representing the username to check.
          type:
            type: string
            description: String representing the type of account to check the username availability.
    CheckUsernameAvailabilityResponse:
      type: object
      title: Check Username Availability Response
      properties:
        username:
          type: string
          description: String representing the username to check.
        available:
          type: boolean
          description: Boolean representing if the username is available.
  examples:
    GetMerchantOrPartnerUserInfoExampleRequest:
      summary: Get Merchant or Partner User Info
      description: This will return information on all users associated with a specific merchant or sub-affiliate account.
      value:
        maxResults: 100
        merchantId: '1099191'
    CheckUsernameAvailabilityExampleRequest:
      summary: Check Username Availability
      description: Checks if the username is available before creating a merchant.
      value:
        username: testuser
        type: merchant
    GetMerchantOrPartnerUserInfoExampleResponse:
      summary: Get Merchant or Partner User Info
      description: Get Merchant or Partner User Info
      value:
      - id: '234'
        created: '2018-03-09T16:03:13+00:00'
        updated: '2018-03-09T16:04:01+00:00'
        firstName: John
        lastName: Smith
        title: ''
        email: someone@example.com
        username: myusernamehere
        isTwoFactorEnabled: false
        permissions:
          useCustomerVault: true
        notifications: []
        viewVersion: 2
        mainUser: true
        hasUsedCredentialsForApiLogin: false
        parent:
          type: merchant
          id: '33'
        gatewayTitle: Payment Gateway
      - id: '756'
        created: '2007-03-23T16:13:49+00:00'
        updated: '2023-02-03T14:51:36+00:00'
        firstName: Holly
        lastName: Golightly
        title: ''
        email: someoneelse@example.com
        username: test123
        isTwoFactorEnabled: false
        permissions:
          useCustomerVault: true
        notifications: []
        viewVersion: 2
        mainUser: false
        hasUsedCredentialsForApiLogin: true
        parent:
          type: merchant
          id: '33'
        gatewayTitle: Payment Gateway
    CheckUsernameAvailabilityExampleResponse:
      summary: Check Username Availability
      description: If `available` returns as `false` then that username is already taken and you must try something else.
      value:
        username: testuser
        available: true
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Your v4 API key that was generated in the Partner portal.
    ContentType:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
      description: The Content-Type representation header is used to indicate the original media type of the resource (prior to any content encoding applied for sending).
      example: application/json
  securitySchemes:
    merchantApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Merchant API key for RESTful API authentication. This key is used for merchant-specific API access and can be generated from the merchant portal.
