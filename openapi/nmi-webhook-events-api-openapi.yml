openapi: 3.2.0
info:
  title: Nmi Webhook Events API
  version: 1.0.0
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  description: 'Operations tagged Webhook Events across 2 of this provider''s published API definitions: nmi-payments-api-openapi.yml, nmi-payments-sign-up-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sandbox.nmi.com/api
- url: https://sandbox.signup.nmi.com/api/v1
  description: Sandbox
- url: https://secure.nmi.com/api/v5/signup
  description: Production
tags:
- name: Webhook Events
  description: Here you can find information about webhook events
paths: {}
webhooks:
  transaction:
    post:
      tags:
      - Webhook Events
      security: []
      summary: Transaction Event
      description: Sales, auths, captures, voids, refunds, and credits. Each transaction type can be filtered by successful, failed, and unknown transactions.
      operationId: transactionEvent
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        description: Event about a transaction
        content:
          application/json:
            schema:
              type: object
              required:
              - event_id
              - event_type
              - event_body
              properties:
                event_id:
                  type: string
                  description: Event ID
                event_type:
                  type: string
                  enum:
                  - transaction.sale.success
                  - transaction.sale.failure
                  - transaction.sale.unknown
                  - transaction.auth.success
                  - transaction.auth.failure
                  - transaction.auth.unknown
                  - transaction.capture.success
                  - transaction.capture.failure
                  - transaction.capture.unknown
                  - transaction.void.success
                  - transaction.void.failure
                  - transaction.void.unknown
                  - transaction.refund.success
                  - transaction.refund.failure
                  - transaction.refund.unknown
                  - transaction.credit.success
                  - transaction.credit.failure
                  - transaction.credit.unknown
                  - transaction.validate.success
                  - transaction.validate.failure
                  - transaction.validate.unknown
                  description: Transaction Event Type
                event_body:
                  type: object
                  title: Event Body
                  description: Transaction Details
                  properties:
                    merchant:
                      $ref: '#/components/schemas/Merchant'
                    features:
                      $ref: '#/components/schemas/Features'
                    transaction_id:
                      type: string
                      description: Transaction ID
                    transaction_type:
                      type: string
                      enum:
                      - cc
                      - ck
                      - cs
                      description: Transaction Type (cc - credit card, ck - check, cs - cash sale)
                    condition:
                      type: string
                      enum:
                      - pending
                      - pendingsettlement
                      - in_progress
                      - abandoned
                      - failed
                      - canceled
                      - complete
                      - unknown
                      description: Transaction condition
                    processor_id:
                      type: string
                      description: Processor ID
                    ponumber:
                      type: string
                      description: Purchase order number
                    order_description:
                      type: string
                      description: Order description
                    order_id:
                      type: string
                      description: Order ID
                    customerid:
                      type: string
                      description: Customer ID
                    customertaxid:
                      type: string
                      description: Customer tax ID
                    website:
                      type: string
                      description: Website URL
                    shipping:
                      type: string
                      description: Shipping amount
                    currency:
                      type: string
                      description: Currency code
                    tax:
                      type: string
                      description: Tax amount
                    surcharge:
                      type: string
                      description: Surcharge amount.
                    convenience_fee:
                      type: string
                      description: Convenience Fee amount.
                    misc_fee:
                      type: string
                      description: Miscellaneous Fee amount.
                    misc_fee_name:
                      type: string
                      description: Miscellaneous Fee Name.
                    cash_discount:
                      type: string
                      description: 'How much less a customer paid due to a cash discount. Format: x.xx, only applicable to cash and check transactions'
                    tip:
                      type: string
                      description: The final tip amount, included in the transaction, associated with the purchase
                    requested_amount:
                      type: string
                      format: decimal
                      description: Requested amount
                    shipping_carrier:
                      type: string
                      enum:
                      - ups
                      - fedex
                      - dhl
                      - usps
                      - ''
                      description: Shipping carrier.
                    tracking_number:
                      type: string
                      description: Shipping tracking number.
                    shipping_date:
                      type: string
                      description: Shipping date.
                    partial_payment_id:
                      type: string
                      description: A numeric identifier which is used when submitting subsequent transactions.
                    partial_payment_balance:
                      type: string
                      description: The payment's remaining balance.
                    platform_id:
                      type: string
                      description: Platform ID associated with the transaction.
                    authorization_code:
                      type: string
                      description: Transaction authorization code.
                    social_security_number:
                      type: string
                      description: Customer's social security number.
                    drivers_license_number:
                      type: string
                      description: Driver's license number.
                    drivers_license_state:
                      type: string
                      description: The state that issued the customer's driver's license.
                    drivers_license_dob:
                      type: string
                      description: Driver's license date of birth.
                    duty_amount:
                      type: string
                      description: Duty amount.
                    discount_amount:
                      type: string
                      description: Discount amount.
                    national_tax_amount:
                      type: string
                      description: National tax amount.
                    summary_commodity_code:
                      type: string
                      description: Summary commodity code.
                    alternate_tax_amount:
                      type: string
                      format: decimal
                      description: Alternate tax amount.
                    vat_tax_amount:
                      type: string
                      format: decimal
                      description: VAT tax amount.
                    vat_tax_rate:
                      type: string
                      format: decimal
                      description: VAT tax rate.
                    billing_address:
                      $ref: '#/components/schemas/BillingAddress'
                    shipping_address:
                      $ref: '#/components/schemas/ShippingAddress'
                    card:
                      $ref: '#/components/schemas/CardDetails'
                    check:
                      $ref: '#/components/schemas/CheckDetails'
                    emv_meta_data:
                      $ref: '#/components/schemas/EmvMetaData'
                    action:
                      $ref: '#/components/schemas/TransactionAction'
                    merchant_defined_fields:
                      type: object
                      description: Merchant defined fields
                      additionalProperties:
                        type: string
            examples:
              AuthSuccess:
                $ref: '#/components/examples/auth-success'
              AuthFailed:
                $ref: '#/components/examples/auth-failed'
              CaptureSuccess:
                $ref: '#/components/examples/capture-success'
              SaleSuccess:
                $ref: '#/components/examples/sale-success'
              SaleFailure:
                $ref: '#/components/examples/sale-failure'
              VoidSuccess:
                $ref: '#/components/examples/void-success'
              RefundSuccess:
                $ref: '#/components/examples/refund-success'
              ValidateSuccess:
                $ref: '#/components/examples/validate-success'
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
    servers:
    - url: https://sandbox.nmi.com/api
  recurring:
    post:
      tags:
      - Webhook Events
      security: []
      summary: Recurring Event
      description: Events related to Recurring transactions (plans, subscriptions).
      operationId: recurringEvent
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        description: Recurring Event
        content:
          application/json:
            schema:
              type: object
              required:
              - event_id
              - event_type
              - event_body
              properties:
                event_id:
                  type: string
                  description: Event ID
                event_type:
                  type: string
                  enum:
                  - recurring.plan.add
                  - recurring.plan.update
                  - recurring.plan.delete
                  - recurring.subscription.add
                  - recurring.subscription.update
                  - recurring.subscription.delete
                  description: Recurring Event Type
                event_body:
                  $ref: '#/components/schemas/RecurringEventBody'
            examples:
              PlanAdded:
                $ref: '#/components/examples/plan-added'
              PlanUpdated:
                $ref: '#/components/examples/plan-updated'
              PlanDeleted:
                $ref: '#/components/examples/plan-deleted'
              SubscriptionAdded:
                $ref: '#/components/examples/subscription-added'
              SubscriptionUpdated:
                $ref: '#/components/examples/subscription-updated'
              SubscriptionDeleted:
                $ref: '#/components/examples/subscription-deleted'
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
    servers:
    - url: https://sandbox.nmi.com/api
  settlement:
    post:
      tags:
      - Webhook Events
      security: []
      summary: Settlement Event
      description: Events related to Settlement.
      operationId: settlementEvent
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        description: Settlement Event
        content:
          application/json:
            schema:
              type: object
              required:
              - event_id
              - event_type
              - event_body
              properties:
                event_id:
                  type: string
                  description: Event ID
                event_type:
                  type: string
                  enum:
                  - settlement.batch.complete
                  - settlement.batch.failure
                  description: Settlement Event Type
                event_body:
                  $ref: '#/components/schemas/SettlementEventBody'
            examples:
              SettlementCompleted:
                $ref: '#/components/examples/settlement-completed'
              SettlementFailed:
                $ref: '#/components/examples/settlement-failed'
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
    servers:
    - url: https://sandbox.nmi.com/api
  acu:
    post:
      tags:
      - Webhook Events
      security: []
      summary: Automatic Card Updater Event
      description: Events related to Automatic Card Updater.
      operationId: acuEvent
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        description: Automatic Card Updater (ACU) Event
        content:
          application/json:
            schema:
              type: object
              required:
              - event_id
              - event_type
              - event_body
              properties:
                event_id:
                  type: string
                  description: Event ID
                event_type:
                  type: string
                  enum:
                  - acu.summary.automaticallyupdated
                  - acu.summary.contactcustomer
                  - acu.summary.closedaccount
                  description: Automatic Card Updater (ACU) Event Type
                event_body:
                  oneOf:
                  - $ref: '#/components/schemas/AcuAutoUpdatedEventBody'
                  - $ref: '#/components/schemas/AcuClosedAccountEventBody'
                  - $ref: '#/components/schemas/AcuContactCustomerEventBody'
            examples:
              AcuAutomaticallyUpdated:
                $ref: '#/components/examples/acu.summary.automaticallyupdated'
              AcuClosedAccount:
                $ref: '#/components/examples/acu.summary.closedaccount'
              AcuContactCustomer:
                $ref: '#/components/examples/acu.summary.contactcustomer'
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
    servers:
    - url: https://sandbox.nmi.com/api
  chargeback:
    post:
      tags:
      - Webhook Events
      security: []
      summary: Chargeback Event
      description: Events related to Chargebacks.
      operationId: chargebackEvent
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        description: Chargeback Event
        content:
          application/json:
            schema:
              type: object
              required:
              - event_id
              - event_type
              - event_body
              properties:
                event_id:
                  type: string
                  description: Chargeback Event ID
                event_type:
                  type: string
                  enum:
                  - chargeback.batch.complete
                  description: Chargeback Event Type
                event_body:
                  type: object
                  required:
                  - merchant
                  - processor
                  - count
                  - chargeback_amount
                  - chargebacks
                  description: Chargeback Event Body
                  properties:
                    merchant:
                      $ref: '#/components/schemas/Merchant'
                    processor:
                      type: object
                      title: Processor
                      description: Processor information
                      required:
                      - id
                      - name
                      - type
                      properties:
                        id:
                          type: string
                          description: Processor ID
                        name:
                          type: string
                          description: Processor Name
                        type:
                          type: string
                          description: Processor Type
                    count:
                      type: integer
                      description: Number of chargebacks
                    chargeback_amount:
                      type: string
                      description: Total chargebacks amount
                    chargebacks:
                      type: array
                      title: Chargebacks
                      description: List of chargebacks
                      items:
                        type: object
                        required:
                        - id
                        - date
                        - customer_name
                        - cc_number
                        - amount
                        - reason
                        properties:
                          id:
                            type: string
                            description: Chargeback ID
                          date:
                            type: string
                            description: Chargeback Date
                          customer_name:
                            type: string
                            description: Customer Name
                          cc_number:
                            type: string
                            description: Masked Credit Card Number
                          amount:
                            type: string
                            description: Chargeback Amount
                          reason:
                            type: string
                            description: Chargeback Reason
            examples:
              ChargebackBatchCompleted:
                $ref: '#/components/examples/chargeback.batch.complete'
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
    servers:
    - url: https://sandbox.nmi.com/api
  application.updated.data.requested:
    post:
      tags:
      - Webhook Events
      summary: Underwriter Requested Information
      description: This event is triggered when additional information is requested during underwriting process.
      operationId: sendApplicationUpdatedDataRequestedEvent
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  maxLength: 36
                  example: 38cf9efa-8aec-4a4e-98e2-6bb2411fdc60
                event_type:
                  allOf:
                  - $ref: '#/components/schemas/event-types'
                  - example: application.updated.data.requested
                event_body:
                  type: object
                  required:
                  - app_id
                  - dba
                  - pending_reason
                  properties:
                    app_id:
                      type: string
                      minLength: 20
                      maxLength: 20
                      example: app_341c7b5b432a3158
                    dba:
                      type: string
                      maxLength: 255
                      example: Network Merchant Inc
                    pending_reason:
                      type: string
                      maxLength: 255
                      example: Credit
                    partner_identifier:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Optional partner-supplied identifier captured on the originating public sign-up form, echoed back so partners can correlate this event with their submission. Null when no identifier was captured for the lead.
                      example: partner-ref-12345
            examples:
              eventExample:
                summary: Application Pended
                description: This is an example of a webhook payload when the underwriter requests additional information during the underwriting process.
                value:
                  event_id: 38cf9efa-8aec-4a4e-98e2-6bb2411fdc60
                  event_type: application.updated.data.requested
                  event_body:
                    app_id: app_341c7b5b432a3158
                    dba: Network Merchant Inc
                    pending_reason: Credit
                    partner_identifier: partner-ref-12345
    servers:
    - url: https://sandbox.signup.nmi.com/api/v1
      description: Sandbox
    - url: https://secure.nmi.com/api/v5/signup
      description: Production
  application.approved:
    post:
      tags:
      - Webhook Events
      summary: Application is approved
      description: Sent when the merchant application is approved.
      operationId: sendApplicationApprovedEvent
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  maxLength: 36
                  example: 38cf9efa-8aec-4a4e-98e2-6bb2411fdc60
                event_type:
                  allOf:
                  - $ref: '#/components/schemas/event-types'
                  - example: application.approved
                event_body:
                  type: object
                  required:
                  - app_id
                  - dba
                  properties:
                    app_id:
                      type: string
                      minLength: 20
                      maxLength: 20
                      example: app_341c7b5b432a3158
                    dba:
                      type: string
                      maxLength: 255
                      example: Network Merchant Inc
                    partner_identifier:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Optional partner-supplied identifier captured on the originating public sign-up form, echoed back so partners can correlate this event with their submission. Null when no identifier was captured for the lead.
                      example: partner-ref-12345
            examples:
              eventExample:
                summary: Application Approved
                description: This is an example of a webhook payload when the application is approved by the underwriter.
                value:
                  event_id: 38cf9efa-8aec-4a4e-98e2-6bb2411fdc60
                  event_type: application.approved
                  event_body:
                    app_id: app_341c7b5b432a3158
                    dba: Network Merchant Inc
                    partner_identifier: partner-ref-12345
    servers:
    - url: https://sandbox.signup.nmi.com/api/v1
      description: Sandbox
    - url: https://secure.nmi.com/api/v5/signup
      description: Production
  application.declined:
    post:
      tags:
      - Webhook Events
      summary: Application is declined
      description: This event is triggered when the merchant application is declined.
      operationId: sendApplicationDeclinedEvent
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  maxLength: 36
                  example: 38cf9efa-8aec-4a4e-98e2-6bb2411fdc60
                event_type:
                  allOf:
                  - $ref: '#/components/schemas/event-types'
                  - example: application.declined
                event_body:
                  type: object
                  required:
                  - app_id
                  - dba
                  - reject_reason
                  properties:
                    app_id:
                      type: string
                      minLength: 20
                      maxLength: 20
                      example: app_341c7b5b432a3158
                    dba:
                      type: string
                      maxLength: 255
                      example: Network Merchant Inc
                    reject_reason:
                      type: string
                      maxLength: 255
                      example: Security Issue
                    partner_identifier:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Optional partner-supplied identifier captured on the originating public sign-up form, echoed back so partners can correlate this event with their submission. Null when no identifier was captured for the lead.
                      example: partner-ref-12345
            examples:
              eventExample:
                summary: Application Declined
                description: This is an example of a webhook payload when the application is declined due to reasons such as credit score.
                value:
                  event_id: 38cf9efa-8aec-4a4e-98e2-6bb2411fdc60
                  event_type: application.declined
                  event_body:
                    app_id: app_341c7b5b432a3158
                    dba: Network Merchant Inc
                    reject_reason: Security Issue
                    partner_identifier: partner-ref-12345
    servers:
    - url: https://sandbox.signup.nmi.com/api/v1
      description: Sandbox
    - url: https://secure.nmi.com/api/v5/signup
      description: Production
  application.cancelled:
    post:
      tags:
      - Webhook Events
      summary: Application is cancelled
      description: This event is triggered when the merchant application is cancelled.
      operationId: sendApplicationCancelledEvent
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  maxLength: 36
                  example: 38cf9efa-8aec-4a4e-98e2-6bb2411fdc60
                event_type:
                  allOf:
                  - $ref: '#/components/schemas/event-types'
                  - example: application.cancelled
                event_body:
                  type: object
                  required:
                  - app_id
                  - dba
                  - reject_reason
                  properties:
                    app_id:
                      type: string
                      minLength: 20
                      maxLength: 20
                      example: app_341c7b5b432a3158
                    dba:
                      type: string
                      maxLength: 255
                      example: Network Merchant Inc
                    reject_reason:
                      type: string
                      maxLength: 255
                    partner_identifier:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Optional partner-supplied identifier captured on the originating public sign-up form, echoed back so partners can correlate this event with their submission. Null when no identifier was captured for the lead.
                      example: partner-ref-12345
            examples:
              eventExample:
                summary: Application Cancelled
                description: The application has been cancelled or withdrawn.
                value:
                  event_id: 38cf9efa-8aec-4a4e-98e2-6bb2411fdc60
                  event_type: application.cancelled
                  event_body:
                    app_id: app_341c7b5b432a3158
                    dba: Network Merchant Inc
                    reject_reason: ''
                    partner_identifier: partner-ref-12345
    servers:
    - url: https://sandbox.signup.nmi.com/api/v1
      description: Sandbox
    - url: https://secure.nmi.com/api/v5/signup
      description: Production
  application.merchant.closed:
    post:
      tags:
      - Webhook Events
      summary: Merchant account is closed
      description: This event is triggered when the merchant account is closed.
      operationId: sendApplicationMerchantClosedEvent
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  maxLength: 36
                  example: 38cf9efa-8aec-4a4e-98e2-6bb2411fdc60
                event_type:
                  allOf:
                  - $ref: '#/components/schemas/event-types'
                  - example: application.merchant.closed
                event_body:
                  type: object
                  required:
                  - app_id
                  - dba
                  - mid
                  - reject_reason
                  properties:
                    app_id:
                      type: string
                      minLength: 20
                      maxLength: 20
                      example: app_341c7b5b432a3158
                    dba:
                      type: string
                      maxLength: 255
                      example: Network Merchant Inc
                    mid:
                      type: string
                      maxLength: 30
                      example: '1234000000000011'
                    reject_reason:
                      type: string
                      maxLength: 255
                      example: Compliance Issue
                    partner_identifier:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Optional partner-supplied identifier captured on the originating public sign-up form, echoed back so partners can correlate this event with their submission. Null when no identifier was captured for the lead.
                      example: partner-ref-12345
            examples:
              eventExample:
                summary: Merchant Account Closed
                description: This is an example of a webhook payload when the merchant account is closed.
                value:
                  event_id: 38cf9efa-8aec-4a4e-98e2-6bb2411fdc60
                  event_type: application.merchant.closed
                  event_body:
                    app_id: app_341c7b5b432a3158
                    dba: Network Merchant Inc
                    mid: '1234000000000011'
                    reject_reason: Compliance Issue
                    partner_identifier: partner-ref-12345
    servers:
    - url: https://sandbox.signup.nmi.com/api/v1
      description: Sandbox
    - url: https://secure.nmi.com/api/v5/signup
      description: Production
  application.merchant.boarded:
    post:
      tags:
      - Webhook Events
      summary: Merchant is ready to process
      description: This event is triggered when the merchant is boarded and ready to process.
      operationId: sendApplicationMerchantBoardedEvent
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  maxLength: 36
                  example: 38cf9efa-8aec-4a4e-98e2-6bb2411fdc60
                event_type:
                  allOf:
                  - $ref: '#/components/schemas/event-types'
                  - example: application.merchant.boarded
                event_body:
                  type: object
                  required:
                  - app_id
                  - dba
                  - mid
                  - gateway_id
                  properties:
                    app_id:
                      type: string
                      minLength: 20
                      maxLength: 20
                      example: app_341c7b5b432a3158
                    dba:
                      type: string
                      maxLength: 255
                      example: Network Merchant Inc
                    mid:
                      type: string
                      maxLength: 30
                      example: '1234000000000011'
                    gateway_id:
                      type: string
                      maxLength: 30
                      example: '4532454'
                    partner_identifier:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Optional partner-supplied identifier captured on the originating public sign-up form, echoed back so partners can correlate this event with their submission. Null when no identifier was captured for the lead.
                      example: partner-ref-12345
            examples:
              eventExample:
                summary: Merchant Boarded
                description: The merchant is boarded and ready to process.
                value:
                  event_id: 38cf9efa-8aec-4a4e-98e2-6bb2411fdc60
                  event_type: application.merchant.boarded
                  event_body:
                    app_id: app_341c7b5b432a3158
                    dba: Network Merchant Inc
                    mid: '1234000000000011'
                    gateway_id: '545632'
                    partner_identifier: partner-ref-12345
    servers:
    - url: https://sandbox.signup.nmi.com/api/v1
      description: Sandbox
    - url: https://secure.nmi.com/api/v5/signup
      description: Production
  merchant.chargeback.added:
    post:
      tags:
      - Webhook Events
      summary: 'Merchant: New Chargeback'
      description: This event is triggered when a chargeback is added for a merchant.
      operationId: sendMerchantChargebackAddedEvent
      security: []
      requestBody:
